<script>
(function(){

  function E(tag,attrs,parent){

    out.push(pts[pts.length-1]); return out;

  /* ---------- terrain: ruts, cobbles, tufts and frost writing ---------- */
  function tuft(x,y,s,p){

  for(i=0;i<18;i++){

  for(i=0;i<9;i++){frond(rr(1420,1490),rr(660,810),rr(0.45,0.8),gTerr,'#d8d6c8');}
  for(i=0;i<10;i++){frond(rr(700,880),rr(480,540),rr(0.5,0.9),gTerr);}

  /* ---------- water: the Slip Brook and the Ilm ---------- */
  var brook=jit([[1620,1090],[1700,1140],[1770,1190],[1830,1240],[1910,1290],[1980,1350],[2060,1410],[2160,1470],[2280,1512]],3.2,18);
  for(k=0;k<brook.length-1;k++){
    E('line',{x1:brook[k][0],y1:brook[k][1],x2:brook[k+1][0],y2:brook[k+1][1],
      stroke:SEA,'stroke-width':Math.max(1.2,7-k*0.45),'stroke-linecap':'round',opacity:0.42},gWater);

  /* ---------- structures ---------- */
  /* the well itself: little roof, irregular curb, eleven links and a twelfth in the hand */
  function yardWell(x,y,s,p){
    var g=E('g',{transform:'translate('+x.toFixed(1)+' '+y.toFixed(1)+') scale('+s.toFixed(2)+')'},p),j;

      E('line',{x1:-54+j*10.8,y1:-99+j*2.9,x2:-49+j*10.8,y2:-118+j*2.9,

    /* the curb, built of uneven stones */

    E('ellipse',{cx:0,cy:0,rx:23,ry:10,fill:'#72877b',stroke:'none',opacity:0.85},g);
    E('path',{d:'M-15 -1 q14 -4 28 0',fill:'none',stroke:'#cbd7c6','stroke-width':1,opacity:0.7},g);

    E('path',{d:'M-58 -74 L0 -88 L58 -74',fill:'none',stroke:INK,'stroke-width':3,'stroke-linejoin':'round'},g);
    E('path',{d:'M-58 -80 L0 -94 L58 -80',fill:'none',stroke:FADE,'stroke-width':1,opacity:0.6},g);
    E('line',{x1:0,y1:-86,x2:0,y2:-30,stroke:FADE,'stroke-width':1.8},g);
    for(j=0;j<11;j++){
      E('ellipse',{cx:0,cy:-82+j*5,rx:2.5,ry:3.4,fill:'none',stroke:INK,'stroke-width':1},g);
    }
    E('ellipse',{cx:10,cy:-30,rx:2.8,ry:4,fill:'none',stroke:RED,'stroke-width':1.5},g);

    }
  }

    }

    var g=E('g',{transform:'translate('+x.toFixed(1)+' '+y.toFixed(1)+') scale('+s.toFixed(2)+')'},p);

    E('path',{d:'M14 6 q10 4 9 17 l-13 -1 z',fill:'none',stroke:INK,'stroke-width':1.1},g);
  }

  /* faint neighbourhood: the terrace, the Vail roof, the racks, the houses */
  var faint=E('g',{opacity:0.48}); gStruct.appendChild(faint);
  for(i=0;i<6;i++){house(760+i*74,318+((i%2)?6:0),0.78,faint);}
  E('path',{d:'M700 352 q120 8 260 0 q120 -8 250 2',fill:'none',stroke:FADE,'stroke-width':1,'stroke-dasharray':'3 6',opacity:0.7},faint);
  kilnHouse(700,700,0.92,faint);
  E('path',{d:'M788 762 q10 -8 20 0',fill:'none',stroke:INK,'stroke-width':1.2,opacity:0.8},faint);
  house(700,1012,0.85,faint);
  /* the birth-flower shrine, a crossed stone a few paces east */
  E('path',{d:'M890 1058 L890 1034 M878 1046 L902 1046',fill:'none',stroke:INK,'stroke-width':2,opacity:0.8},faint);

  /* ---------- marginal notes in the surveyor's voice ---------- */
  note(110,296,[
    'This is not the well that never freezes on the ridge.',
    'That one is a sister of the Nine. This one gives every',
    'morning of the year and has never given a sign it heard',
    'a priest, an assessor or a figure.'
  ],{size:15,fill:'#574226'});
  note(110,452,[
    'On Ilmen 2 the water tasted different and the ice was',
    'honeyed under the mud. The yard called it a warm spell,',
    'then weather. Nobody said the word for the thaw, and',
    'the bucket went down into it all the same.'
  ],{size:15,fill:'#574226'});
  note(110,608,[
    'In Frost the writing stood up white on the north lip',
    'where the Warm had gone out of the stone. It stayed past',
    'noon and came back of itself. The rope went over the',
    'writing without touching it, and the yard called it weather.'
  ],{size:15,fill:'#574226'});
  note(110,764,[
    'A woman waiting her turn spoke to the boards and the',
    'well-roof of a runner who once carried a figure that named',
    'a person she knew. No owner stood under the word, and five',
    'shapings are five, not a witness and not a sixth.'
  ],{size:15,fill:'#574226'});
  note(110,920,[
    'A man come downriver with road-mud on his boots told twice',
    'of a counting room shut in the last war with the damper',
    'closed and the men dead of the breath, eighteen leagues east.',
    'A curiosity with a date. The two tellings do not touch.'
  ],{size:15,fill:'#574226'});

  note(1660,296,[
    'Eleven links go to the water and the twelfth hangs in the',
    'hand. A man of the College said the twelfth is kept back',
    'for the Hearth. The chain does not straighten and the',
    'printed figure travels. Both stand; neither enters the other.'
  ],{size:15,fill:'#574226'});
  note(1660,452,[
    'A number comes up out of a shut fist toward the well, is',
    'looked at, and goes back into the sleeve. From fist to mouth',
    'to shoulder it goes, and arrives nowhere. No slate is opened',
    'and no signature stands on the space where it was.'
  ],{size:15,fill:'#574226'});
  note(1660,608,[
    'She draws with the pail against her knee, clay pale in the',
    'nail crescents and rack dust in one thumb seam. The hand',
    'goes to the sleeve before the eyes go to the asker. Ask the',
    'pot what it cost. I keep the count, not the account.'
  ],{size:15,fill:'#574226'});
  note(1660,764,[
    'On Frost 9 the skin was broken with the back of a broken',
    'pot and a plate of ice clouded with silt was lifted off and',

    'standing where the weather was told to stand.'
  ],{size:15,fill:'#574226'});
  note(1660,920,[
