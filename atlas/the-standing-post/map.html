svg{display:block;position:absolute;inset:0;width:2400px;height:1600px;}
</style>
</head>
<body>
<div id="paper"></div>
<svg id="m" viewBox="0 0 2400 1600" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
(function(){
  'use strict';
  var NS='http://www.w3.org/2000/svg';
  var svg=document.getElementById('m');
  var INK='#2b1b0e', FADE='#6b5331', RED='#7e1f14', SEA='#547a72', SEAWASH='#a9bfb2',
      GOLD='#a9833c', GREEN='#7c8a5e', MG='#5d6b46', PALE='#efe3c6', ASH='#9a9080',
      EARTH='#d8c8a4', CLAY='#cbb58f', PEAT='#4a3827', TURF='#6d5a3e', BOG='#8f8a63';

  function E(tag,attrs,parent){
    var n=document.createElementNS(NS,tag),k;
    for(k in attrs){ if(attrs[k]!==null && attrs[k]!==undefined && attrs[k]!==''){ n.setAttribute(k,attrs[k]); } }
    (parent||svg).appendChild(n);
    return n;
  }
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
  var rnd=mulberry32(813201);
  function rr(a,b){return a+(b-a)*rnd();}
  function jit(pts,amp,seg){
    seg=seg||7; var out=[],i,s;
    for(i=0;i<pts.length-1;i++){
      var x1=pts[i][0],y1=pts[i][1],x2=pts[i+1][0],y2=pts[i+1][1];
      var dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy)||1;
      var nx=-dy/len,ny=dx/len,n=Math.max(1,Math.round(len/seg));
      for(s=0;s<n;s++){ var t=s/n,o=(rnd()-0.5)*2*amp; out.push([x1+dx*t+nx*o,y1+dy*t+ny*o]); }
    }
    out.push(pts[pts.length-1]); return out;
  }
  function D(pts,close){
    var s='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
    for(var i=1;i<pts.length;i++){s+=' L'+pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1);}
    return close?s+' Z':s;
  }

  /* ---------- layers, inked in order; every lettering goes on last ---------- */
  var defs=E('defs',{});
  E('image',{x:0,y:0,width:2400,height:1600,href:'../../design/textures/parchment.jpg',preserveAspectRatio:'xMidYMid slice',opacity:0.52});
  var gWash=E('g',{}), gTerr=E('g',{}), gWater=E('g',{}), gStruct=E('g',{}),
      gRoad=E('g',{}), gFrame=E('g',{}), gText=E('g',{});
  var i,k;

  /* foxing, the fold, and the old damp of the paper */
  for(i=0;i<30;i++){
    E('ellipse',{cx:rr(80,2320),cy:rr(80,1520),rx:rr(16,84),ry:rr(10,52),
      fill:'#8a612f',opacity:rr(0.012,0.05),transform:'rotate('+rr(0,180)+' '+rr(200,2200)+' '+rr(200,1400)+')'},gWash);
  }
  [700,1420,2060].forEach(function(x){E('line',{x1:x,y1:60,x2:x+2,y2:1540,stroke:'#7a5a30','stroke-width':1,opacity:0.07},gWash);});
  E('line',{x1:60,y1:806,x2:2340,y2:806,stroke:'#7a5a30','stroke-width':1,opacity:0.05},gWash);

  /* the whole wet country: low marsh with bays, tongues and dry islands */
  E('path',{d:D(jit([[60,336],[360,310],[700,332],[980,306],[1300,330],[1620,304],[1960,336],[2340,320],
                      [2340,1300],[2060,1288],[1800,1322],[1520,1294],[1240,1332],[940,1300],[660,1328],[380,1304],[60,1328]],4.2,30),true),
    fill:BOG,opacity:0.20},gWash);
  /* the black peat, deeper and darker, east and south-east of the Post */
  E('path',{d:D(jit([[1640,540],[1960,512],[2260,540],[2340,640],[2340,1010],[2120,1046],[1880,1008],[1700,946],[1600,822],[1620,650]],4,26),true),
    fill:PEAT,opacity:0.17},gWash);
  E('path',{d:D(jit([[1500,1010],[1760,986],[1980,1010],[2100,1080],[2000,1180],[1720,1160],[1520,1110]],3.6,24),true),
    fill:PEAT,opacity:0.13},gWash);
  /* the dry hummock on which the Post and its huts stand */
  E('path',{d:D(jit([[880,596],[1050,552],[1260,548],[1440,580],[1540,654],[1500,760],[1330,818],[1080,820],[900,776],[840,680]],3.2,20),true),
    fill:CLAY,opacity:0.30},gWash);
  /* another dry stand by the eastern way */
  E('path',{d:D(jit([[1990,690],[2140,668],[2260,690],[2300,742],[2220,792],[2040,786],[1960,744]],3,18),true),
    fill:CLAY,opacity:0.22},gWash);
  /* Sere beyond the Line: a warm, dry, untrusted edge */
  E('path',{d:D(jit([[60,1290],[420,1270],[800,1296],[1180,1274],[1560,1300],[1940,1278],[2340,1304],
                      [2340,1560],[60,1560]],3.8,28),true),
    fill:GOLD,opacity:0.13},gWash);

  /* ---------- a tapered, hand-drawn cut and its banks ---------- */
  function river(center,w0,w1,col,wash,p){
    var bankA=[],bankB=[],norm=[],half=[];
    for(k=0;k<center.length;k++){
      var a=center[Math.max(0,k-1)],b=center[Math.min(center.length-1,k+1)];
      var dx=b[0]-a[0],dy=b[1]-a[1],le=Math.sqrt(dx*dx+dy*dy)||1;
      var nx=-dy/le,ny=dx/le,t=k/(center.length-1);
      var w=(w0+(w1-w0)*t)*(0.88+Math.sin(k*0.83)*0.09)*(0.62+0.38*Math.sin(Math.PI*(0.16+0.84*t)));
      bankA.push([center[k][0]+nx*w+rr(-3,3),center[k][1]+ny*w+rr(-3,3)]);
      bankB.push([center[k][0]-nx*w+rr(-3,3),center[k][1]-ny*w+rr(-3,3)]);
      norm.push([nx,ny]); half.push(w);
    }
    E('path',{d:D(bankA.concat(bankB.slice().reverse()),true),fill:wash,opacity:0.66},p);
    E('path',{d:D(center),fill:'none',stroke:col,'stroke-width':2.2,'stroke-linecap':'round',opacity:0.34},p);
    for(var q=0;q<44;q++){
      var j=Math.floor(rr(1,center.length-2)),f=rr(-0.72,0.72);
      E('path',{d:'M'+(center[j][0]+norm[j][0]*half[j]*f).toFixed(1)+' '+(center[j][1]+norm[j][1]*half[j]*f).toFixed(1)+' q9 -3 19 0',
        fill:'none',stroke:col,'stroke-width':1,opacity:rr(0.10,0.24)},p);
    }
    [bankA,bankB].forEach(function(bank){
      E('path',{d:D(bank),fill:'none',stroke:INK,'stroke-width':1.6,'stroke-linejoin':'round'},p);
      for(var m=2;m<bank.length-1;m+=2){
        var a=bank[m-1],b=bank[m+1],dx=b[0]-a[0],dy=b[1]-a[1],le=Math.sqrt(dx*dx+dy*dy)||1;
        E('line',{x1:bank[m][0],y1:bank[m][1],x2:bank[m][0]-dy/le*7+dx/le*3,y2:bank[m][1]+dx/le*7+dy/le*3,
          stroke:INK,'stroke-width':0.8,opacity:0.28},p);
      }
    });
    return {a:bankA,b:bankB,c:center,h:half};
  }
  function mere(cx,cy,rx,ry,p){
    var pts=[],n=26,q;
    for(q=0;q<n;q++){
      var a=q/n*Math.PI*2, w=0.82+0.18*Math.sin(q*1.7)+rr(-0.07,0.07);
      pts.push([cx+Math.cos(a)*rx*w,cy+Math.sin(a)*ry*w]);
    }
    E('path',{d:D(pts,true),fill:SEAWASH,opacity:0.48,stroke:INK,'stroke-width':1.5},p);
    for(q=0;q<9;q++){
      var yy=cy-ry*0.6+q*(ry*1.2/8), hw=rx*0.7*Math.sqrt(Math.max(0,1-Math.pow((yy-cy)/ry,2)));
      E('path',{d:'M'+(cx-hw*rr(0.5,0.95)).toFixed(1)+' '+yy.toFixed(1)+' q'+(hw*0.5).toFixed(1)+' -3 '+hw.toFixed(1)+' 0',
        fill:'none',stroke:SEA,'stroke-width':1,opacity:rr(0.16,0.32)},p);
    }
  }

  /* ---------- terrain ---------- */
  function reed(x,y,s,p){
    var g=E('g',{transform:'translate('+x.toFixed(1)+' '+y.toFixed(1)+') scale('+s.toFixed(2)+')'},p);
    E('path',{d:'M-5 3 q-3 -10 -7 -15 M0 3 L0 -19 M5 3 q3 -9 8 -14 M-2 3 q-2 -7 -4 -11',
      fill:'none',stroke:MG,'stroke-width':1.1,opacity:0.85},g);
    E('path',{d:'M0 -19 l-2 -5 M-7 -12 l-2 -5 M8 -11 l2 -5',fill:'none',stroke:FADE,'stroke-width':0.9,opacity:0.7},g);
  }
  function sedge(x,y,s,p){
    var g=E('g',{transform:'translate('+x.toFixed(1)+' '+y.toFixed(1)+') scale('+s.toFixed(2)+')'},p);
    E('path',{d:'M-6 3 q-1 -9 -5 -14 M-2 3 q0 -11 -2 -16 M2 3 q2 -10 5 -15 M6 3 q3 -7 7 -11',
      fill:'none',stroke:TURF,'stroke-width':1.0,opacity:0.75},g);
  }
  function hummock(x,y,s,p){
    var g=E('g',{transform:'translate('+x.toFixed(1)+' '+y.toFixed(1)+') scale('+s.toFixed(2)+')'},p);
    E('path',{d:'M-16 2 q16 -13 32 0',fill:'none',stroke:FADE,'stroke-width':1.1,opacity:0.5},g);
    E('path',{d:'M-10 0 q10 -8 20 0',fill:'none',stroke:FADE,'stroke-width':0.8,opacity:0.35},g);
  }
  function willow(x,y,s,p){
    var g=E('g',{transform:'translate('+x.toFixed(1)+' '+y.toFixed(1)+') scale('+s.toFixed(2)+')'},p);
    E('path',{d:'M0 6 L0 -8 M0 -8 q-13 -4 -16 -14 M0 -8 q13 -4 16 -14 M0 -4 q-8 -5 -10 -13',
      fill:'none',stroke:INK,'stroke-width':1.2,opacity:0.72},g);
    E('path',{d:'M-16 -22 q6 -10 12 -2 M4 -22 q6 -10 12 2 M-10 -17 q5 -8 10 -1',
      fill:'none',stroke:MG,'stroke-width':1.0,opacity:0.7},g);
  }
  for(i=0;i<210;i++){ reed(rr(120,2340),rr(340,1290),rr(0.48,1.02),gTerr); }
  for(i=0;i<90;i++){ sedge(rr(120,2340),rr(340,1290),rr(0.5,1.0),gTerr); }
  for(i=0;i<34;i++){ hummock(rr(160,2300),rr(360,1280),rr(0.7,1.4),gTerr); }
  for(i=0;i<14;i++){ willow(rr(180,2300),rr(380,1270),rr(0.6,1.1),gTerr); }

  /* ---------- water: drainage cuts, the ferry cut and the meres ---------- */
  var cutA=river(jit([[60,980],[320,966],[600,944],[860,930],[1120,918]],2.6,16),4,9,SEA,SEAWASH,gWater);
  var cutB=river(jit([[1220,850],[1340,950],[1420,1060],[1500,1170],[1560,1290]],2.6,16),4,9,SEA,SEAWASH,gWater);
  var cutC=river(jit([[1800,560],[1860,680],[1900,800],[1920,920],[1930,1040]],2.4,15),3,7,SEA,SEAWASH,gWater);
  var cutD=river(jit([[430,1290],[480,1180],[540,1080],[610,1000]],2.2,14),2.5,6,SEA,SEAWASH,gWater);
  var cutE=river(jit([[2060,1290],[2100,1180],[2140,1080],[2180,990]],2.2,14),2.5,6,SEA,SEAWASH,gWater);
  mere(720,724,108,54,gWater);
  mere(1630,730,84,42,gWater);
  mere(1060,1120,96,46,gWater);
  mere(2210,880,60,34,gWater);

  /* ---------- structures at the Standing Post ---------- */
  function carvedPost(x,y,s,p){
    var g=E('g',{transform:'translate('+x+' '+y+') scale('+s+')'},p);
    E('path',{d:'M-7 8 L-6 -70 L6 -70 L7 8 Z',fill:'#b9a17c',stroke:INK,'stroke-width':1.6},g);
    E('path',{d:'M-6 -70 q6 -9 12 0',fill:'none',stroke:INK,'stroke-width':1.2},g);
    for(var q=0;q<7;q++){
      E('line',{x1:-6,y1:-58+q*8,x2:6,y2:-58+q*8,stroke:INK,'stroke-width':1.1,opacity:0.72},g);
    }
    E('path',{d:'M-7 8 q7 5 14 0',fill:'none',stroke:FADE,'stroke-width':1},g);
    return g;
  }
  function dryBoards(x,y,p){
    var g=E('g',{},p);
    E('path',{d:'M'+(x-160)+' '+y+' L'+(x+170)+' '+(y-6)+' L'+(x+180)+' '+(y+66)+' L'+(x-150)+' '+(y+72)+' Z',
      fill:'#c9b58f',stroke:INK,'stroke-width':1.6},g);
    for(var j=0;j<11;j++){
      E('line',{x1:x-158+j*30,y1:y+1,x2:x-150+j*30,y2:y+70,stroke:FADE,'stroke-width':0.9,opacity:0.62},g);
    }
    E('line',{x1:x-158,y1:y+34,x2:x+174,y2:y+28,stroke:INK,'stroke-width':0.8,opacity:0.4},g);
    for(var q=0;q<4;q++){
      E('line',{x1:x-130+q*96,y1:y+72,x2:x-130+q*96,y2:y+86,stroke:INK,'stroke-width':1.5},g);
    }
    return g;
  }
  function reeveStone(x,y,p){
    var g=E('g',{transform:'translate('+x+' '+y+')'},p);
    E('path',{d:'M-46 16 L-40 -14 L-14 -22 L24 -18 L44 0 L40 18 Z',fill:'#b3a585',stroke:INK,'stroke-width':1.6},g);
    E('path',{d:'M-40 -14 L-8 2 L24 -18 M-14 -22 L-8 2',fill:'none',stroke:INK,'stroke-width':0.8,opacity:0.5},g);
    E('rect',{x:-12,y:-9,width:26,height:16,fill:'#7a6748',stroke:INK,'stroke-width':1.1},g);
    for(var q=0;q<3;q++){
      E('rect',{x:-9+q*8,y:-5+q*2,width:6,height:6,fill:TURF,stroke:INK,'stroke-width':0.7},g);
    }
    return g;
  }
  function looseBoard(x,y,p){
    var g=E('g',{transform:'translate('+x+' '+y+') rotate(11)'},p);
    E('rect',{x:-30,y:-5,width:60,height:10,fill:'#c9b58f',stroke:INK,'stroke-width':1.3},g);
    E('path',{d:'M-24 0 L18 0',fill:'none',stroke:FADE,'stroke-width':0.7,opacity:0.6},g);
    return g;
  }
  function fenHut(x,y,s,p){
    var g=E('g',{transform:'translate('+x+' '+y+') scale('+s+')'},p);
    E('line',{x1:-12,y1:2,x2:-12,y2:16,stroke:INK,'stroke-width':1.6},g);
    E('line',{x1:12,y1:2,x2:12,y2:16,stroke:INK,'stroke-width':1.6},g);
    E('line',{x1:-3,y1:2,x2:-3,y2:16,stroke:INK,'stroke-width':1.3},g);
    E('line',{x1:5,y1:2,x2:5,y2:16,stroke:INK,'stroke-width':1.3},g);
    E('rect',{x:-15,y:-6,width:30,height:9,fill:'#d8c8a4',stroke:INK,'stroke-width':1.3},g);
    E('path',{d:'M-19 -6 L0 -22 L19 -6 Z',fill:BOG,stroke:INK,'stroke-width':1.5},g);
    for(var t=0;t<5;t++){
      E('line',{x1:-17+t*8,y1:-7,x2:-8+t*8,y2:-18,stroke:FADE,'stroke-width':0.7,opacity:0.6},g);
    }
    E('rect',{x:-3,y:-1,width:6,height:5,fill:'#6b5331',stroke:INK,'stroke-width':0.8},g);
    return g;
  }
  function peatStack(x,y,s,p){
    var g=E('g',{transform:'translate('+x+' '+y+') scale('+s+')'},p);
    E('path',{d:'M-16 6 L-14 -16 L14 -16 L16 6 Z',fill:TURF,stroke:INK,'stroke-width':1.4},g);
    for(var t=0;t<4;t++){ E('line',{x1:-15,y1:-12+t*6,x2:15,y2:-12+t*6,stroke:PEAT,'stroke-width':0.8,opacity:0.5},g); }
    E('path',{d:'M-17 -16 q17 -7 34 0',fill:'none',stroke:FADE,'stroke-width':1.1},g);
    return g;
  }
  function punt(x,y,s,p){
    var g=E('g',{transform:'translate('+x+' '+y+') scale('+s+')'},p);
    E('path',{d:'M-26 0 q26 11 52 0 l-8 8 q-18 5 -36 0 z',fill:'#c9b58f',stroke:INK,'stroke-width':1.3},g);
    E('line',{x1:-14,y1:2,x2:14,y2:2,stroke:FADE,'stroke-width':0.8,opacity:0.6},g);
    return g;
  }
  function tallyStick(x,y,rot,p){
    var g=E('g',{transform:'translate('+x+' '+y+') rotate('+rot+')'},p);
    E('rect',{x:-34,y:-3,width:68,height:6,fill:'#cbb58f',stroke:INK,'stroke-width':1.1},g);
    for(var q=0;q<6;q++){
      E('line',{x1:-26+q*10,y1:-3,x2:-26+q*10,y2:(q===4?6:3),stroke:INK,'stroke-width':q===4?1.8:1},g);
    }
    return g;
  }
  function knot(x,y,p){
    var g=E('g',{transform:'translate('+x+' '+y+')'},p);
    E('path',{d:'M-8 0 q-2 -9 8 -7 q10 2 5 10 q-5 6 -11 1 q-4 -4 3 -7',fill:'none',stroke:'#9a9080','stroke-width':1.8},g);
    E('path',{d:'M-2 -2 q6 6 9 -1',fill:'none',stroke:FADE,'stroke-width':1,opacity:0.7},g);
    return g;
  }

  /* the Post itself */
  dryBoards(1180,700,gStruct);
  carvedPost(1180,676,1.0,gStruct);
  reeveStone(1180,842,gStruct);
  looseBoard(1362,752,gStruct);
  tallyStick(1050,770,-8,gStruct);
  knot(1310,822,gStruct);
  /* huts on posts around the dry stand */
  [[940,620],[1010,600],[1360,598],[1440,626],[960,872],[1050,898],[1390,884],[1470,860]
  ].forEach(function(h){ fenHut(h[0],h[1],rr(0.78,1.04),gStruct); });
  /* peat stacks and two punts in the cuts */
  [[1540,700],[1588,712],[1630,700],[900,1010],[948,1020]].forEach(function(t){peatStack(t[0],t[1],rr(0.8,1.05),gStruct);});
  punt(800,932,0.95,gStruct);
  punt(1484,1080,0.9,gStruct);
  /* a ferry plank and standing posts at the cut crossing */
  E('path',{d:'M840 960 q40 8 80 0',fill:'none',stroke:'#b9a17c','stroke-width':6},gStruct);
  E('line',{x1:822,y1:948,x2:822,y2:976,stroke:INK,'stroke-width':1.6},gStruct);
  E('line',{x1:938,y1:948,x2:938,y2:976,stroke:INK,'stroke-width':1.6},gStruct);
  /* tally-sticks set along the Line */
  [[560,1246],[900,1260],[1260,1238],[1600,1264],[1940,1244],[2240,1266]].forEach(function(t){
    tallyStick(t[0],t[1],rr(-12,12),gStruct);
  });

  /* Reedholt and Mud End drawn faint far off at the north-east edge, for neighbourhood only */
  [[2260,366],[2300,372],[2270,400]].forEach(function(h){
    var g=E('g',{opacity:0.4},gStruct); fenHut(h[0],h[1],0.8,g);
  });
  [[2130,332],[2166,338]].forEach(function(h){
    var g=E('g',{opacity:0.34},gStruct); fenHut(h[0],h[1],0.72,g);
  });

  /* ---------- roads and ways, never marking which boards bear a man ---------- */
  function edgeArrow(x,y,dir,p){
    E('path',{d:'M'+x+' '+y+' L'+(x+dir*50)+' '+y+' M'+(x+dir*50)+' '+y+' l'+(dir*-10)+' -6 M'+(x+dir*50)+' '+y+' l'+(dir*-10)+' 6',
      fill:'none',stroke:INK,'stroke-width':1.7},p);
  }
  /* the mud road east toward Mud End, the south bridge and Sill */
  E('path',{d:D(jit([[2340,430],[2100,470],[1860,510],[1640,556],[1440,606],[1280,648]],2.6,22)),
    fill:'none',stroke:INK,'stroke-width':2.3,'stroke-dasharray':'8 6','stroke-linecap':'round',opacity:0.82},gRoad);
  /* the way north-west from the Post: toward the Quiet Acre and Grath, drawn nowhere */
  E('path',{d:D(jit([[1180,580],[1000,520],[800,470],[580,410],[300,350],[60,318]],2.6,24)),
