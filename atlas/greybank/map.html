<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Greybank, the Court's gate</title>
<style>
@font-face{font-family:Fell;src:url('../../fonts/IMFeENrm28P.otf');}
@font-face{font-family:FellIt;src:url('../../fonts/IMFeENit28P.otf');}
@font-face{font-family:FellSC;src:url('../../fonts/IMFeENsc28P.otf');}
@font-face{font-family:Cinzel;src:url('../../fonts/Cinzel-Regular.ttf');}
@font-face{font-family:CinzelDec;src:url('../../fonts/CinzelDecorative-Bold.ttf');}
@font-face{font-family:Garamond;src:url('../../fonts/EBGaramond-Regular.otf');}
html,body{margin:0;width:1600px;height:2200px;overflow:hidden;background:#c9b791;}
#paper{position:absolute;inset:0;background:
  radial-gradient(ellipse at 46% 44%, rgba(255,249,228,.42), rgba(125,90,50,.12) 62%, rgba(66,42,20,.32) 100%),
  linear-gradient(99deg, rgba(150,110,62,.10), rgba(255,250,230,.06) 42%, rgba(120,80,40,.11));}
svg{display:block;position:absolute;inset:0;width:1600px;height:2200px;}
</style>
</head>
<body>
<div id="paper"></div>
<svg id="m" viewBox="0 0 1600 2200" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
(function(){
  'use strict';
  var NS='http://www.w3.org/2000/svg';
  var svg=document.getElementById('m');
  var INK='#2b1b0e', FADE='#6b5331', RED='#7e1f14', SEA='#547a72',
      SEAWASH='#a9bfb2', GOLD='#a9833c', GREEN='#7c8a5e', MG='#5d6b46',
      SLIP='#9a8f76', PAPER='#e9d9b6';

  function E(tag,attrs,parent){
    var n=document.createElementNS(NS,tag),k;
    for(k in attrs){ if(attrs[k]!==null && attrs[k]!==undefined && attrs[k]!==''){ n.setAttribute(k,attrs[k]); } }
    (parent||svg).appendChild(n);
    return n;
  }
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
  var rnd=mulberry32(4180812);
  function rr(a,b){return a+(b-a)*rnd();}

  function jit(pts,amp,seg){
    seg=seg||8; var out=[],i,s;
    for(i=0;i<pts.length-1;i++){
      var x1=pts[i][0],y1=pts[i][1],x2=pts[i+1][0],y2=pts[i+1][1];
      var dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy)||1;
      var nx=-dy/len,ny=dx/len,n=Math.max(1,Math.round(len/seg));
      for(s=0;s<n;s++){ var t=s/n,o=(rnd()-0.5)*2*amp; out.push([x1+dx*t+nx*o,y1+dy*t+ny*o]); }
    }
    out.push(pts[pts.length-1]); return out;
  }
  function D(pts,close){
    var s='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
    for(var i=1;i<pts.length;i++){s+=' L'+pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1);}
    return close?s+' Z':s;
  }

  /* ---------- layers ---------- */
  E('defs',{});
  E('image',{x:0,y:0,width:1600,height:2200,href:'../../design/textures/parchment.jpg',preserveAspectRatio:'xMidYMid slice',opacity:0.5});
  var gWash=E('g',{}), gTerr=E('g',{}), gWater=E('g',{}), gRoad=E('g',{}),
      gBuild=E('g',{}), gFrame=E('g',{}), gLabel=E('g',{});

  /* foxing, water-marks and the ghost of a fold */
  for(var fi=0;fi<32;fi++){
    E('ellipse',{cx:rr(70,1530),cy:rr(70,2130),rx:rr(14,66),ry:rr(9,40),
      fill:'#8a612f',opacity:rr(0.012,0.05),transform:'rotate('+rr(0,180)+' '+rr(200,1400)+' '+rr(300,1900)+')'},gWash);
  }
  [540,1080].forEach(function(x){E('line',{x1:x,y1:60,x2:x+2,y2:2140,stroke:'#7a5a30','stroke-width':1,opacity:0.07},gWash);});
  E('line',{x1:56,y1:1130,x2:1544,y2:1130,stroke:'#7a5a30','stroke-width':1,opacity:0.06},gWash);

  /* soft ground washes: the dry Court terrace, the working flat, the wet south bank */
  function wash(pts,color,op){E('path',{d:D(jit(pts,7,26),true),fill:color,opacity:op},gWash);}
  wash([[70,560],[420,538],[900,552],[1360,568],[1540,610],[1540,990],[1120,1006],[560,996],[70,968]],'#d8c8a2',0.17);
  wash([[60,1046],[480,1038],[1000,1052],[1540,1062],[1540,1188],[1000,1202],[480,1194],[60,1182]],'#a9bcb2',0.20);
  wash([[70,1200],[520,1190],[1060,1206],[1540,1196],[1540,1740],[1060,1766],[520,1752],[70,1730]],'#d8bf90',0.15);
  wash([[300,1660],[720,1648],[1140,1662],[1240,1880],[680,1900],[260,1876]],'#cfc9a8',0.16);
  wash([[1160,1480],[1540,1470],[1540,1860],[1180,1874]],'#c2b79a',0.13);

  /* ---------- terrain ---------- */
  function tree(x,y,s,p){
    var g=E('g',{transform:'translate('+x+' '+y+') scale('+s+')'},p);
    E('path',{d:'M0 0 L0 -14',stroke:INK,'stroke-width':1},g);
    E('path',{d:'M-7 -6 L0 -18 L7 -6 Z',fill:GREEN,stroke:INK,'stroke-width':0.8,opacity:0.8},g);
    E('path',{d:'M-4 -12 L0 -21 L4 -12 Z',fill:'#6f7d53',stroke:INK,'stroke-width':0.7,opacity:0.75},g);
  }
  function tuft(x,y,s,p){
    E('path',{d:'M-5 2 q-2 -8 -6 -12 M0 2 L0 -15 M5 2 q2 -7 7 -11 M-2 2 q-1 -6 -3 -9',
      fill:'none',stroke:MG,'stroke-width':1.1,opacity:0.8,
      transform:'translate('+x+' '+y+') scale('+s+')'},p);
  }
  function field(x,y,w,h,crop,p){
    var g=E('g',{},p);
    E('path',{d:D(jit([[x,y],[x+w,y-rr(2,10)],[x+w+rr(0,8),y+h],[x-rr(0,8),y+h+rr(0,6)]],2.4,18),true),
      fill:crop==='turnip'?'#c3c39a':'#d3c48c',stroke:FADE,'stroke-width':1,opacity:0.55},g);
    var k;
    for(k=1;k<7;k++){
      var fx=x+(w*k/7);
      E('path',{d:'M'+fx.toFixed(1)+' '+(y+3)+' q'+(rr(-4,4)).toFixed(1)+' '+(h/2)+' '+(rr(-5,5)).toFixed(1)+' '+(h-4),
        fill:'none',stroke:FADE,'stroke-width':0.8,opacity:0.5},g);
    }
    for(k=0;k<11;k++){
      var sx=x+rr(8,w-8),sy=y+rr(10,h-8);
      E('path',{d:'M'+sx.toFixed(1)+' '+sy.toFixed(1)+' l-2 -5 M'+sx.toFixed(1)+' '+sy.toFixed(1)+' l2 -5',
        fill:'none',stroke:MG,'stroke-width':0.9,opacity:0.65},g);
    }
  }
  /* the lip of the dry terrace on which the Court builds */
  E('path',{d:D(jit([[170,742],[420,736],[700,746],[960,738],[1220,750],[1500,742]],3,16),false),
    fill:'none',stroke:FADE,'stroke-width':2.2,opacity:0.8},gTerr);
  for(var ti=0;ti<64;ti++){
    var hx=rr(180,1490),hy=742+rr(2,12);
    E('line',{x1:hx,y1:hy,x2:hx-4,y2:hy+rr(5,11),stroke:FADE,'stroke-width':0.9,opacity:0.55},gTerr);
  }
  /* willows on the north bank, reeds along the wet south bank */
  for(var wt=0;wt<18;wt++){tree(rr(90,480),rr(940,1004),rr(0.5,0.8),gTerr);}
  for(var rt=0;rt<160;rt++){tuft(rr(70,1530),rr(1186,1256),rr(0.6,1.15),gTerr);}
  for(rt=0;rt<44;rt++){tuft(rr(70,460),rr(1010,1060),rr(0.5,0.9),gTerr);}
  field(1240,1380,240,190,'barley',gTerr);
  field(1250,1600,220,150,'barley',gTerr);
  field(110,1440,200,180,'turnip',gTerr);

  /* ---------- water ---------- */
  function river(pts,w0,w1,p){
    var jp=jit(pts,1.7,14),left=[],right=[],k;
    for(k=0;k<jp.length;k++){
      var a=jp[Math.max(0,k-1)],b=jp[Math.min(jp.length-1,k+1)];
      var dx=b[0]-a[0],dy=b[1]-a[1],le=Math.sqrt(dx*dx+dy*dy)||1;
      var nx=-dy/le,ny=dx/le,t=k/(jp.length-1),w=w0+(w1-w0)*t;
      left.push([jp[k][0]+nx*w,jp[k][1]+ny*w]);
      right.push([jp[k][0]-nx*w,jp[k][1]-ny*w]);
    }
    var band=left.concat(right.reverse());
    E('path',{d:D(band,true),fill:SEAWASH,stroke:SEA,'stroke-width':1.1,opacity:0.55},p);
    E('path',{d:D(jp),fill:'none',stroke:SEA,'stroke-width':Math.max(1.2,w1*0.55),'stroke-linecap':'round',opacity:0.85},p);
    E('path',{d:D(jp),fill:'none',stroke:INK,'stroke-width':1,'stroke-linecap':'round',opacity:0.65},p);
  }
  var ilm=[[58,1016],[190,1024],[330,1020],[470,1036],[610,1048],[760,1062],[900,1076],[1050,1090],[1200,1102],[1360,1118],[1548,1132]];
  river(ilm,10,21,gWater);
  /* tide ripples and the grey silt shoals below the quay */
  for(var rp=0;rp<26;rp++){
    var px=rr(120,1460),py=rr(1070,1150);
    E('path',{d:'M'+px.toFixed(1)+' '+py.toFixed(1)+' q7 -3 14 0',fill:'none',stroke:INK,'stroke-width':0.8,opacity:0.35},gWater);
  }
  E('path',{d:D(jit([[560,1070],[760,1082],[940,1098],[960,1110],[740,1098],[540,1086]],2.4,18),true),
    fill:'#a3987c',stroke:FADE,'stroke-width':0.8,opacity:0.35},gWater);
  /* the winter ford: the river that bore no collector in Y.H. 811 */
  E('path',{d:'M636 1038 L690 1088 L744 1140',fill:'none',stroke:RED,'stroke-width':1.6,'stroke-dasharray':'5 7',opacity:0.6},gWater);
  E('path',{d:'M670 1034 L724 1084 L778 1136',fill:'none',stroke:RED,'stroke-width':1.6,'stroke-dasharray':'5 7',opacity:0.6},gWater);

  /* ---------- roads ---------- */
  function road(pts,p,col,dash,w){
    E('path',{d:D(jit(pts,1.8,14)),fill:'none',stroke:col||INK,'stroke-width':w||2,
      'stroke-dasharray':dash||'6 5','stroke-linecap':'round',opacity:0.75},p||gRoad);
  }
  road([[58,936],[260,928],[420,914],[520,900]]);              /* the Clay Road from Sill */
  road([[952,806],[1120,708],[1300,610],[1500,538],[1548,522]]); /* the Salt Road to Vhal */
  road([[1300,934],[1370,1060],[1420,1210],[1460,1380],[1500,1560]]); /* the Hearth Road */
  road([[380,1000],[620,994],[860,1000],[1100,1010]]);        /* the quay street */
  road([[560,1000],[540,930]]);                               /* factor's house to quay */
  road([[900,1000],[900,910]]);                               /* counting house to quay */
  road([[1300,1014],[1240,926]]);                             /* granaries to quay */
  road([[720,1010],[720,1230],[740,1320]]);                   /* ford road down to the south bank */
  road([[240,1010],[220,1200],[260,1320]]);                   /* west bank way */
  road([[1400,1190],[1500,1250],[1540,1360]]);                /* east bank way */

  /* ---------- buildings ---------- */
  function house(x,y,w,h,p,big){
    var g=E('g',{},p);
    var l=x-w/2,r=x+w/2,t=y-h,b=y;
    E('path',{d:'M'+(l-2)+' '+b+' L'+(l+rr(-2,2)).toFixed(1)+' '+(t+4)+' L'+(x-2)+' '+(t-2)+' L'+(r+rr(-2,2)).toFixed(1)+' '+(t+4)+' L'+(r+2)+' '+b+' Z',
      fill:big?'#e6d8b8':'#efe3c6',stroke:INK,'stroke-width':big?1.9:1.5},g);
    E('path',{d:'M'+(l-5)+' '+(t+4)+' L'+x+' '+(t-h*0.42)+' L'+(r+5)+' '+(t+4),
      fill:'none',stroke:INK,'stroke-width':big?1.7:1.2},g);
    E('path',{d:'M'+(x-w*0.13)+' '+b+' L'+(x-w*0.13)+' '+(b-h*0.56)+' L'+(x+w*0.06)+' '+(b-h*0.56)+' L'+(x+w*0.06)+' '+b,
      fill:'none',stroke:INK,'stroke-width':1.1,opacity:0.85},g);
    E('rect',{x:x+w*0.22,y:b-h*0.68,width:w*0.13,height:h*0.2,fill:'none',stroke:INK,'stroke-width':0.9,opacity:0.8},g);
    return g;
  }
  function smoke(x,y,p){
    E('path',{d:'M'+x+' '+y+' q-7 -8 1 -14 q7 -6 0 -12',fill:'none',stroke:INK,
      'stroke-width':1,'stroke-linecap':'round',opacity:0.5},p);
  }
  function granary(x,y,w,h,p){
    var g=E('g',{},p), l=x-w/2,r=x+w/2,t=y-h,b=y;
    E('path',{d:'M'+(l-3)+' '+b+' L'+(l+3)+' '+(t+6)+' L'+x+' '+(t-10)+' L'+(r-3)+' '+(t+6)+' L'+(r+3)+' '+b+' Z',
      fill:'#e4d4ae',stroke:INK,'stroke-width':1.9},g);
    E('path',{d:'M'+(l+6)+' '+(t+5)+' L'+(r-6)+' '+(t+5),fill:'none',stroke:INK,'stroke-width':1,opacity:0.7},g);
    for(var i=0;i<5;i++){
      var vx=l+14+i*(w-28)/4;
      E('path',{d:'M'+vx.toFixed(1)+' '+(t+18)+' L'+vx.toFixed(1)+' '+(t+30),stroke:INK,'stroke-width':1.4,opacity:0.8},g);
    }
    E('path',{d:'M'+(x-15)+' '+b+' L'+(x-15)+' '+(b-h*0.52)+' L'+(x+15)+' '+(b-h*0.52)+' L'+(x+15)+' '+b,
      fill:'#cbbb92',stroke:INK,'stroke-width':1.4},g);
    E('line',{x1:x-15,y1:b-h*0.26,x2:x+15,y2:b-h*0.26,stroke:INK,'stroke-width':0.8,opacity:0.7},g);
    for(var s=0;s<3;s++){
      E('ellipse',{cx:l+18+s*16,cy:b-5,rx:9,ry:5,fill:'#d8c89c',stroke:FADE,'stroke-width':0.8},g);
    }
    return g;
  }
  function counting(x,y,w,h,p){
    var g=E('g',{},p);
    house(x,y,w,h,g,true);
    /* a hanging slate-shield and salt-paper left out in the damp */
    E('path',{d:'M'+(x+w*0.34)+' '+(y-h)+' L'+(x+w*0.34)+' '+(y-h-14)+' L'+(x+w*0.52)+' '+(y-h-14)+' L'+(x+w*0.52)+' '+(y-h)+' Z',
      fill:'#efe3c6',stroke:INK,'stroke-width':1},g);
    E('path',{d:'M'+(x+w*0.37)+' '+(y-h-9)+' L'+(x+w*0.49)+' '+(y-h-9),stroke:RED,'stroke-width':1.2},g);
    for(var i=0;i<3;i++){
      var px=x-w*0.42+i*w*0.12;
      E('path',{d:'M'+px.toFixed(1)+' '+(y-h-2)+' q'+(rr(-6,6)).toFixed(1)+' -8 '+(rr(-8,8)).toFixed(1)+' -16',
        fill:'none',stroke:FADE,'stroke-width':0.9,opacity:0.6},g);
    }
    return g;
  }
  function bankHall(x,y,w,h,p){
    var g=E('g',{},p), l=x-w/2,r=x+w/2,t=y-h,b=y;
    E('path',{d:'M'+(l-4)+' '+b+' L'+(l+4)+' '+(t+8)+' L'+x+' '+(t-8)+' L'+(r-4)+' '+(t+8)+' L'+(r+4)+' '+b+' Z',
      fill:'#e6d8b8',stroke:INK,'stroke-width':2},g);
    E('path',{d:'M'+x+' '+(t-14)+' L'+(x+7)+' '+(t-4)+' L'+(x-7)+' '+(t-4)+' Z',fill:RED,stroke:INK,'stroke-width':0.9},g);
    for(var i=0;i<7;i++){
      var gx=l+16+i*(w-32)/6;
      E('line',{x1:gx,y1:b-h*0.64,x2:gx,y2:b-h*0.14,stroke:INK,'stroke-width':1.3},g);
    }
    E('line',{x1:l+10,y1:b-h*0.64,x2:r-10,y2:b-h*0.64,stroke:INK,'stroke-width':1.4},g);
    E('rect',{x:x-11,y:b-h*0.24,width:22,height:h*0.24,fill:'#cbbb92',stroke:INK,'stroke-width':1.2},g);
    return g;
  }
  function quay(x0,x1,y,p){
    var g=E('g',{},p);
    E('path',{d:'M'+x0+' '+y+' L'+x1+' '+y+' M'+x0+' '+(y+12)+' L'+x1+' '+(y+12),
      stroke:INK,'stroke-width':1.8},g);
    for(var px=x0;px<=x1;px+=22){
      E('line',{x1:px,y1:y,x2:px,y2:y+12,stroke:INK,'stroke-width':0.7,opacity:0.7},g);
      E('line',{x1:px+5,y1:y+12,x2:px+3,y2:y+40,stroke:FADE,'stroke-width':1.1,opacity:0.75},g);
    }
    /* a hand-crane, a barrel and a heap of grain sacks */
    E('path',{d:'M470 '+y+' L470 '+(y-56)+' L516 '+(y-56)+' M516 '+(y-56)+' L516 '+(y-34),
      fill:'none',stroke:INK,'stroke-width':2},g);
    E('path',{d:'M470 '+(y-56)+' L452 '+(y-70),fill:'none',stroke:INK,'stroke-width':1},g);
    E('path',{d:'M1070 '+y+' L1070 '+(y-48)+' L1106 '+(y-48),fill:'none',stroke:INK,'stroke-width':2},g);
    E('ellipse',{cx:1000,cy:y-9,rx:11,ry:14,fill:'#d3be93',stroke:INK,'stroke-width':1.2},g);
    E('path',{d:'M989 '+(y-16)+' q11 -5 22 0 M989 '+(y-2)+' q11 -5 22 0',fill:'none',stroke:INK,'stroke-width':0.8,opacity:0.7},g);
    for(var s=0;s<4;s++){
      E('path',{d:'M'+(700+s*18)+' '+(y-2)+' q9 -12 18 0 z',fill:'#ddc99c',stroke:FADE,'stroke-width':0.9},g);
    }
    return g;
  }
  function barge(x,y,s,p){
    var g=E('g',{transform:'translate('+x+' '+y+') scale('+s+')'},p);
    E('path',{d:'M-44 0 L44 0 L34 12 L-34 12 Z',fill:'#d8c39a',stroke:INK,'stroke-width':1.4},g);
    E('path',{d:'M-12 0 L-12 -22 L20 -22 L20 0',fill:'#e6d8b8',stroke:INK,'stroke-width':1.2},g);
    E('path',{d:'M2 -22 L2 -58 L26 -50',fill:'none',stroke:INK,'stroke-width':1.4},g);
    E('path',{d:'M2 -56 L26 -50 L2 -44 Z',fill:'#b9a276',stroke:INK,'stroke-width':1},g);
    for(var i=0;i<3;i++){E('ellipse',{cx:-26+i*10,cy:-5,rx:6,ry:4,fill:'#d3be93',stroke:FADE,'stroke-width':0.8},g);}
    return g;
  }
  function gull(x,y,s,p){
    var g=E('g',{transform:'translate('+x+' '+y+') scale('+s+')'},p);
    E('path',{d:'M-22 0 q10 -12 22 -2 q12 -10 22 2 q-11 5 -22 -1 q-11 6 -22 -1 z',fill:'none',stroke:INK,'stroke-width':1},g);
    E('path',{d:'M0 -2 l3 -3 l4 2',fill:'none',stroke:INK,'stroke-width':0.9},g);
    E('circle',{cx:1,cy:-3,r:0.9,fill:INK},g);
    return g;
  }
  function grave(x,y,p){
    var g=E('g',{},p);
    E('path',{d:'M'+(x-7)+' '+y+' q7 -7 14 0 z',fill:'#cfc3a3',stroke:FADE,'stroke-width':1},g);
    E('path',{d:'M'+(x-5)+' '+(y-2)+' l2 -6 l3 2 l3 -5 l2 9',fill:'none',stroke:FADE,'stroke-width':0.9},g);
  }
  function slatePost(x,y,p){
    var g=E('g',{},p);
    E('path',{d:'M'+x+' '+y+' L'+x+' '+(y-34)+' L'+(x+20)+' '+(y-34)+' L'+(x+20)+' '+y,
      fill:'none',stroke:INK,'stroke-width':1.4},g);
    E('path',{d:'M'+(x+3)+' '+(y-28)+' L'+(x+17)+' '+(y-28)+' M'+(x+3)+' '+(y-21)+' L'+(x+14)+' '+(y-21),
      stroke:RED,'stroke-width':1,opacity:0.8},g);
  }
  function stall(x,y,p){
    var g=E('g',{},p);
    E('rect',{x:x-16,y:y-8,width:32,height:14,fill:'#e6d8b8',stroke:INK,'stroke-width':1},g);
    E('path',{d:'M'+(x-18)+' '+(y-8)+' L'+x+' '+(y-18)+' L'+(x+18)+' '+(y-8)+' z',fill:'#b8a279',stroke:INK,'stroke-width':1},g);
  }

  /* the Court's quarter on the dry north terrace */
  bankHall(760,676,132,66,gBuild);
  house(640,684,42,28,gBuild,false);
  house(892,688,44,30,gBuild,false);
  house(320,776,46,30,gBuild,false);
  /* the factor's house, the Counting House, the granaries */
  house(540,856,166,70,gBuild,true);
  E('path',{d:'M478 856 L478 826 q62 -18 124 0 L602 856',fill:'none',stroke:INK,'stroke-width':1.1,opacity:0.5},gBuild);
