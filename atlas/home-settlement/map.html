<style>

</head>
<body>
<div id="paper"></div>
<svg id="m" viewBox="0 0 1600 2200" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
(function(){
  'use strict';
  var NS='http://www.w3.org/2000/svg';
  var svg=document.getElementById('m');
  var INK='#2b1b0e', FADE='#6b5331', RED='#7e1f14', SEA='#547a72',
      SEAWASH='#a9bfb2', GOLD='#a9833c', GREEN='#7c8a5e', MG='#5d6b46',
      SLIP='#9a8f76', PAPER='#e9d9b6';

  function E(tag,attrs,parent){
    var n=document.createElementNS(NS,tag),k;
    for(k in attrs){ if(attrs[k]!==null && attrs[k]!==undefined && attrs[k]!==''){ n.setAttribute(k,attrs[k]); } }
    (parent||svg).appendChild(n);
    return n;
  }
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
  var rnd=mulberry32(8120612);
  function rr(a,b){return a+(b-a)*rnd();}

  function jit(pts,amp,seg){
    seg=seg||8; var out=[],i,s;
    for(i=0;i<pts.length-1;i++){
      var x1=pts[i][0],y1=pts[i][1],x2=pts[i+1][0],y2=pts[i+1][1];
      var dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy)||1;
      var nx=-dy/len,ny=dx/len,n=Math.max(1,Math.round(len/seg));
      for(s=0;s<n;s++){ var t=s/n,o=(rnd()-0.5)*2*amp; out.push([x1+dx*t+nx*o,y1+dy*t+ny*o]); }
    }
    out.push(pts[pts.length-1]); return out;
  }
  function D(pts,close){
    var s='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
    for(var i=1;i<pts.length;i++){s+=' L'+pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1);}
    return close?s+' Z':s;
  }

  /* ---------- layers ---------- */
  var defs=E('defs',{});
  E('image',{x:0,y:0,width:1600,height:2200,href:'../../design/textures/parchment.jpg',preserveAspectRatio:'xMidYMid slice',opacity:0.5});
  var gWash=E('g',{}), gTerr=E('g',{}), gWater=E('g',{}), gRoad=E('g',{}),
      gBuild=E('g',{}), gFrame=E('g',{}), gLabel=E('g',{});

  /* foxing, water-marks and the ghost of a fold */
  for(var fi=0;fi<34;fi++){
    E('ellipse',{cx:rr(70,1530),cy:rr(70,2130),rx:rr(14,66),ry:rr(9,40),
      fill:'#8a612f',opacity:rr(0.012,0.05),transform:'rotate('+rr(0,180)+' '+rr(200,1400)+' '+rr(300,1900)+')'},gWash);
  }
  [520,1060].forEach(function(x){E('line',{x1:x,y1:60,x2:x+2,y2:2140,stroke:'#7a5a30','stroke-width':1,opacity:0.07},gWash);});
  E('line',{x1:56,y1:1104,x2:1544,y2:1104,stroke:'#7a5a30','stroke-width':1,opacity:0.06},gWash);

  /* soft ground washes: the terrace, the clay flat, the wet edge */
  function wash(pts,color,op){E('path',{d:D(jit(pts,7,26),true),fill:color,opacity:op},gWash);}

  wash([[70,1160],[520,1120],[1120,1150],[1540,1190],[1540,1740],[1080,1790],[420,1750],[70,1690]],'#d8bf90',0.16);
  wash([[60,1760],[480,1720],[980,1750],[1540,1730],[1540,1930],[980,1950],[420,1930],[60,1900]],'#aebd9e',0.19);
  wash([[1300,600],[1540,620],[1540,830],[1300,820]],'#c2b79a',0.14);

  /* ---------- the land ---------- */
  function tree(x,y,s,p){
    var g=E('g',{transform:'translate('+x+' '+y+') scale('+s+')'},p);

    E('path',{d:'M-7 -6 L0 -18 L7 -6 Z',fill:GREEN,stroke:INK,'stroke-width':0.8,opacity:0.8},g);
    E('path',{d:'M-4 -12 L0 -21 L4 -12 Z',fill:'#6f7d53',stroke:INK,'stroke-width':0.7,opacity:0.75},g);
  }
  function tuft(x,y,s,p){
    E('path',{d:'M-5 2 q-2 -8 -6 -12 M0 2 L0 -15 M5 2 q2 -7 7 -11 M-2 2 q-1 -6 -3 -9',
      fill:'none',stroke:MG,'stroke-width':1.1,opacity:0.8,
      transform:'translate('+x+' '+y+') scale('+s+')'},p);
  }
  function field(x,y,w,h,crop,p){
    var g=E('g',{},p);
    E('path',{d:D(jit([[x,y],[x+w,y-rr(2,10)],[x+w+rr(0,8),y+h],[x-rr(0,8),y+h+rr(0,6)]],2.4,18),true),
      fill:crop==='turnip'?'#c3c39a':'#d3c48c',stroke:FADE,'stroke-width':1,opacity:0.55},g);
    var k;
    for(k=1;k<7;k++){
      var fx=x+(w*k/7);
      E('path',{d:'M'+fx.toFixed(1)+' '+(y+3)+' q'+(rr(-4,4)).toFixed(1)+' '+(h/2)+' '+(rr(-5,5)).toFixed(1)+' '+(h-4),
        fill:'none',stroke:FADE,'stroke-width':0.8,opacity:0.5},g);
    }
    for(k=0;k<11;k++){
      var sx=x+rr(8,w-8),sy=y+rr(10,h-8);
      E('path',{d:'M'+sx.toFixed(1)+' '+sy.toFixed(1)+' l-2 -5 M'+sx.toFixed(1)+' '+sy.toFixed(1)+' l2 -5',
        fill:'none',stroke:MG,'stroke-width':0.9,opacity:0.65},g);
    }
  }
  /* the lip of the High Kiln terrace */
  E('path',{d:D(jit([[330,810],[470,800],[610,812],[750,800],[900,812],[1040,802],[1180,818],[1250,812]],3,16),false),
    fill:'none',stroke:FADE,'stroke-width':2.2,opacity:0.8},gTerr);
  for(var ti=0;ti<58;ti++){
    var hx=rr(340,1245),hy=812+rr(2,12);
    E('line',{x1:hx,y1:hy,x2:hx-4,y2:hy+rr(5,11),stroke:FADE,'stroke-width':0.9,opacity:0.55},gTerr);
  }
  /* willows along the low bank */
  for(var wt=0;wt<16;wt++){tree(rr(120,520),rr(1120,1190),rr(0.5,0.8),gTerr);}
  for(wt=0;wt<10;wt++){tree(rr(980,1480),rr(600,760),rr(0.45,0.7),gTerr);}
  /* the wet edge of the wild */
  for(var rt=0;rt<170;rt++){tuft(rr(70,1530),rr(1770,1920),rr(0.6,1.15),gTerr);}
  for(rt=0;rt<34;rt++){tuft(rr(70,420),rr(1640,1760),rr(0.5,0.9),gTerr);}

  /* the fields */
  field(1260,590,240,180,'barley',gTerr);
  field(1300,1580,220,180,'barley',gTerr);
  field(1300,1770,190,120,'barley',gTerr);
  field(110,1520,220,210,'turnip',gTerr);
  field(150,1740,210,120,'turnip',gTerr);

  /* ---------- water ---------- */
  function river(pts,w0,w1,p){
    var jp=jit(pts,1.7,14),left=[],right=[],k;
    for(k=0;k<jp.length;k++){
      var a=jp[Math.max(0,k-1)],b=jp[Math.min(jp.length-1,k+1)];
      var dx=b[0]-a[0],dy=b[1]-a[1],le=Math.sqrt(dx*dx+dy*dy)||1;
      var nx=-dy/le,ny=dx/le,t=k/(jp.length-1),w=w0+(w1-w0)*t;
      left.push([jp[k][0]+nx*w,jp[k][1]+ny*w]);
      right.push([jp[k][0]-nx*w,jp[k][1]-ny*w]);
    }
    var band=left.concat(right.reverse());
    E('path',{d:D(band,true),fill:SEAWASH,stroke:SEA,'stroke-width':1.1,opacity:0.55},p);
    E('path',{d:D(jp),fill:'none',stroke:SEA,'stroke-width':Math.max(1.2,w1*0.55),'stroke-linecap':'round',opacity:0.85},p);
    E('path',{d:D(jp),fill:'none',stroke:INK,'stroke-width':1,'stroke-linecap':'round',opacity:0.65},p);
  }
  /* the Ilm: in at the west, down four feet at the sill, out east */
  var ilm=[[56,972],[180,976],[320,968],[450,975],[560,980],[640,984],[716,988],[760,1012],[860,1022],[1000,1028],[1140,1036],[1280,1048],[1420,1042],[1548,1050]];

  river(slip,1.6,3.4,gWater);
  E('path',{d:D(jit(slip,1.5,16)),fill:'none',stroke:SLIP,'stroke-width':1.5,opacity:0.55},gWater);

  /* the sill — a ledge of hard stone, and the white water under it */
  E('path',{d:'M692 979 l10 -6 l9 7 l11 -6 l10 8 l11 -5 l9 8 l10 -4 l8 9',
    fill:'none',stroke:INK,'stroke-width':2.4,'stroke-linejoin':'round',opacity:0.9},gWater);
  E('path',{d:'M690 984 l12 12 l10 -9 l12 12 l10 -8 l12 12 l10 -8 l12 11',
    fill:'none',stroke:INK,'stroke-width':1.1,opacity:0.6},gWater);
  for(var wf=0;wf<9;wf++){
    var wx=700+wf*9;
    E('path',{d:'M'+wx+' 1016 q5 -5 10 0 M'+(wx+3)+' 1025 q5 -5 10 0',
      fill:'none',stroke:INK,'stroke-width':0.9,opacity:0.5},gWater);
  }
  /* an eel or two, drawn as an engraver would cut them */
  E('path',{d:'M966 1038 q26 -12 52 2 q24 13 48 -3 q-18 18 -44 8 q-28 -12 -56 -7 z',
    fill:'none',stroke:INK,'stroke-width':1,opacity:0.45},gWater);
  E('path',{d:'M1054 1037 l7 -4 l-1 6',fill:'none',stroke:INK,'stroke-width':0.9,opacity:0.45},gWater);
  /* the dotted line of the Breaking */
  E('path',{d:D(jit([[120,944],[340,938],[540,940],[700,948],[860,960],[1040,968],[1240,976],[1460,980]],3,16),false),
    fill:'none',stroke:RED,'stroke-width':1.6,'stroke-dasharray':'4 7',opacity:0.6},gWater);
  E('path',{d:D(jit([[140,1082],[360,1092],[560,1100],[760,1108],[960,1116],[1180,1124],[1400,1120],[1520,1122]],3,16),false),
    fill:'none',stroke:RED,'stroke-width':1.6,'stroke-dasharray':'4 7',opacity:0.6},gWater);

  /* ---------- roads and ways ---------- */
  function road(pts,p,col,dash,w){
    E('path',{d:D(jit(pts,1.8,14)),fill:'none',stroke:col||INK,'stroke-width':w||2,
      'stroke-dasharray':dash||'6 5','stroke-linecap':'round',opacity:0.75},p||gRoad);
  }
  road([[830,884],[1010,872],[1180,868],[1340,878],[1500,884],[1560,886]]);                 /* Clay Road east */
  road([[830,884],[720,844],[620,900],[566,972]]);                                            /* Cross to north bridge */
  road([[810,812],[740,830],[660,876],[604,940]]);                                            /* steep street */
  road([[566,1040],[560,1130],[590,1220],[640,1300]]);                                        /* north bridge into Low Kiln */
  road([[1330,1046],[1310,1140],[1290,1260],[1270,1370]]);                                    /* south bridge into Low Kiln */
  road([[830,884],[830,760],[820,628],[820,566],[822,500]]);                                  /* north gate road to the orchard */
  road([[822,500],[822,430],[824,352]]);                                                       /* on to Cold Acre */
  road([[900,1640],[900,1740],[898,1840],[894,1934]]);                                        /* Old Kiln road */
  road([[1400,1600],[1470,1680],[1540,1760]]);                                                /* marsh road to Reedholt */
  road([[120,986],[240,980],[380,974],[500,978]]);                                            /* upriver bank path */

  /* ---------- houses and holdings ---------- */
  function house(x,y,w,h,p,big){
    var g=E('g',{},p);
    var l=x-w/2,r=x+w/2,t=y-h,b=y;
    E('path',{d:'M'+(l-2)+' '+b+' L'+(l+rr(-2,2)).toFixed(1)+' '+(t+4)+' L'+(x-2)+' '+(t-2)+' L'+(r+rr(-2,2)).toFixed(1)+' '+(t+4)+' L'+(r+2)+' '+b+' Z',
      fill:big?'#e6d8b8':'#efe3c6',stroke:INK,'stroke-width':big?1.9:1.5},g);
    E('path',{d:'M'+(l-5)+' '+(t+4)+' L'+x+' '+(t-h*0.42)+' L'+(r+5)+' '+(t+4),
      fill:'none',stroke:INK,'stroke-width':big?1.7:1.2},g);
    E('path',{d:'M'+(x-w*0.13)+' '+b+' L'+(x-w*0.13)+' '+(b-h*0.56)+' L'+(x+w*0.06)+' '+(b-h*0.56)+' L'+(x+w*0.06)+' '+b,
      fill:'none',stroke:INK,'stroke-width':1.1,opacity:0.85},g);
    E('rect',{x:x+w*0.22,y:b-h*0.68,width:w*0.13,height:h*0.2,fill:'none',stroke:INK,'stroke-width':0.9,opacity:0.8},g);
    return g;
  }
  function smoke(x,y,p){
    E('path',{d:'M'+x+' '+y+' q-7 -8 1 -14 q7 -6 0 -12',fill:'none',stroke:INK,
      'stroke-width':1,'stroke-linecap':'round',opacity:0.5},p);
  }
  function kiln(x,y,s,p){
    var g=E('g',{transform:'translate('+x+' '+y+') scale('+s+')'},p);
    E('path',{d:'M-14 0 q14 -22 28 0 z',fill:'#c9b99a',stroke:INK,'stroke-width':1.5},g);
    E('path',{d:'M-5 0 q5 -11 10 0',fill:'none',stroke:INK,'stroke-width':1.2},g);
    smoke(0,-18,g); smoke(6,-15,g);
  }
  function pit(x,y,p){
    var g=E('g',{},p);
    E('path',{d:'M'+(x-15)+' '+y+' l3 -10 l22 -1 l5 11 z',fill:SLIP,stroke:INK,'stroke-width':1.2,opacity:0.8},g);
    E('path',{d:'M'+(x-11)+' '+(y-3)+' q9 -4 18 -1',fill:'none',stroke:INK,'stroke-width':0.8,opacity:0.6},g);
  }
  function rack(x,y,p){
    var g=E('g',{},p);
    E('path',{d:'M'+x+' '+y+' L'+(x+66)+' '+y+' M'+x+' '+(y+16)+' L'+(x+66)+' '+y+16+' M'+(x+4)+' '+y+' L'+(x+4)+' '+(y+18)+' M'+(x+62)+' '+y+' L'+(x+62)+' '+(y+18),
      fill:'none',stroke:INK,'stroke-width':1.2},g);
    for(var i=0;i<7;i++){
      var px=x+8+i*8;
      E('path',{d:'M'+px+' '+y+' q4 -8 8 0 z',fill:'#e6d8b8',stroke:INK,'stroke-width':0.8},g);
    }
  }
  function well(x,y,p){
    var g=E('g',{},p);
    E('ellipse',{cx:x,cy:y,rx:15,ry:7,fill:'#d8c8a4',stroke:INK,'stroke-width':1.4},g);
    E('ellipse',{cx:x,cy:y,rx:8,ry:3.5,fill:'#7d8f88',stroke:INK,'stroke-width':0.9,opacity:0.8},g);
    E('path',{d:'M'+(x-16)+' '+y+' L'+(x-16)+' '+(y-24)+' L'+(x+16)+' '+(y-24)+' L'+(x+16)+' '+y,
      fill:'none',stroke:INK,'stroke-width':1.2},g);
    E('path',{d:'M'+(x-20)+' '+(y-24)+' L'+x+' '+(y-34)+' L'+(x+20)+' '+(y-24)+' z',fill:'#e0d0ac',stroke:INK,'stroke-width':1.2},g);
  }
  function forge(x,y,p){
    var g=E('g',{},p);
    house(x,y,56,34,g,false);
    E('path',{d:'M'+(x+16)+' '+(y-34)+' L'+(x+16)+' '+(y-62)+' L'+(x+28)+' '+(y-62)+' L'+(x+28)+' '+(y-34),
      fill:'#d8c8a4',stroke:INK,'stroke-width':1.4},g);
    smoke(22,-62,g); smoke(27,-58,g);
    E('path',{d:'M'+(x-18)+' '+y+' q6 -9 12 0',fill:'none',stroke:RED,'stroke-width':1.5,opacity:0.7},g);
  }
  function mill(x,y,p){
    var g=E('g',{},p);
    house(x,y-6,52,38,g,true);
    E('circle',{cx:x-30,cy:y+10,r:15,fill:'none',stroke:INK,'stroke-width':1.4},g);
    for(var i=0;i<8;i++){
      var a=i*Math.PI/4;
      E('line',{x1:x-30,y1:y+10,x2:x-30+Math.cos(a)*14,y2:y+10+Math.sin(a)*14,stroke:INK,'stroke-width':0.9,opacity:0.8},g);
    }
  }
  function shrine(x,y,p){
    var g=E('g',{},p);
    E('path',{d:'M'+(x-13)+' '+y+' L'+(x-13)+' '+(y-20)+' q13 -16 26 0 L'+(x+13)+' '+y+' z',
      fill:'#efe3c6',stroke:INK,'stroke-width':1.4},g);
    E('path',{d:'M'+(x-5)+' '+(y-4)+' L'+(x-5)+' '+(y-15)+' M'+(x+5)+' '+(y-4)+' L'+(x+5)+' '+(y-15)+' M'+(x-6)+' '+(y-10)+' L'+(x+6)+' '+(y-10),
      fill:'none',stroke:RED,'stroke-width':1.2,opacity:0.85},g);
    E('path',{d:'M'+(x-18)+' '+y+' L'+(x+18)+' '+y,stroke:INK,'stroke-width':1.6},g);
  }
  function grave(x,y,p){
    var g=E('g',{},p);
    E('path',{d:'M'+(x-7)+' '+y+' q7 -7 14 0 z',fill:'#cfc3a3',stroke:FADE,'stroke-width':1},g);
    E('path',{d:'M'+(x-5)+' '+(y-2)+' l2 -6 l3 2 l3 -5 l2 9',fill:'none',stroke:FADE,'stroke-width':0.9},g);
  }
  function bridge(x,y,p){
    var g=E('g',{},p);
    E('path',{d:'M'+(x-17)+' '+(y-13)+' L'+(x+17)+' '+(y-13)+' M'+(x-17)+' '+(y+13)+' L'+(x+17)+' '+(y+13),
      stroke:INK,'stroke-width':2.4},g);
    for(var i=0;i<7;i++){
      var bx=x-15+i*5;
      E('line',{x1:bx,y1:y-13,x2:bx,y2:y+13,stroke:INK,'stroke-width':0.8,opacity:0.7},g);
    }
  }
  function stairs(x,y,p){
    var g=E('g',{},p);
    for(var i=0;i<5;i++){
      E('line',{x1:x-14+i*2,y1:y+i*7,x2:x+14-i*2,y2:y+i*7,stroke:INK,'stroke-width':1.2,opacity:0.85},g);
    }
    E('path',{d:'M'+(x-16)+' '+y+' L'+(x-8)+' '+(y+35)+' M'+(x+16)+' '+y+' L'+(x+8)+' '+(y+35),
      fill:'none',stroke:INK,'stroke-width':1,opacity:0.6},g);
  }

  /* the Bone Orchard, drawn beyond the north gate */
  E('path',{d:D(jit([[636,372],[760,358],[906,366],[984,390],[958,484],[800,496],[662,478]],3,16),true),
    fill:'#cfc9a8',stroke:FADE,'stroke-width':1.4,opacity:0.8},gBuild);
  for(var gi=0;gi<16;gi++){grave(rr(670,950),rr(390,472),gBuild);}
  E('path',{d:'M'+(812)+' 500 q-3 -30 -6 -54',fill:'none',stroke:FADE,'stroke-width':1.2,'stroke-dasharray':'3 5'},gBuild);
  /* the north gate itself */
  E('path',{d:'M800 606 L800 566 q22 -14 44 0 L844 606 M796 606 L848 606 M796 586 L848 586',
    fill:'none',stroke:INK,'stroke-width':1.8},gBuild);

  /* the Cross — stalls and the slate-post */
  [[760,910],[800,902],[846,908],[892,904],[936,912]].forEach(function(c){
    var s=E('g',{},gBuild);
    E('rect',{x:c[0]-15,y:c[1]-8,width:30,height:14,fill:'#e6d8b8',stroke:INK,'stroke-width':1},s);
    E('path',{d:'M'+(c[0]-17)+' '+(c[1]-8)+' L'+c[0]+' '+(c[1]-18)+' L'+(c[0]+17)+' '+(c[1]-8)+' z',
      fill:'#b8a279',stroke:INK,'stroke-width':1},s);
  });
  E('path',{d:'M924 948 L924 924 L936 924 L936 948 M920 924 q8 -8 20 0',
    fill:'none',stroke:INK,'stroke-width':1.4},gBuild);

  /* Slate Row — four narrow houses */
