</head>
<body>
<div id="paper"></div>
<svg id="m" viewBox="0 0 2400 1600" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
(function(){
  'use strict';
  var NS='http://www.w3.org/2000/svg';
  var svg=document.getElementById('m');

      EARTH='#d8c8a4', STONE='#cbb68d';

  function E(tag,attrs,parent){

  }
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
  var rnd=mulberry32(813279);
  function rr(a,b){return a+(b-a)*rnd();}
  function jit(pts,amp,seg){
    seg=seg||7; var out=[],i,s;
    for(i=0;i<pts.length-1;i++){
      var x1=pts[i][0],y1=pts[i][1],x2=pts[i+1][0],y2=pts[i+1][1];
      var dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy)||1;

  function D(pts,close){
    var s='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);

  /* ---------- layers, inked in order ---------- */

  E('line',{x1:60,y1:806,x2:2340,y2:806,stroke:'#7a5a30','stroke-width':1,opacity:0.05},gWash);

  E('path',{d:D(jit([[60,356],[420,338],[860,362],[1300,342],[1780,368],[2340,352],[2340,468],[1780,484],[1300,464],[860,490],[420,468],[60,482]],4,30),true),
    fill:'#b9b9a0',opacity:0.20},gWash);
  /* the hamlet ground wash */
  E('path',{d:D(jit([[760,860],[790,700],[900,580],[1080,520],[1320,512],[1540,556],[1700,650],[1760,790],[1700,930],[1500,1010],[1240,1040],[960,1000],[800,950]],4,26),true),
    fill:'#c9b98f',opacity:0.32},gWash);
  /* the bare ring about the well, where frost will not hold */
  E('path',{d:D(jit([[980,700],[1010,600],[1100,552],[1220,540],[1350,566],[1436,646],[1448,742],[1380,826],[1250,858],[1110,846],[1000,790]],3.4,20),true),
    fill:'#b7a273',opacity:0.22},gWash);

                     [2320,1566],[520,1566]],3,20),true),fill:SEAWASH,opacity:0.30},gWash);

  /* ---------- terrain: ridge, bare grass, frost, plots ---------- */
  function hill(x,y,s,p){

  function tuft(x,y,s,p){

  }

  }
  function shrine(x,y,s,p){

    for(i=0;i<9;i++){E('path',{d:'M'+(-20+i*4.6)+' -6 l2 -3 l2 3',fill:'none',stroke:FADE,'stroke-width':0.7,opacity:0.7},g);}
  }

  /* the drift-stone wall about the hamlet, broken for the road */
  var wall=jit([[790,860],[806,720],[900,596],[1080,540],[1320,532],[1530,574],[1690,668],[1736,796],[1668,930],[1480,1002],[1240,1026],[990,988],[836,938]],3,20);
  for(k=0;k<wall.length;k+=2){

  }

  [[884,668,1.0],[946,580,0.92],[1050,624,0.86],[1398,604,1.02],[1510,700,0.94],[1370,792,0.9]
  ].forEach(function(h){house(h[0],h[1],h[2],gStruct);});
  byre(1030,868,0.95,gStruct);
  /* smoke standing still in the frost over two roofs */
  [[884,636],[1398,568]].forEach(function(s){
    E('path',{d:'M'+s[0]+' '+s[1]+' q-8 -12 2 -20 q9 -8 1 -18',fill:'none',stroke:FADE,'stroke-width':1.4,opacity:0.4},gStruct);
  });

  /* the well, the shrine, the bare ring and the children's stone upon the curb */
  wellBreak(1180,700,1.0,gStruct);
  shrine(1070,656,1.0,gStruct);
  E('path',{d:D(jit([[980,700],[1010,600],[1100,552],[1220,540],[1350,566],[1436,646],[1448,742],[1380,826],[1250,858],[1110,846],[1000,790]],4,18),true),
    fill:'none',stroke:FADE,'stroke-width':1.5,'stroke-dasharray':'4 6',opacity:0.62},gStruct);
  E('path',{d:'M1210 712 q6 -5 12 0 q-2 5 -6 5 q-5 0 -6 -5 z',fill:'#6b5331',stroke:INK,'stroke-width':1},gStruct);
  /* the place where the thirteenth would stand, set by a nought in another hand */
  E('circle',{cx:1250,cy:752,r:8,fill:'none',stroke:RED,'stroke-width':1.1,opacity:0.7},gStruct);
  E('path',{d:'M1244 752 l12 0',fill:'none',stroke:RED,'stroke-width':0.8,opacity:0.6},gStruct);

  var faint=E('g',{opacity:0.45});
  gStruct.appendChild(faint);
  [[600,1472],[690,1466],[780,1470],[880,1464],[980,1472]
  ].forEach(function(h){house(h[0],h[1],0.82,faint);});
  aGate(900,1396,0.95,faint);
  barrow(1260,1478,0.9,faint);
  E('path',{d:D(jit([[1130,1436],[1200,1414],[1320,1410],[1400,1434],[1420,1470],[1330,1492],[1200,1490],[1140,1470]],3,16),true),
    fill:'none',stroke:FADE,'stroke-width':1.2,'stroke-dasharray':'3 5',opacity:0.8},faint);
  /* the Tallow Works, faint two leagues east */
  [[2270,880,0.9],[2320,910,0.85]].forEach(function(h){house(h[0],h[1],h[2],faint);});
  E('path',{d:'M2280 846 q-6 -12 3 -20 q8 -8 1 -17',fill:'none',stroke:FADE,'stroke-width':1.4,opacity:0.6},faint);

  /* ---------- roads ---------- */
  E('path',{d:D(jit([[900,1490],[912,1320],[900,1180],[950,1060],[1080,986],[1240,954],[1460,960],[1700,986],[1960,1010],[2330,1030]],2.4,24)),
    fill:'none',stroke:INK,'stroke-width':2.3,'stroke-dasharray':'8 6','stroke-linecap':'round',opacity:0.78},gRoad);
  /* the short spur from the road up to the well */
  E('path',{d:D(jit([[1180,952],[1184,900],[1180,842],[1180,776]],2,18)),
    fill:'none',stroke:INK,'stroke-width':1.7,'stroke-dasharray':'6 6','stroke-linecap':'round',opacity:0.62},gRoad);
  function edgeArrow(x,y,dir,p){
    E('path',{d:'M'+x+' '+y+' L'+(x+dir*52)+' '+y+' M'+(x+dir*52)+' '+y+' l'+(dir*-10)+' -6 M'+(x+dir*52)+' '+y+' l'+(dir*-10)+' 6',
      fill:'none',stroke:INK,'stroke-width':1.7},p);
  }
  edgeArrow(2270,1030,1,gRoad);
  edgeArrow(880,1490,-1,gRoad);

    var t=E('text',{x:x,y:y,'font-family':(o&&o.font)||'Cinzel','font-size':(o&&o.size)||20,
      fill:(o&&o.fill)||INK,'letter-spacing':(o&&o.ls)||0,
      'text-anchor':(o&&o.anchor)||'start',opacity:(o&&o.opacity)||1,
      'font-weight':(o&&o.weight)||null,
      'stroke':(o&&o.halo)?PALE:null,'stroke-width':(o&&o.halo)?3.2:null,'paint-order':(o&&o.halo)?'stroke':null,

  }
  function note(x,y,lines,o){
    o=o||{};var lh=o.lh||22;
    lines.forEach(function(ln,k){T(x,y+k*lh,ln,{font:'FellIt',size:o.size||16,fill:o.fill||'#5a4127',opacity:o.opacity||0.92});});
  }
  function leader(x1,y1,x2,y2,p){
    E('path',{d:'M'+x1+' '+y1+' L'+x2+' '+y2,fill:'none',stroke:FADE,'stroke-width':0.9,opacity:0.6},p||gText);
  }

  /* the ground, named in place */
  T(1180,506,'COLD ACRE',{font:'FellSC',size:26,ls:6,fill:FADE,anchor:'middle',opacity:0.88,halo:true});
  T(1180,530,'on the ridge, two leagues north of Sill',{font:'FellIt',size:15,fill:FADE,anchor:'middle',halo:true});
  T(1180,600,'the well that never freezes',{font:'Fell',size:19,anchor:'middle',halo:true});
  T(1180,624,'eleven links to the water; the twelfth hangs dry',{font:'FellIt',size:14,fill:SEA,anchor:'middle',halo:true});
  leader(1090,664,1144,694,gText);

  note(120,296,[
    'The Ilm lay under ice for ninety-four days in the Thin',
    'Year and the well gave every morning of them. A priest',
    'come up from Greybank called it a little sister of the',
    'Nine Wells. The well has never given a sign it heard him.'
  ],{size:16,fill:'#574226'});
  note(120,486,[
    'Come at first grey, before the house fires are stirred.',
    'Set the dish on the stone, not in the water. Draw what',
    'the day wants. Taste before you carry: stone, a little',
    'iron, and nothing else. Do not say that where a slate is.'
  ],{size:15,fill:'#574226'});
  note(120,692,[
    'When the bell comes up the ridge on a still morning,',
    'stop until it has gone. Four, four and a gap. The gap',
    'is not ours to fill. The song leaves a place where the',
    'thirteenth would stand, and nobody answers for it.'
  ],{size:15,fill:'#574226'});
  note(120,900,[
    'In Stone and Frost the children pass the stone round',
    'the bare ring and leave the turn standing. A child is',
    'brought back with a breath breathed twice on the stone.',
    'The water comes up when the river is ice.'
  ],{size:15,fill:'#574226'});

  note(1640,296,[
    'Eleven links go down and one hangs in the hand. A man',
    'of the College said the twelfth is kept back for the',
    'Hearth. The chain does not straighten and the printed',
    'figure travels. Both stand; neither enters the other.'
  ],{size:15,fill:'#574226'});
  note(1640,486,[
    'Three times an assessor has measured the lip with a',
    'cord and set a figure in his column. The column has',
    'never had anything in it. He asked what the well was',
    'worth. It keeps itself and us, and he wrote that too.'
  ],{size:15,fill:'#574226'});
  note(1640,676,[
    'On market-days the barrow of grey Ash goes past on the',
    'ridge road to the north gate, heaped a finger above',
    'the sides. The children stand and let it go by and take',
    'up the stone when the road is empty again.'
  ],{size:15,fill:'#574226'});
