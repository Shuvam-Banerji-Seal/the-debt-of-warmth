<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Tallow Works — the rendering house two leagues north-east of Sill</title>
<style>
@font-face{font-family:Fell;src:url('../../fonts/IMFeENrm28P.otf');}
@font-face{font-family:FellIt;src:url('../../fonts/IMFeENit28P.otf');}
@font-face{font-family:FellSC;src:url('../../fonts/IMFeENsc28P.otf');}
@font-face{font-family:Cinzel;src:url('../../fonts/Cinzel-Regular.ttf');}
@font-face{font-family:CinzelDec;src:url('../../fonts/CinzelDecorative-Bold.ttf');}
@font-face{font-family:Garamond;src:url('../../fonts/EBGaramond-Regular.otf');}
html,body{margin:0;width:2400px;height:1600px;overflow:hidden;background:#c9b791;}
#paper{position:absolute;inset:0;background:
  radial-gradient(ellipse at 48% 46%, rgba(255,249,228,.42), rgba(125,90,50,.10) 62%, rgba(66,42,20,.30) 100%),
  linear-gradient(115deg, rgba(150,110,62,.10), rgba(255,250,230,.06) 40%, rgba(120,80,40,.10));}
svg{display:block;position:absolute;inset:0;width:2400px;height:1600px;}
</style>
</head>
<body>
<div id="paper"></div>
<svg id="m" viewBox="0 0 2400 1600" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
(function(){
  'use strict';
  var NS='http://www.w3.org/2000/svg';
  var svg=document.getElementById('m');
  var INK='#2b1b0e', FADE='#6b5331', RED='#7e1f14', SEA='#547a72', SEAWASH='#a9bfb2',
      GOLD='#a9833c', GREEN='#7c8a5e', MG='#5d6b46', PALE='#efe3c6', ASH='#9a9080',
      EARTH='#d8c8a4', CLAY='#cbb58f', TALLOW='#c9a86a', FAT='#e0c88e',
      SMOKE='#8b8a7a', WOOL='#e5dbc4', PEAT='#4a3827';

  function E(tag,attrs,parent){
    var n=document.createElementNS(NS,tag),k;
    for(k in attrs){ if(attrs[k]!==null && attrs[k]!==undefined && attrs[k]!==''){ n.setAttribute(k,attrs[k]); } }
    (parent||svg).appendChild(n);
    return n;
  }
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
  var rnd=mulberry32(813294);
  function rr(a,b){return a+(b-a)*rnd();}
  function jit(pts,amp,seg){
    seg=seg||7; var out=[],i,s;
    for(i=0;i<pts.length-1;i++){
      var x1=pts[i][0],y1=pts[i][1],x2=pts[i+1][0],y2=pts[i+1][1];
      var dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy)||1;
      var nx=-dy/len,ny=dx/len,n=Math.max(1,Math.round(len/seg));
      for(s=0;s<n;s++){ var t=s/n,o=(rnd()-0.5)*2*amp; out.push([x1+dx*t+nx*o,y1+dy*t+ny*o]); }
    }
    out.push(pts[pts.length-1]); return out;
  }
  function D(pts,close){
    var s='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
    for(var i=1;i<pts.length;i++){s+=' L'+pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1);}
    return close?s+' Z':s;
  }

  /* ---------- layers, inked in order; all lettering goes on last ---------- */
  var defs=E('defs',{});
  E('image',{x:0,y:0,width:2400,height:1600,href:'../../design/textures/parchment.jpg',preserveAspectRatio:'xMidYMid slice',opacity:0.52});
  var gWash=E('g',{}), gTerr=E('g',{}), gWater=E('g',{}), gStruct=E('g',{}),
      gRoad=E('g',{}), gFrame=E('g',{}), gText=E('g',{});
  var i,k;

  /* foxing, folds and the old damp of the paper */
  for(i=0;i<28;i++){
    E('ellipse',{cx:rr(80,2320),cy:rr(80,1520),rx:rr(16,82),ry:rr(10,50),
      fill:'#8a612f',opacity:rr(0.012,0.05),transform:'rotate('+rr(0,180)+' '+rr(200,2200)+' '+rr(200,1400)+')'},gWash);
  }
  [620,1240,1860].forEach(function(x){E('line',{x1:x,y1:60,x2:x+2,y2:1540,stroke:'#7a5a30','stroke-width':1,opacity:0.07},gWash);});
  E('line',{x1:60,y1:808,x2:2340,y2:808,stroke:'#7a5a30','stroke-width':1,opacity:0.05},gWash);
  /* the low ridge on which the works stand */
  E('path',{d:D(jit([[60,452],[420,430],[860,412],[1300,398],[1780,418],[2340,438],[2340,560],[1780,542],[1300,526],[860,540],[420,556],[60,574]],4,28),true),
    fill:'#b9a17c',opacity:0.16},gWash);
  /* the dry rise about the yard */
  E('path',{d:D(jit([[600,620],[900,592],[1320,586],[1720,616],[1880,700],[1820,1080],[1520,1160],[1040,1130],[700,1050],[600,860]],4,26),true),
    fill:CLAY,opacity:0.24},gWash);
  /* the sweet smoke going down on a north wind, toward Sill */
  E('path',{d:D(jit([[1160,436],[1040,512],[900,606],[760,734],[600,880],[430,1000],[250,1080],[110,1140],
                      [110,1180],[270,1110],[450,1030],[620,910],[780,782],[920,654],[1060,550],[1180,470]],6,34),true),
    fill:SMOKE,opacity:0.11},gWash);

  /* ---------- terrain ---------- */
  function hill(x,y,s,p){
    E('path',{d:'M'+(x-13*s).toFixed(1)+' '+y+' q'+(13*s).toFixed(1)+' '+(-14*s).toFixed(1)+' '+(26*s).toFixed(1)+' 0',
      fill:'none',stroke:FADE,'stroke-width':1.2,opacity:0.5},p);
  }
  function tuft(x,y,s,p){
    var g=E('g',{transform:'translate('+x.toFixed(1)+' '+y.toFixed(1)+') scale('+s.toFixed(2)+')'},p);
    E('path',{d:'M-5 2 q-2 -8 -6 -12 M0 2 L0 -14 M5 2 q2 -7 7 -11 M-2 2 q-1 -6 -3 -9',
      fill:'none',stroke:MG,'stroke-width':1.1,opacity:0.8},g);
  }
  function rock(x,y,s,p){
    var g=E('g',{transform:'translate('+x.toFixed(1)+' '+y.toFixed(1)+') scale('+s.toFixed(2)+')'},p);
    E('path',{d:'M-11 3 L-6 -7 L3 -9 L11 -2 L7 4 Z',fill:'#b3a585',stroke:FADE,'stroke-width':1.1},g);
    E('path',{d:'M-6 -7 L1 1 L11 -2 M3 -9 L1 1',fill:'none',stroke:INK,'stroke-width':0.7,opacity:0.5},g);
  }
  function sheet(x,y,s,p){
    /* a wisp of sweet smoke, drawn as an old engraver's curl */
    E('path',{d:'M'+x+' '+y+' q-7 -8 1 -14 q7 -6 0 -12 q-5 -6 2 -11',
      fill:'none',stroke:SMOKE,'stroke-width':1.3*s,'stroke-linecap':'round',opacity:0.6},p);
  }
  for(i=0;i<32;i++){hill(rr(120,2280),rr(280,420),rr(0.8,1.5),gTerr);}
  for(i=0;i<70;i++){tuft(rr(180,2320),rr(470,1180),rr(0.55,1.0),gTerr);}
  for(i=0;i<14;i++){rock(rr(140,2260),rr(300,410),rr(0.7,1.1),gTerr);}
  for(i=0;i<7;i++){sheet(rr(850,1300),rr(350,470),rr(0.8,1.3),gTerr);}
  for(i=0;i<7;i++){sheet(rr(560,760),rr(700,940),rr(0.6,1.0),gTerr);}

  /* ---------- the sluice run, leaving the yard to the south-east ---------- */
  function river(center,w0,w1,col,wash,p){
    var bankA=[],bankB=[],norm=[],half=[];
    for(k=0;k<center.length;k++){
      var a=center[Math.max(0,k-1)],b=center[Math.min(center.length-1,k+1)];
      var dx=b[0]-a[0],dy=b[1]-a[1],le=Math.sqrt(dx*dx+dy*dy)||1;
      var nx=-dy/le,ny=dx/le,t=k/(center.length-1);
      var w=(w0+(w1-w0)*t)*(0.88+Math.sin(k*0.83)*0.09)*(0.62+0.38*Math.sin(Math.PI*(0.16+0.84*t)));
      bankA.push([center[k][0]+nx*w+rr(-2.5,2.5),center[k][1]+ny*w+rr(-2.5,2.5)]);
      bankB.push([center[k][0]-nx*w+rr(-2.5,2.5),center[k][1]-ny*w+rr(-2.5,2.5)]);
      norm.push([nx,ny]); half.push(w);
    }
    E('path',{d:D(bankA.concat(bankB.slice().reverse()),true),fill:wash,opacity:0.6},p);
    E('path',{d:D(center),fill:'none',stroke:col,'stroke-width':2,'stroke-linecap':'round',opacity:0.3},p);
    for(var q=0;q<22;q++){
      var j=Math.floor(rr(1,center.length-2)),f=rr(-0.7,0.7);
      E('path',{d:'M'+(center[j][0]+norm[j][0]*half[j]*f).toFixed(1)+' '+(center[j][1]+norm[j][1]*half[j]*f).toFixed(1)+' q7 -2 14 0',
        fill:'none',stroke:col,'stroke-width':0.9,opacity:rr(0.1,0.22)},p);
    }
    [bankA,bankB].forEach(function(bank){
      E('path',{d:D(bank),fill:'none',stroke:INK,'stroke-width':1.6,'stroke-linejoin':'round'},p);
      for(var m=2;m<bank.length-1;m+=2){
        var a=bank[m-1],b=bank[m+1],dx=b[0]-a[0],dy=b[1]-a[1],le=Math.sqrt(dx*dx+dy*dy)||1;
        E('line',{x1:bank[m][0],y1:bank[m][1],x2:bank[m][0]-dy/le*7+dx/le*3,y2:bank[m][1]+dx/le*7+dy/le*3,
          stroke:INK,'stroke-width':0.8,opacity:0.3},p);
      }
    });
  }
  river(jit([[1440,1064],[1432,1180],[1404,1290],[1360,1390],[1320,1470],[1300,1545]],2.4,14),
        7,17,SEA,SEAWASH,gWater);

  /* ---------- structures ---------- */
  function pitchedHouse(x,y,w,d,p,opts){
    opts=opts||{};
    var g=E('g',{},p), roof=opts.roof||TALLOW, op=opts.opacity||1;
    E('path',{d:'M'+(x-w/2)+' '+y+' L'+(x+w/2)+' '+y+' L'+(x+w/2)+' '+(y+d)+' L'+(x-w/2)+' '+(y+d)+' Z',
      fill:'#d8c8a4',stroke:INK,'stroke-width':2.2,'stroke-linejoin':'round',opacity:op},g);
    for(var b=0;b<6;b++){
      var by=y+d-12+b*2;
      E('line',{x1:x-w/2+3,y1:by,x2:x+w/2-3,y2:by,stroke:FADE,'stroke-width':0.7,opacity:0.24*op},g);
    }
    E('path',{d:'M'+(x-w/2-12)+' '+y+' L'+x+' '+(y-56)+' L'+(x+w/2+12)+' '+y+' Z',
      fill:roof,stroke:INK,'stroke-width':2,'stroke-linejoin':'round',opacity:op},g);
    for(var t=1;t<9;t++){
      var f=t/9, rx1=x-w/2-12+(w+24)*f;
      E('line',{x1:rx1,y1:y-1,x2:x+(rx1-x)*0.36,y2:y-56+1,stroke:FADE,'stroke-width':0.8,opacity:0.42*op},g);
    }
    E('path',{d:'M'+(x-w/2-12)+' '+y+' L'+(x+w/2+12)+' '+y,stroke:INK,'stroke-width':1.6,opacity:op},g);
    E('rect',{x:x-28,y:y+d-26,width:44,height:26,fill:'#6b5331',stroke:INK,'stroke-width':1.3,opacity:op},g);
    return g;
  }
  function vat(x,y,r,p){
    var g=E('g',{transform:'translate('+x+' '+y+')'},p);
    var pts=[];
    for(var a=0;a<24;a++){
      var th=a*Math.PI*2/24, rr2=r*(0.94+rr(-0.05,0.05));
      pts.push([Math.cos(th)*rr2,Math.sin(th)*rr2*0.72]);
    }
    E('path',{d:D(pts,true),fill:FAT,stroke:INK,'stroke-width':1.8},g);
    var inner=[];
    for(var b=0;b<20;b++){
      var th2=b*Math.PI*2/20;
      inner.push([Math.cos(th2)*r*0.66,Math.sin(th2)*r*0.46]);
    }
    E('path',{d:D(inner,true),fill:TALLOW,stroke:FADE,'stroke-width':1,opacity:0.85},g);
    E('path',{d:'M'+(-r+4)+' -2 q'+(r*0.5)+' 5 '+r+' 0',fill:'none',stroke:INK,'stroke-width':0.8,opacity:0.45},g);
  }
  function flame(x,y,s,p){
    var g=E('g',{transform:'translate('+x+' '+y+') scale('+s+')'},p);
    E('path',{d:'M0 0 q-6 -7 0 -13 q6 -6 0 -12 q8 7 5 14 q-2 6 -5 11 z',fill:GOLD,stroke:RED,'stroke-width':0.8},g);
    return g;
  }
  function lamp(x,y,s,p){
    var g=E('g',{transform:'translate('+x+' '+y+') scale('+s+')'},p);
    E('path',{d:'M-9 0 q9 6 18 0 l-3 6 q-6 2 -12 0 z',fill:'#c9a86a',stroke:INK,'stroke-width':1.2},g);
    E('line',{x1:0,y1:-1,x2:0,y2:-4,stroke:INK,'stroke-width':1},g);
    flame(0,-5,0.48,g);
    return g;
  }
  function sheep(x,y,s,p){
    var g=E('g',{transform:'translate('+x+' '+y+') scale('+s+')'},p);
    E('path',{d:'M-11 0 q-2 -9 6 -9 q9 -5 14 2 q7 1 4 8 q-11 4 -24 -1 z',fill:WOOL,stroke:INK,'stroke-width':1.1},g);
    E('path',{d:'M-8 6 l0 6 M6 6 l0 6 M-11 0 q5 4 10 1 M-1 1 q6 3 12 -1',fill:'none',stroke:INK,'stroke-width':0.9},g);
    E('path',{d:'M11 -3 q5 -1 5 3 q-3 3 -6 1',fill:'#6b5331',stroke:INK,'stroke-width':0.9},g);
  }
  function smallHut(x,y,s,p,op){
    var g=E('g',{transform:'translate('+x+' '+y+') scale('+s+')',opacity:op||0.42},p);
    E('rect',{x:-14,y:-4,width:28,height:16,fill:'#d8c8a4',stroke:INK,'stroke-width':1.3},g);
    E('path',{d:'M-18 -4 L0 -19 L18 -4 Z',fill:TALLOW,stroke:INK,'stroke-width':1.4},g);
    E('rect',{x:-3,y:2,width:6,height:10,fill:'#6b5331',stroke:INK,'stroke-width':0.8},g);
  }

  /* the sheep-folds on the north rise */
  E('path',{d:D(jit([[548,474],[772,458],[796,566],[566,584]],3,22),true),
    fill:'#d8c8a4',opacity:0.18},gStruct);
  [[548,474,772,458],[772,458,796,566],[796,566,566,584],[566,584,548,474]].forEach(function(f){
    E('line',{x1:f[0],y1:f[1],x2:f[2],y2:f[3],stroke:FADE,'stroke-width':2.2,opacity:0.8},gStruct);
    for(var q=0;q<8;q++){
      var t=(q+0.5)/8,px=f[0]+(f[2]-f[0])*t,py=f[1]+(f[3]-f[1])*t;
      E('line',{x1:px,y1:py-5,x2:px,y2:py+5,stroke:INK,'stroke-width':1,opacity:0.7},gStruct);
    }
  });
  [[624,512],[696,500],[754,524],[640,552],[718,548]].forEach(function(s){sheep(s[0],s[1],0.9,gStruct);});

  /* the rendering house, its flue and its warm crack */
  pitchedHouse(1010,622,380,196,gStruct,{roof:TALLOW});
  vat(908,724,27,gStruct); vat(1000,740,28,gStruct); vat(1094,722,26,gStruct);
  /* the hot flue rising from the north-east of the roof */
  E('path',{d:'M1150 566 L1150 470 L1180 470 L1180 566 Z',fill:'#c9b58f',stroke:INK,'stroke-width':2},gStruct);
  E('path',{d:'M1144 470 L1186 470 L1180 458 L1150 458 Z',fill:PEAT,stroke:INK,'stroke-width':1.4},gStruct);
  sheet(1166,452,1.4,gStruct); sheet(1174,438,1.0,gStruct);
  /* the warm crack, a thumb-wide seam along wall and flue, drawn as a red hairline */
  E('path',{d:'M852 624 q40 -4 80 1 q40 5 80 -1 q40 -5 80 1 q34 4 78 -1',
    fill:'none',stroke:RED,'stroke-width':2.2,'stroke-linecap':'round'},gStruct);
  [[924,646],[1008,652],[1100,644]].forEach(function(n){
    E('path',{d:'M'+n[0]+' '+n[1]+' q6 -8 13 -1 q-6 7 -13 1 z',fill:'#b9b2a0',stroke:FADE,'stroke-width':1,opacity:0.9},gStruct);
    E('path',{d:'M'+(n[0]+3)+' '+(n[1]+1)+' l5 -4 M'+(n[0]+8)+' '+(n[1]+1)+' l4 -3',
      fill:'none',stroke:FADE,'stroke-width':0.6,opacity:0.7},gStruct);
  });
  /* the lamp-room, with lamps trimming to a fingernail */
  pitchedHouse(1500,666,230,150,gStruct,{roof:'#cbb58f'});
  [[1430,730],[1480,730],[1530,730],[1580,730],[1430,774],[1480,774],[1530,774],[1580,774]].forEach(function(l){
    lamp(l[0],l[1],0.72,gStruct);
  });
  /* the byre where the men sit at the turning of the year */
  pitchedHouse(1592,922,268,112,gStruct,{roof:'#b9a17c'});
  E('line',{x1:1498,y1:1006,x2:1678,y2:1006,stroke:INK,'stroke-width':1.6,opacity:0.7},gStruct);
  E('line',{x1:1506,y1:1012,x2:1670,y2:1012,stroke:FADE,'stroke-width':0.8,opacity:0.6},gStruct);
  /* the nest-fire at the shed door, and the grey paper beside it */
  E('path',{d:'M1256 966 q-10 -18 3 -30 q6 12 10 16 q-2 -18 12 -28 q6 20 2 30 q12 -10 14 -22 q8 18 -4 34 z',
    fill:GOLD,stroke:RED,'stroke-width':1.4,opacity:0.9},gStruct);
  sheet(1276,934,1.0,gStruct);
  E('path',{d:'M1330 968 q10 -10 22 -2 q-4 10 -22 2 z',fill:'#b9b2a0',stroke:FADE,'stroke-width':1},gStruct);
  E('path',{d:'M1334 966 l8 -5 M1344 968 l6 -4',fill:'none',stroke:FADE,'stroke-width':0.7},gStruct);

  /* Cold Acre and Sill, drawn faint at the edges for neighbourhood only */
  [[222,606],[262,612],[196,640]].forEach(function(h){smallHut(h[0],h[1],0.85,gStruct,0.4);});
  E('circle',{cx:318,cy:624,r:11,fill:'none',stroke:FADE,'stroke-width':1.4,opacity:0.42},gStruct);
  [[110,1070],[150,1076],[92,1104],[178,1108]].forEach(function(h){smallHut(h[0],h[1],0.85,gStruct,0.38);});

  /* ---------- roads ---------- */
  /* the ridge road, in from the north gate and Cold Acre to the works' gate */
  E('path',{d:D(jit([[60,1030],[300,1004],[560,968],[820,906],[1010,844]],2.6,22)),
    fill:'none',stroke:INK,'stroke-width':2.4,'stroke-dasharray':'9 6','stroke-linecap':'round',opacity:0.82},gRoad);
  E('path',{d:D(jit([[318,650],[420,760],[560,902]],2.2,20)),
    fill:'none',stroke:FADE,'stroke-width':1.5,'stroke-dasharray':'5 6','stroke-linecap':'round',opacity:0.5},gRoad);
  /* a track from the door to the sluice and the east ground */
  E('path',{d:D(jit([[1210,860],[1320,900],[1440,960],[1560,1020]],2,18)),
    fill:'none',stroke:FADE,'stroke-width':1.4,'stroke-dasharray':'4 6','stroke-linecap':'round',opacity:0.55},gRoad);
  function edgeArrow(x,y,dir,p){
    E('path',{d:'M'+x+' '+y+' L'+(x+dir*50)+' '+y+' M'+(x+dir*50)+' '+y+' l'+(dir*-10)+' -6 M'+(x+dir*50)+' '+y+' l'+(dir*-10)+' 6',
      fill:'none',stroke:INK,'stroke-width':1.7},p);
  }
  edgeArrow(110,1030,-1,gRoad);
  /* a fine arrow for the wind-borne smoke, down toward Sill */
  E('path',{d:'M900 690 q-12 8 -22 20 M878 710 l14 -1 M878 710 l4 -13',
    fill:'none',stroke:SMOKE,'stroke-width':1.4,opacity:0.6},gRoad);

  /* ---------- lettering, inked last above everything ---------- */
  function T(x,y,text,o,p){
    var t=E('text',{x:x,y:y,'font-family':(o&&o.font)||'Cinzel','font-size':(o&&o.size)||20,
      fill:(o&&o.fill)||INK,'letter-spacing':(o&&o.ls)||0,
      'text-anchor':(o&&o.anchor)||'start',opacity:(o&&o.opacity)||1,
      'font-weight':(o&&o.weight)||null,
      'stroke':(o&&o.halo)?PALE:null,'stroke-width':(o&&o.halo)?3.2:null,'paint-order':(o&&o.halo)?'stroke':null,
      transform:(o&&o.rot)?('rotate('+o.rot+' '+x+' '+y+')'):null},p||gText);
    t.textContent=text; return t;
  }
  function note(x,y,lines,o){
    o=o||{};var lh=o.lh||22;
    lines.forEach(function(ln,j){T(x,y+j*lh,ln,{font:'FellIt',size:o.size||16,fill:o.fill||'#574226',opacity:o.opacity||0.92});});
  }

  /* the ground, named in place */
  T(1200,404,'THE TALLOW WORKS',{font:'FellSC',size:30,ls:5,fill:FADE,anchor:'middle',halo:true});
  T(1200,432,'the rendering house and its yard',{font:'FellIt',size:17,fill:FADE,anchor:'middle',halo:true});
  T(670,438,'the sheep-folds',{font:'FellIt',size:15,fill:INK,anchor:'middle',halo:true});
  T(1010,848,'the rendering house',{font:'FellIt',size:16,fill:INK,anchor:'middle',halo:true});
  T(1000,694,'the vats',{font:'FellIt',size:14,fill:INK,anchor:'middle',halo:true});
  T(1268,500,'the hot flue',{font:'FellIt',size:14,fill:INK,anchor:'middle',halo:true});

  ],{size:16,lh:22,fill:RED});

    'burnt at the door; no value arising.'
  ],{size:15,lh:21,fill:'#574226'});
  note(1850,860,[
    'Fever first and the cold after. A man stung twenty will',
    'not say his name. Keep him warm, keep him still, do not',

    'hands: no figure, and none asked for.'
  ],{size:15,lh:21,fill:RED});

    'A second crack in the cold north wall past the flue has',

    'Set down in words and not marked on the wall.'
  ],{size:15,lh:21,fill:'#574226'});
  note(940,1180,[
