  /* ---------- marginal notes in the surveyor’s voice ---------- */
  note(110,360,[
    'Nine springs rise in the Keel, within twenty leagues of the',
    'Hearthseat and five leagues short of it by the frozen road.',
    'Here the ground gives back more than it takes. What it takes',
    'is not written on the stone, and the answer is not safe to carry.'
  ],{size:15,fill:'#574226'});
  note(110,514,[
    'Five cups are worn smooth with thumbs. Four are stopped with',
    'lead. A hollow that does not wear belongs to the Court, not to',
    'the hand that warms a child. Leave a bit in an open cup; take',
    'nothing out of a cup that is stopped.'
  ],{size:15,fill:'#574226'});
  note(110,668,[
    'The reader came up from the Hearthseat on Stone 22 of the',
    'Thin Year and spoke four sentences over the steam. He spoke to',
    'the stone, the wells, the dish, and last of all to us, the order',
    'a reader uses when somebody may be listening who wants a figure.'
  ],{size:15,fill:'#574226'});
  note(110,822,[
    'The people answered: The well gives back what the well got;',
    'it does not say from where. The children said it twice, once',
    'for the road up and once for the road down. The clerk put a',
    'round nought against the space in the song. Four are four.'
  ],{size:15,fill:'#574226'});
  note(110,976,[
    'On the Last Day the grey at the lip is left where it lies; in',
    'the morning it is taken and called dealt with. The rich buy it',
    'in a phial and call it quiet ash. The keeper has not swept the',
    'grey off this stone and has entered neither level nor winter.'
  ],{size:15,fill:'#574226'});

  note(1810,312,[
    'Four were sealed in the first hundred and twenty years; a',
    'fifth was sealed in Y.H. 618 and the keeper of it was hanged',
    'for drawing without a key. The roll gives the office and not',
    'the name. His account stands open and is carried forward.'
  ],{size:15,fill:'#574226'});
  note(1810,466,[
    'The books count five sealed; the stone shows four stopped',
    'cups. A reeve come up from the Fenmarch says the spring of',
    'Y.H. 618 is not under the Keel at all but under the Cantons,',
    'set twenty leagues off so no collector need walk the south road.'
  ],{size:15,fill:'#574226'});
  note(1810,620,[
    'He has set the saying beside the figure and joined neither.',
    'A man who joins the two has drawn a map, and the keeper of',
    'the key-slate has no licence to draw one. Both stand here,',
    'as the five open cups stand beside the four.'
  ],{size:15,fill:'#574226'});
  note(1810,774,[
    'At the foot, struck through and written again very small in',
    'a hand nobody will own: Five were left open by a hand. Four',
    'were stopped by another. The steam does not tell which hand',
    'was kinder. Four answerings, and no hand.'
  ],{size:15,fill:'#574226'});
  note(1810,928,[
    'One part in twelve of every measure is kept back for the',
    'fire, as the notice says. A bit put into an open cup is a',
    'keeping; a bit taken from a stopped cup is theft, and the',
    'wrist is marked so the account may find the hand again.'
  ],{size:15,fill:'#574226'});
