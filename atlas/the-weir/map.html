<style>

</style>
</head>
<body>
<div id="paper"></div>
<svg id="m" viewBox="0 0 2400 1600" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
(function(){
  'use strict';
  var NS='http://www.w3.org/2000/svg';
  var svg=document.getElementById('m');
  var INK='#2b1b0e', FADE='#6b5331', RED='#7e1f14', SEA='#547a72', SEAWASH='#a9bfb2',
      GOLD='#a9833c', GREEN='#7c8a5e', MG='#5d6b46', PALE='#efe3c6';

  function E(tag,attrs,parent){
    var n=document.createElementNS(NS,tag),k;
    for(k in attrs){ if(attrs[k]!==null && attrs[k]!==undefined && attrs[k]!==''){ n.setAttribute(k,attrs[k]); } }
    (parent||svg).appendChild(n);
    return n;
  }
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
  var rnd=mulberry32(441580);
  function rr(a,b){return a+(b-a)*rnd();}
  function jit(pts,amp,seg){
    seg=seg||7; var out=[],i,s;
    for(i=0;i<pts.length-1;i++){
      var x1=pts[i][0],y1=pts[i][1],x2=pts[i+1][0],y2=pts[i+1][1];
      var dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy)||1;
      var nx=-dy/len,ny=dx/len,n=Math.max(1,Math.round(len/seg));
      for(s=0;s<n;s++){ var t=s/n,o=(rnd()-0.5)*2*amp; out.push([x1+dx*t+nx*o,y1+dy*t+ny*o]); }
    }
    out.push(pts[pts.length-1]); return out;
  }
  function D(pts,close){
    var s='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
    for(var i=1;i<pts.length;i++){s+=' L'+pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1);}
    return close?s+' Z':s;
  }

  /* ---------- layers, in the order they are inked ---------- */
  var defs=E('defs',{});
  E('image',{x:0,y:0,width:2400,height:1600,href:'../../design/textures/parchment.jpg',preserveAspectRatio:'xMidYMid slice',opacity:0.52});
  var gWash=E('g',{}), gTerr=E('g',{}), gWater=E('g',{}), gShoal=E('g',{}),
      gStruct=E('g',{}), gRoad=E('g',{}), gFrame=E('g',{}), gText=E('g',{});

  /* foxing, folds and the damp valley wash */
  for(var fi=0;fi<26;fi++){
    E('ellipse',{cx:rr(80,2320),cy:rr(80,1520),rx:rr(16,76),ry:rr(10,48),
      fill:'#8a612f',opacity:rr(0.012,0.05),transform:'rotate('+rr(0,180)+' '+rr(200,2200)+' '+rr(200,1400)+')'},gWash);
  }
  [540,1180,1840].forEach(function(x){E('line',{x1:x,y1:60,x2:x+2,y2:1540,stroke:'#7a5a30','stroke-width':1,opacity:0.07},gWash);});
  E('line',{x1:60,y1:806,x2:2340,y2:806,stroke:'#7a5a30','stroke-width':1,opacity:0.05},gWash);
  E('path',{d:D(jit([[60,624],[420,606],[860,630],[1300,612],[1780,638],[2340,620],[2340,1030],[1780,1058],[1300,1036],[860,1064],[420,1042],[60,1062]],4,30),true),
    fill:'#c9b99a',opacity:0.20},gWash);
  E('path',{d:D(jit([[60,988],[520,972],[980,1000],[1460,982],[1940,1010],[2340,996],[2340,1090],[1940,1104],[1460,1078],[980,1106],[520,1084],[60,1096]],4,28),true),
    fill:'#aebd9e',opacity:0.13},gWash);

  /* ---------- terrain outside the water: reeds, willows, low banks ---------- */
  function tuft(x,y,s,p){
    var g=E('g',{transform:'translate('+x.toFixed(1)+' '+y.toFixed(1)+') scale('+s.toFixed(2)+')'},p);
    E('path',{d:'M-5 2 q-2 -8 -6 -12 M0 2 L0 -14 M5 2 q2 -7 7 -11 M-2 2 q-1 -6 -3 -9',
      fill:'none',stroke:MG,'stroke-width':1.1,opacity:0.8},g);
  }
  function willow(x,y,s,p){
    var g=E('g',{transform:'translate('+x.toFixed(1)+' '+y.toFixed(1)+') scale('+s.toFixed(2)+')'},p);
    E('path',{d:'M0 0 L0 -18',stroke:INK,'stroke-width':1.2},g);
    E('path',{d:'M-12 -12 q12 -8 24 0 M-9 -17 q9 -7 18 0 M-6 -21 q6 -5 12 0',fill:'none',stroke:GREEN,'stroke-width':1.1,opacity:0.8},g);
    E('path',{d:'M-7 -13 q-2 7 -5 10 M8 -13 q2 7 5 10',fill:'none',stroke:MG,'stroke-width':0.8,opacity:0.6},g);
  }
  function hill(x,y,s,p){
    E('path',{d:'M'+(x-11*s).toFixed(1)+' '+y+' q'+(11*s).toFixed(1)+' '+(-11*s).toFixed(1)+' '+(22*s).toFixed(1)+' 0',
      fill:'none',stroke:FADE,'stroke-width':1.2,opacity:0.55},p);
  }
  var i;
  for(i=0;i<86;i++){tuft(rr(90,2320),rr(636,688),rr(0.7,1.25),gTerr);}
  for(i=0;i<94;i++){tuft(rr(90,2320),rr(966,1024),rr(0.7,1.3),gTerr);}
  for(i=0;i<18;i++){willow(rr(160,2240),rr(586,658),rr(0.65,1.15),gTerr);}
  for(i=0;i<22;i++){hill(rr(140,2260),rr(560,626),rr(0.7,1.3),gTerr);}
  for(i=0;i<10;i++){willow(rr(180,2260),rr(1046,1090),rr(0.55,0.9),gTerr);}

  /* ---------- the Ilm: a broad, hand-drawn channel ---------- */
  var center=jit([[40,872],[240,846],[440,824],[640,808],[840,818],[1040,838],
                  [1240,852],[1440,836],[1640,820],[1840,838],[2040,858],[2240,872],[2360,884]],2.2,16);
  var bankS=[],bankN=[],norm=[],half=[],k;
  for(k=0;k<center.length;k++){
    var a=center[Math.max(0,k-1)],b=center[Math.min(center.length-1,k+1)];
    var dx=b[0]-a[0],dy=b[1]-a[1],le=Math.sqrt(dx*dx+dy*dy)||1;
    var nx=-dy/le,ny=dx/le,t=k/(center.length-1);
    var w=100+40*t+Math.sin(k*0.62)*4.5;
    var js=rr(-3.6,3.6),jn=rr(-3.6,3.6);
    bankS.push([center[k][0]+nx*(w+js),center[k][1]+ny*(w+js)]);
    bankN.push([center[k][0]-nx*(w+jn),center[k][1]-ny*(w+jn)]);
    norm.push([nx,ny]); half.push(w);
  }
  E('path',{d:D(bankS.concat(bankN.slice().reverse()),true),fill:SEAWASH,opacity:0.50},gWater);
  /* the deep thread and the slower currents */
  E('path',{d:D(center),fill:'none',stroke:SEA,'stroke-width':3.4,'stroke-linecap':'round',opacity:0.30},gWater);
  [-0.66,-0.3,0.32,0.68].forEach(function(f){
    var pts=[],j;
    for(j=2;j<center.length-2;j++){
      pts.push([center[j][0]+norm[j][0]*half[j]*f+Math.sin(j*0.9+f*7)*2,
                center[j][1]+norm[j][1]*half[j]*f+Math.cos(j*0.8+f*5)*2]);
    }
    E('path',{d:D(pts),fill:'none',stroke:SEA,'stroke-width':1.1,opacity:0.22},gWater);
  });
  /* ripples cut by the engraver's burin */
  for(k=0;k<92;k++){
    var q=Math.floor(rr(3,center.length-4)), f=rr(-0.78,0.78);
    var px=center[q][0]+norm[q][0]*half[q]*f, py=center[q][1]+norm[q][1]*half[q]*f;
    E('path',{d:'M'+px.toFixed(1)+' '+py.toFixed(1)+' q10 -3.4 21 0',fill:'none',stroke:SEA,'stroke-width':1,opacity:rr(0.10,0.26)},gWater);
  }
  /* bank outlines and outward hatching */
  [bankS,bankN].forEach(function(bank){
    E('path',{d:D(bank),fill:'none',stroke:INK,'stroke-width':2.2,'stroke-linejoin':'round'},gWater);
    var m;
    for(m=2;m<bank.length-2;m+=3){
      var a=bank[m-1],b=bank[m+1],dx=b[0]-a[0],dy=b[1]-a[1],le=Math.sqrt(dx*dx+dy*dy)||1;
      var nx=-dy/le,ny=dx/le,sg=(bank===bankS)?1:-1,L=rr(7,14);
      E('line',{x1:bank[m][0],y1:bank[m][1],x2:bank[m][0]+nx*sg*L+dx/le*L*0.3,y2:bank[m][1]+ny*sg*L+dy/le*L*0.3,
        stroke:INK,'stroke-width':0.8,opacity:0.28},gWater);
    }
  });

  /* ---------- shoals and reeds within the channel ---------- */
  function shoal(pts,p){
    var jp=jit(pts,3,14);
    E('path',{d:D(jp,true),fill:'#cbb68d',opacity:0.62},p);
    E('path',{d:D(jp,true),fill:'none',stroke:FADE,'stroke-width':1.1,'stroke-dasharray':'3 5',opacity:0.7},p);
    for(var z=0;z<9;z++){tuft(rr(pts[0][0],pts[2][0]),rr(pts[0][1],pts[2][1]),rr(0.5,0.9),p);}
  }
  shoal([[792,928],[856,898],[924,922],[944,966],[862,982],[796,964]],gShoal);
  shoal([[1246,742],[1308,718],[1372,742],[1350,778],[1282,784]],gShoal);
  shoal([[1568,884],[1624,858],[1692,878],[1668,918],[1592,924]],gShoal);
  shoal([[418,838],[470,822],[508,842],[482,866],[428,862]],gShoal);

  /* ---------- structures: the weir, traps, walk, hut, racks, stone ---------- */
  function trap(x,y,rot,s,p){
    var g=E('g',{transform:'translate('+x+' '+y+') rotate('+rot+') scale('+s+')'},p);
    E('path',{d:'M-10 -9 L10 -3.4 L10 3.4 L-10 9 Z',fill:'#dccfae',stroke:INK,'stroke-width':1.2,'stroke-linejoin':'round'},g);
    E('path',{d:'M-10 -9 q-4.5 9 0 18',fill:'none',stroke:INK,'stroke-width':1.4},g);
    for(var h=0;h<4;h++){
      var xx=-6+h*4.2, yy=7-h*1.4;
      E('line',{x1:xx,y1:-yy,x2:xx,y2:yy,stroke:FADE,'stroke-width':0.6,opacity:0.75},g);
    }
    E('path',{d:'M-9 0 L10 0',fill:'none',stroke:FADE,'stroke-width':0.5,opacity:0.5},g);
    return g;
  }
  function rail(x1,y1,x2,y2,p,posts){
    var dx=x2-x1,dy=y2-y1,le=Math.sqrt(dx*dx+dy*dy)||1;
    var nx=-dy/le,ny=dx/le;
    E('line',{x1:x1+nx*5,y1:y1+ny*5,x2:x2+nx*5,y2:y2+ny*5,stroke:INK,'stroke-width':2},p);
    E('line',{x1:x1-nx*5,y1:y1-ny*5,x2:x2-nx*5,y2:y2-ny*5,stroke:INK,'stroke-width':2},p);
    var n=Math.max(2,Math.round(le/20)),j;
    for(j=0;j<=n;j++){
      var t=j/n,px=x1+dx*t,py=y1+dy*t;
      E('line',{x1:px+nx*6,y1:py+ny*6,x2:px-nx*6,y2:py-ny*6,stroke:INK,'stroke-width':1,opacity:0.85},p);
      if(posts && j%3===0){
        E('line',{x1:px+nx*5,y1:py+ny*5,x2:px+nx*5+ny*3,y2:py+ny*5-nx*3+13,stroke:INK,'stroke-width':1.4,opacity:0.8},p);
        E('line',{x1:px-nx*5,y1:py-ny*5,x2:px-nx*5+ny*3,y2:py-ny*5-nx*3+13,stroke:INK,'stroke-width':1.4,opacity:0.8},p);
      }
    }
  }
  /* the V of stakes, pointing upriver */
  rail(930,706,1044,832,gStruct,true);
  rail(1044,832,1206,952,gStruct,true);
  /* cross-bracing between the stakes */
  [[946,724,986,768],[990,772,1032,818],[1062,850,1104,894],[1110,902,1154,944]].forEach(function(b){
    E('line',{x1:b[0],y1:b[1],x2:b[2],y2:b[3],stroke:FADE,'stroke-width':1.1,opacity:0.8},gStruct);
  });
  /* the traps set in the gaps, mouths upriver */
  trap(978,742,-24,0.9,gStruct); trap(1016,786,-26,0.86,gStruct);
  trap(1068,824,-30,0.9,gStruct); trap(1108,884,18,0.9,gStruct);
  trap(1152,924,16,0.86,gStruct); trap(966,876,-14,0.78,gStruct);
  trap(1088,930,10,0.8,gStruct); trap(1232,890,-8,0.7,gStruct);

  /* the plank walk along the north bank, with a spur out to the weir head */
  rail(2290,672,1830,682,gStruct,true);
  rail(1830,682,1400,690,gStruct,true);
  rail(1400,690,1000,696,gStruct,true);
  rail(1000,696,930,706,gStruct,true);
  rail(930,706,988,772,gStruct,false);
  rail(988,772,1040,826,gStruct,false);

  /* Orra's trap-hut, salt eels and a smoke-wisp */
  var hut=E('g',{},gStruct);
  E('line',{x1:1426,y1:690,x2:1426,y2:668,stroke:INK,'stroke-width':2},hut);
  E('line',{x1:1496,y1:690,x2:1496,y2:668,stroke:INK,'stroke-width':2},hut);
  E('rect',{x:1418,y:636,width:86,height:34,fill:'#e6d8b8',stroke:INK,'stroke-width':2},hut);
  E('path',{d:'M1406 638 L1461 606 L1516 638 Z',fill:'#cbb58f',stroke:INK,'stroke-width':2,'stroke-linejoin':'round'},hut);
  for(i=0;i<7;i++){E('line',{x1:1418+i*12.3,y1:638,x2:1440+i*10,y2:612,stroke:FADE,'stroke-width':0.7,opacity:0.5},hut);}
  E('rect',{x:1446,y:652,width:20,height:18,fill:'#6b5331',stroke:INK,'stroke-width':1.2},hut);
  E('path',{d:'M1474 620 q-7 -9 2 -15 q7 -5 1 -12',fill:'none',stroke:INK,'stroke-width':1,'stroke-linecap':'round',opacity:0.5},hut);
  E('path',{d:'M1504 668 L1528 668 M1504 674 L1528 674',stroke:INK,'stroke-width':1.1},hut);
  for(i=0;i<3;i++){E('path',{d:'M'+(1508+i*7)+' 668 q2 -7 4 0',fill:'none',stroke:FADE,'stroke-width':1},hut);}

  /* racks of salted eels beside the hut */
  function rack(x,y,p){
    var g=E('g',{},p);
    E('line',{x1:x,y1:y,x2:x,y2:y+46,stroke:INK,'stroke-width':2},g);
    E('line',{x1:x+76,y1:y,x2:x+76,y2:y+46,stroke:INK,'stroke-width':2},g);
    E('line',{x1:x-4,y1:y+4,x2:x+80,y2:y+4,stroke:INK,'stroke-width':2},g);
    for(var e=0;e<7;e++){
      var ex=x+7+e*10.5;
      E('path',{d:'M'+ex+' '+(y+5)+' q-3 9 0 19 q3 8 0 14',fill:'none',stroke:'#8a7a52','stroke-width':1.6,'stroke-linecap':'round'},g);
      E('circle',{cx:ex,cy:y+6,r:1.5,fill:INK},g);
    }
    E('line',{x1:x-4,y1:y+42,x2:x+80,y2:y+42,stroke:FADE,'stroke-width':0.8,opacity:0.5},g);
    return g;
  }
  rack(1600,654,gStruct);
  rack(1704,660,gStruct);

  /* the flat blessing stone on the north bank, with a hearth-maid's crossed mark */
  var st=jit([[786,682],[812,672],[846,676],[856,690],[840,700],[802,698]],2.3,10);
  E('path',{d:D(st,true),fill:'#cfc3a3',stroke:INK,'stroke-width':1.6},gStruct);
  E('path',{d:'M818 682 l0 12 M812 688 l12 0',fill:'none',stroke:RED,'stroke-width':1.5,opacity:0.85},gStruct);

  /* a punt, poled upriver, and eels moving in the deep thread */
  function boat(x,y,p){
    var g=E('g',{},p);
    E('path',{d:'M'+(x-30)+' '+y+' q30 13 60 0 q-30 -7 -60 0 z',fill:'#dccfae',stroke:INK,'stroke-width':1.6},g);
    E('path',{d:'M'+(x-22)+' '+(y-1)+' q22 -5 44 0',fill:'none',stroke:FADE,'stroke-width':0.8,opacity:0.7},g);
    E('line',{x1:x+4,y1:y-2,x2:x+20,y2:y-46,stroke:INK,'stroke-width':1.4},g);
    E('circle',{cx:x-8,cy:y-4,r:3,fill:'#6b5331',stroke:INK,'stroke-width':0.8},g);
    return g;
  }
  boat(1802,872,gStruct);
  function eel(x,y,rot,s,p){
    E('path',{d:'M0 0 q9 -6 18 0 q9 6 18 0',fill:'none',stroke:'#6b6a42','stroke-width':2*s,'stroke-linecap':'round',opacity:0.55,
      transform:'translate('+x+' '+y+') rotate('+rot+') scale('+s+')'},p);
  }
  eel(694,830,-3,1,gStruct); eel(1332,884,4,0.9,gStruct); eel(1988,852,-2,1.05,gStruct);

  /* an engraver's eel in the upper field, cut in fine line and hatching */
  function greatEel(x,y,p){
    var g=E('g',{transform:'translate('+x+' '+y+')'},p);
    var d='M0 0 C70 -34 130 16 200 -4 C270 -24 320 14 372 -6 C322 22 270 -8 200 14 C130 36 70 -14 0 0 Z';
    var cp=E('clipPath',{id:'eelClip'},defs); E('path',{d:d},cp);
    E('path',{d:d,fill:'#d7c49c',opacity:0.72,stroke:INK,'stroke-width':1.5,'stroke-linejoin':'round'},g);
    var hg=E('g',{'clip-path':'url(#eelClip)'},g),h;
    for(h=6;h<376;h+=15){
      E('line',{x1:h-22,y1:-34,x2:h+22,y2:34,stroke:FADE,'stroke-width':0.8,opacity:0.34},hg);
    }
    E('path',{d:'M2 0 q7 -2 12 0',fill:'none',stroke:INK,'stroke-width':1},g);
    E('circle',{cx:17,cy:-4,r:2.4,fill:INK},g);
    E('path',{d:'M31 -12 q-4 12 0 24',fill:'none',stroke:INK,'stroke-width':1,opacity:0.7},g);
    E('path',{d:'M42 -14 q60 -24 118 -3 M42 14 q60 22 118 3',fill:'none',stroke:INK,'stroke-width':0.8,opacity:0.5},g);
    return g;
  }
  greatEel(1012,430,gStruct);

  /* ---------- the river road, dashed along the north bank ---------- */
  E('path',{d:D(jit([[60,646],[420,632],[820,636],[1180,638],[1560,626],[1960,634],[2340,628]],2,20)),
    fill:'none',stroke:INK,'stroke-width':2,'stroke-dasharray':'7 6','stroke-linecap':'round',opacity:0.72},gRoad);
  function edgeArrow(x,y,dir,p){
    E('path',{d:'M'+x+' '+y+' L'+(x+dir*54)+' '+y+' M'+(x+dir*54)+' '+y+' l'+(dir*-10)+' -6 M'+(x+dir*54)+' '+y+' l'+(dir*-10)+' 6',
      fill:'none',stroke:INK,'stroke-width':1.7},p);
  }
  edgeArrow(2246,566,1,gRoad);
  edgeArrow(154,566,-1,gRoad);

  /* ---------- text helpers: every label is inked last, above everything ---------- */
  function T(x,y,text,o,p){
    var t=E('text',{x:x,y:y,'font-family':(o&&o.font)||'Cinzel','font-size':(o&&o.size)||20,
      fill:(o&&o.fill)||INK,'letter-spacing':(o&&o.ls)||0,
      'text-anchor':(o&&o.anchor)||'start',opacity:(o&&o.opacity)||1,
      'font-weight':(o&&o.weight)||null,
      'stroke':(o&&o.halo)?PALE:null,'stroke-width':(o&&o.halo)?3.2:null,'paint-order':(o&&o.halo)?'stroke':null,
      transform:(o&&o.rot)?('rotate('+o.rot+' '+x+' '+y+')'):null},p||gText);
    t.textContent=text; return t;
  }
  function note(x,y,lines,o){
    o=o||{};var lh=o.lh||24;
    lines.forEach(function(ln,k){T(x,y+k*lh,ln,{font:'FellIt',size:o.size||17,fill:o.fill||'#5a4127',opacity:o.opacity||0.92});});
  }

  /* the water and the site, named in place */
  T(520,824,'the Ilm',{font:'FellIt',size:24,fill:SEA,rot:-2,halo:true});
  T(1920,842,'the Ilm',{font:'FellIt',size:24,fill:SEA,rot:2,halo:true});
  T(1072,586,'THE WEIR',{font:'FellSC',size:27,ls:7,fill:FADE,anchor:'middle',opacity:0.85});
