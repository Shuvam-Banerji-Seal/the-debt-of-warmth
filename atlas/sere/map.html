function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}

function channel(pts,w0,w1,p){

    right.push([jp[k][0]-nx*w,jp[k][1]-ny*w]);
  }
  E('path',{d:D(left.concat(right.reverse()),true),fill:'#a9beb1',opacity:0.7},p);
  E('path',{d:D(jp),fill:'none',stroke:WATER,'stroke-width':Math.max(1.4,w1*0.6),'stroke-linecap':'round'},p);
  E('path',{d:D(jp),fill:'none',stroke:INK,'stroke-width':0.9,opacity:0.55},p);

note(100,516,[
  'At the third hour a public bowl of wine is emptied in',
  'the Open Court and an act of the Sun-Emperor announced.',

  'the bowl goes over in the same manner.'
]);
note(100,716,[
  'The fourth bowl is set out at every feast and carried',
  'away full. Nobody pours it and nobody says whose debt',
  'it holds. The house does not know, which is called a',
  'mercy of the Spending and not a failure of the house.'
]);
note(100,916,[

]);
note(1996,520,[

]);

]);
note(1996,920,[

]);
note(1996,1140,[
