<script>
(function(){
  'use strict';
  var NS='http://www.w3.org/2000/svg';
  var svg=document.getElementById('m');
  var INK='#2b1b0e', FADE='#6b5331', RED='#7e1f14', SEA='#547a72', COLD='#5b6a68',
      COLDWASH='#bfc6c3', GOLD='#a9833c', PALE='#efe3c6', EARTH='#d8bf90';

  function E(tag,attrs,parent){
    var n=document.createElementNS(NS,tag),k;
    for(k in attrs){ if(attrs[k]!==null && attrs[k]!==undefined && attrs[k]!==''){ n.setAttribute(k,attrs[k]); } }
    (parent||svg).appendChild(n);
    return n;
  }
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
  var rnd=mulberry32(813394);
  function rr(a,b){return a+(b-a)*rnd();}

  function jit(pts,amp,seg){
    seg=seg||7; var out=[],i,s;
    for(i=0;i<pts.length-1;i++){
      var x1=pts[i][0],y1=pts[i][1],x2=pts[i+1][0],y2=pts[i+1][1];
      var dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy)||1;
      var nx=-dy/len,ny=dx/len,n=Math.max(1,Math.round(len/seg));
      for(s=0;s<n;s++){ var t=s/n,o=(rnd()-0.5)*2*amp; out.push([x1+dx*t+nx*o,y1+dy*t+ny*o]); }
    }
    out.push(pts[pts.length-1]); return out;
  }
  function D(pts,close){
    var s='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
    for(var i=1;i<pts.length;i++){s+=' L'+pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1);}
    return close?s+' Z':s;
  }
  function centroid(pts){var x=0,y=0,i;for(i=0;i<pts.length;i++){x+=pts[i][0];y+=pts[i][1];}return [x/pts.length,y/pts.length];}
  function inward(pts,d){
    var c=centroid(pts),out=[],i;
    for(i=0;i<pts.length;i++){
      var p=pts[i],a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];
      var dx=b[0]-a[0],dy=b[1]-a[1],len=Math.sqrt(dx*dx+dy*dy)||1;
      var nx=-dy/len,ny=dx/len;
      if(nx*(c[0]-p[0])+ny*(c[1]-p[1])<0){nx=-nx;ny=-ny;}
      out.push([p[0]+nx*d,p[1]+ny*d]);
    }

  }
  function scalePts(pts,c,k){return pts.map(function(p){return [c[0]+(p[0]-c[0])*k,c[1]+(p[1]-c[1])*k];});}
  function bounds(pts){

    for(i=0;i<pts.length;i++){a=Math.min(a,pts[i][0]);b=Math.min(b,pts[i][1]);c=Math.max(c,pts[i][0]);d=Math.max(d,pts[i][1]);}

  }

  /* ---------- layers. Everything is inked in order; all lettering goes on last. ---------- */

  [610,1210,1810].forEach(function(x){E('line',{x1:x,y1:60,x2:x+2,y2:1540,stroke:'#7a5a30','stroke-width':1,opacity:0.07},gWash);});
  E('line',{x1:60,y1:806,x2:2340,y2:806,stroke:'#7a5a30','stroke-width':1,opacity:0.06},gWash);

  /* ---------- the near rim of Sarn, drawn faintly for neighbourhood ---------- */
  var sarnPts=jit([[1710,70],[2340,70],[2340,1530],[1706,1530],[1728,1330],[1686,1150],[1718,952],[1674,760],[1706,560],[1668,360],[1698,180]],6,18);

  function tree(x,y,s,p){

  function coast(shape,idx){

  /* ---------- seams of cold ---------- */
  function seam(pts){
    var p=jit(pts,5,15),q;

  /* ---------- the Rim, with the one travelled gap ---------- */
  function peak(x,y,s,rot,p){
    var g=E('g',{transform:'translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+rot.toFixed(1)+') scale('+s.toFixed(2)+')'},p);

    for(k=0;k<3;k++){E('line',{x1:1+k*2.4,y1:-8+k*5,x2:6+k*2.4,y2:1+k*5,stroke:INK,'stroke-width':0.6,opacity:0.5},g);}
    E('path',{d:'M-4.5 -3 L0 -14 L4.5 -3',fill:'none',stroke:'#f2e6ca','stroke-width':1.4,opacity:0.8},g);
  }
  function range(anchors,p,gap){
    var pts=jit(anchors,4,11),a,b,dx,dy,le,cnt,t,q;
    for(q=0;q<pts.length-1;q++){
      a=pts[q];b=pts[q+1];dx=b[0]-a[0];dy=b[1]-a[1];le=Math.sqrt(dx*dx+dy*dy)||1;
      cnt=Math.max(1,Math.round(le/(gap||20)));
      for(k=0;k<cnt;k++){
        t=(k+0.5)/cnt;
        peak(a[0]+dx*t+rr(-3,3),a[1]+dy*t+rr(-4,4),rr(0.7,1.3),rr(-16,16),p);
      }

  }

  range([[1668,108],[1648,248],[1618,392],[1640,520]],gTerr,19);

  /* ---------- travelled ways and survey marks ---------- */
  function road(pts,p,col,dash,op){
    E('path',{d:D(jit(pts,2,14)),fill:'none',stroke:col||INK,'stroke-width':2,
      'stroke-dasharray':dash||'7 6','stroke-linecap':'round',opacity:op||0.75},p);
  }
  function river(pts,w0,w1,p){
    var jp=jit(pts,2.5,12),left=[],right=[],a,b,dx,dy,le,nx,ny,t,w,q;
    for(q=0;q<jp.length;q++){
      a=jp[Math.max(0,q-1)];b=jp[Math.min(jp.length-1,q+1)];
      dx=b[0]-a[0];dy=b[1]-a[1];le=Math.sqrt(dx*dx+dy*dy)||1;nx=-dy/le;ny=dx/le;
      t=q/(jp.length-1);w=w0+(w1-w0)*t;
      left.push([jp[q][0]+nx*w,jp[q][1]+ny*w]);right.push([jp[q][0]-nx*w,jp[q][1]+ny*w]);
    }
    E('path',{d:D(left.concat(right.reverse()),true),fill:'#7c9a90',opacity:0.5},p);
    E('path',{d:D(jp),fill:'none',stroke:SEA,'stroke-width':Math.max(1.4,w1*0.7),'stroke-linecap':'round'},p);
    E('path',{d:D(jp),fill:'none',stroke:INK,'stroke-width':1,'stroke-linecap':'round',opacity:0.78},p);

  road([[1564,608],[1650,636],[1740,660],[1880,744],[2020,820],[2084,852]],gStruct,INK,'6 5',0.7);

  /* the last honest post and its little row of stakes */
  function post(x,y,p){
    E('path',{d:'M'+x+' '+y+' L'+x+' '+(y-22)+' M'+(x-8)+' '+(y-16)+' L'+(x+8)+' '+(y-18),stroke:INK,'stroke-width':2.4},p);

    E('path',{d:'M'+(x-9)+' '+y+' l17 0',stroke:RED,'stroke-width':2,'stroke-dasharray':'3 3'},p);

      fill:'#cfc3a3',stroke:INK,'stroke-width':1.3},p);

  E('path',{d:D(jit([[1850,1370],[2000,1340],[2160,1330],[2340,1290]],4,14)),fill:'none',stroke:FADE,'stroke-width':2.4,'stroke-dasharray':'2 7',opacity:0.62},gStruct);

  /* tally-sticks along the Peat Line */

  E('path',{d:D(jit([[1780,1470],[1940,1460],[2110,1474],[2340,1450]],3,16)),fill:'none',stroke:RED,'stroke-width':1.8,'stroke-dasharray':'14 8 3 8',opacity:0.6},gStruct);

  /* ---------- the uncollected, sitting upright facing the way they came ---------- */
  function sitter(x,y,s,p){
    var g=E('g',{transform:'translate('+x.toFixed(1)+' '+y.toFixed(1)+') scale('+s.toFixed(2)+')'},p);
    E('line',{x1:-13,y1:13,x2:15,y2:13,stroke:INK,'stroke-width':1,opacity:0.5},g);
    E('circle',{cx:2,cy:-17,r:4.2,fill:'#efe3c6',stroke:INK,'stroke-width':1.2},g);
    E('path',{d:'M-1 -12 L-4 3 M-4 3 L9 3 M9 3 L9 13 M-4 3 L-9 13 M-2 -9 L6 -1 M6 -1 L8 -3',

    E('path',{d:'M2 -13 L2 -12',stroke:INK,'stroke-width':0.7,opacity:0.6},g);
  }
  function cairn(x,y,s,p){
    var g=E('g',{transform:'translate('+x.toFixed(1)+' '+y.toFixed(1)+') scale('+s.toFixed(2)+')'},p);
    E('path',{d:'M-9 8 L-5 -1 L3 -3 L10 8 Z',fill:'#cfc3a3',stroke:INK,'stroke-width':1.2},g);
    E('path',{d:'M-5 -1 L1 3 L10 8 M3 -3 L1 3',fill:'none',stroke:INK,'stroke-width':0.7,opacity:0.6},g);
  }
  var sitters=[[224,482,0.95],[372,536,0.85],[532,446,1.05],[706,512,0.9],[898,470,0.95],[1082,552,1.0],[1258,508,0.85],
               [560,700,1.0],[446,910,0.9],[626,864,1.05],[826,930,0.9],[1024,884,1.0],[1222,944,0.9],
               [372,1246,0.95],[566,1188,0.85],[786,1260,1.0],[982,1192,0.9],[1162,1292,1.05],
