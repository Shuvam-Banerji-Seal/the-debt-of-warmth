<script>

  function E(tag,attrs,parent){
    var n=document.createElementNS(NS,tag),k;

    for(i=0;i<pts.length-1;i++){

      var dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy)||1;

  /* ---------- a tapered, hand-drawn river ---------- */

    var bankA=[],bankB=[],norm=[],half=[];

  T(1510,1020,'the Clay Road',{font:'FellIt',size:15,fill:FADE,rot:4,halo:true});
  T(806,650,'the path to the landing',{font:'FellIt',size:13,fill:FADE,rot:73,halo:true});
  T(860,496,'the landing',{font:'FellIt',size:14,fill:FADE,anchor:'middle',halo:true});
  T(1760,1322,'the marsh',{font:'FellSC',size:18,ls:6,fill:FADE,anchor:'middle',opacity:0.66,halo:true});
