</head>
<body>
<div id="paper"></div>
<svg id="m" viewBox="0 0 1600 2200" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
(function(){
  'use strict';
  var NS='http://www.w3.org/2000/svg';
  var svg=document.getElementById('m');
  var INK='#2b1b0e', FADE='#6b6452', RED='#7e1f14', SLATE='#6b726b',
      COOL='#aab5ab', WARM='#b98a56', GOLD='#a9833c', PAPER='#ece2ca';

  function E(tag,attrs,parent){
    var n=document.createElementNS(NS,tag),k;
    for(k in attrs){ if(attrs[k]!==null && attrs[k]!==undefined && attrs[k]!==''){ n.setAttribute(k,attrs[k]); } }
    (parent||svg).appendChild(n);
    return n;
  }
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
  var rnd=mulberry32(8121812);
  function rr(a,b){return a+(b-a)*rnd();}

  function jit(pts,amp,seg){
    seg=seg||8; var out=[],i,s;
    for(i=0;i<pts.length-1;i++){
      var x1=pts[i][0],y1=pts[i][1],x2=pts[i+1][0],y2=pts[i+1][1];
      var dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy)||1;
      var nx=-dy/len,ny=dx/len,n=Math.max(1,Math.round(len/seg));
      for(s=0;s<n;s++){ var t=s/n,o=(rnd()-0.5)*2*amp; out.push([x1+dx*t+nx*o,y1+dy*t+ny*o]); }
    }
    out.push(pts[pts.length-1]); return out;
  }
  function D(pts,close){
    var s='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
    for(var i=1;i<pts.length;i++){s+=' L'+pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1);}
    return close?s+' Z':s;
  }
  function ring(cx,cy,rx,ry,amp){
    var pts=[],i,a,n=46;
    for(i=0;i<n;i++){ a=(i/n)*Math.PI*2;
      var o=(rnd()-0.5)*2*amp;
      pts.push([cx+Math.cos(a)*(rx+o),cy+Math.sin(a)*(ry+o*0.55)]); }
    return D(pts,true);
  }

  /* ---------- layers ---------- */
  E('defs',{});
  E('image',{x:0,y:0,width:1600,height:2200,href:'../../design/textures/parchment.jpg',preserveAspectRatio:'xMidYMid slice',opacity:0.42});
  var gWash=E('g',{}), gTerr=E('g',{}), gWater=E('g',{}), gRoad=E('g',{}),
      gBuild=E('g',{}), gFrame=E('g',{}), gLabel=E('g',{});

  /* foxing, water-marks and the ghost of a fold, kept paler than the clay towns */
  for(var fi=0;fi<26;fi++){
    E('ellipse',{cx:rr(70,1530),cy:rr(70,2130),rx:rr(14,60),ry:rr(9,36),
      fill:'#6b6a58',opacity:rr(0.010,0.032),transform:'rotate('+rr(0,180)+' '+rr(200,1400)+' '+rr(300,1900)+')'},gWash);
  }
  [520,1080].forEach(function(x){E('line',{x1:x,y1:60,x2:x+2,y2:2140,stroke:'#5d6153','stroke-width':1,opacity:0.055},gWash);});
  E('line',{x1:56,y1:1140,x2:1544,y2:1140,stroke:'#5d6153','stroke-width':1,opacity:0.05},gWash);

  /* the Keel: a dry ridge of stone, cool in the streets and warm under the city */
  function wash(pts,color,op){E('path',{d:D(jit(pts,7,26),true),fill:color,opacity:op},gWash);}
  wash([[50,1720],[420,1560],[760,1360],[1120,1120],[1460,880],[1560,830],[1560,1240],[1200,1500],[860,1740],[500,1930],[60,2010]],'#aeb8ae',0.17);
  wash([[240,900],[560,858],[1060,872],[1380,922],[1500,1010],[1470,1560],[1120,1660],[620,1630],[270,1500]],'#e3ddc9',0.20);
  E('path',{d:D(jit([[620,1120],[800,1000],[1030,1080],[1010,1390],[800,1470],[590,1370]],6,26),true),
    fill:WARM,opacity:0.10},gWash);

  /* ---------- terrain: contour hatching of the ridge, no growing things in the courts ---------- */
  for(var ci=0;ci<22;ci++){
    var yy=900+ci*46;
    E('path',{d:D(jit([[60,yy+rr(-14,14)],[420,yy-60+rr(-14,14)],[800,yy-140+rr(-14,14)],
      [1160,yy-230+rr(-14,14)],[1540,yy-320+rr(-14,14)]],2.4,40),false),
      fill:'none',stroke:SLATE,'stroke-width':0.9,opacity:0.16},gTerr);
  }
  /* the faint warm bloom below the Hearth, drawn as a cut in the ground */
  E('path',{d:ring(800,1180,430,250,10),fill:WARM,opacity:0.055},gTerr);
  for(var hi=0;hi<72;hi++){
    var ha=rr(0,Math.PI*2), hr=rr(250,430);
    var hx=800+Math.cos(ha)*hr, hy=1180+Math.sin(ha)*hr*0.58;
    E('line',{x1:hx.toFixed(1),y1:hy.toFixed(1),x2:(hx+Math.cos(ha)*rr(4,11)).toFixed(1),y2:(hy+Math.sin(ha)*rr(3,7)).toFixed(1),

  }
  /* a few bare trees beyond the walls, where the country is not swept */
  function tree(x,y,s,p){
    var g=E('g',{transform:'translate('+x+' '+y+') scale('+s+')'},p);

    E('path',{d:'M-8 -13 L0 -22 L8 -13 Z',fill:COOL,stroke:INK,'stroke-width':0.7,opacity:0.6},g);

  for(var ti=0;ti<11;ti++){tree(rr(90,300),rr(1740,1900),rr(0.5,0.8),gTerr);}

  /* ---------- the Hearth below the floor: concentric chambers, entered by cut ---------- */
  var hx0=800, hy0=1210;
  [430,330,238,156,88].forEach(function(r,k){
    E('path',{d:ring(hx0,hy0,r,r*0.52,6+k),fill:'none',
      stroke:k===4?RED:FADE,'stroke-width':k===4?1.5:1.1,

  for(var sk=0;sk<96;sk++){

    E('line',{x1:(hx0+Math.cos(sa)*sr).toFixed(1),y1:(hy0+Math.sin(sa)*sr*0.52).toFixed(1),
      x2:(hx0+Math.cos(sa)*(sr+rr(5,14))).toFixed(1),y2:(hy0+Math.sin(sa)*(sr+rr(5,14))*0.52).toFixed(1),

  /* the hearth-tongue: the drawn way up through the Keel to the grating */
  E('path',{d:'M800 1150 L800 1082',fill:'none',stroke:RED,'stroke-width':1.4,'stroke-dasharray':'2 5',opacity:0.6},gTerr);

  /* ---------- roads: one travelled road, then ruled streets ---------- */
  function road(pts,p,col,dash,w){
    E('path',{d:D(jit(pts,1.6,16)),fill:'none',stroke:col||INK,'stroke-width':w||2,
      'stroke-dasharray':dash||'7 6','stroke-linecap':'round',opacity:0.66},p||gRoad);

  function street(x1,y1,x2,y2,p,w){
    var g=E('g',{},p);

    for(var q=0;q<8;q++){
      var t=(q+0.5)/8, px=x1+(x2-x1)*t, py=y1+(y2-y1)*t;
      E('line',{x1:px-(w||10)/2,y1:py,x2:px+(w||10)/2,y2:py,stroke:FADE,'stroke-width':0.5,opacity:0.3},g);
    }
    return g;
  }
  road([[60,742],[230,760],[392,806],[520,880]]);                 /* the Hearth Road from Greybank */
  road([[1540,1704],[1460,1712],[1400,1724]]);                    /* way out to the Nine Wells */

  E('path',{d:'M438 826 L438 900 M506 846 L506 920 M438 826 L470 812 L506 846',
    fill:'none',stroke:INK,'stroke-width':2},gRoad);

  /* ---------- buildings ---------- */
  function house(x,y,w,h,p,big){
    var g=E('g',{},p), l=x-w/2,r=x+w/2,t=y-h,b=y;
    E('path',{d:'M'+(l-2)+' '+b+' L'+(l+rr(-1,1)).toFixed(1)+' '+(t+4)+' L'+(x-2)+' '+(t-2)+' L'+(r+rr(-1,1)).toFixed(1)+' '+(t+4)+' L'+(r+2)+' '+b+' Z',

    E('path',{d:'M'+(l-5)+' '+(t+4)+' L'+x+' '+(t-h*0.42)+' L'+(r+5)+' '+(t+4),
      fill:'none',stroke:INK,'stroke-width':big?1.5:1.1},g);
    E('path',{d:'M'+(x-w*0.12)+' '+b+' L'+(x-w*0.12)+' '+(b-h*0.56)+' L'+(x+w*0.06)+' '+(b-h*0.56)+' L'+(x+w*0.06)+' '+b,
      fill:'none',stroke:INK,'stroke-width':1,opacity:0.85},g);
    return g;
  }
  /* the bank: columns and a counted door, no smoke */
  function bankHall(x,y,w,h,p){
    var g=E('g',{},p),l=x-w/2,r=x+w/2,t=y-h,b=y;
    E('path',{d:'M'+(l-6)+' '+b+' L'+(l+4)+' '+(t+8)+' L'+x+' '+(t-12)+' L'+(r-4)+' '+(t+8)+' L'+(r+6)+' '+b+' Z',
      fill:'#e8e0c8',stroke:INK,'stroke-width':1.9},g);
    for(var i=0;i<7;i++){
      var gx=l+16+i*(w-32)/6;
      E('line',{x1:gx,y1:b-h*0.62,x2:gx,y2:b-h*0.14,stroke:INK,'stroke-width':1.2},g);
    }
    E('line',{x1:l+10,y1:b-h*0.62,x2:r-10,y2:b-h*0.62,stroke:INK,'stroke-width':1.3},g);
    E('rect',{x:x-11,y:b-h*0.24,width:22,height:h*0.24,fill:'#d4cbb1',stroke:INK,'stroke-width':1.2},g);
    E('path',{d:'M'+(x-4)+' '+(b-h*0.12)+' L'+(x+4)+' '+(b-h*0.12),stroke:RED,'stroke-width':1.1},g);
    return g;
  }
  /* the Weighing Hall: a colonnade about an open floor, the fire behind its grating */
  function weighing(x,y,w,h,p){
    var g=E('g',{},p),l=x-w/2,r=x+w/2,t=y-h,b=y;
    E('path',{d:'M'+(l-26)+' '+(b+6)+' L'+(r+26)+' '+(b+6)+' M'+(l-16)+' '+(b+13)+' L'+(r+16)+' '+(b+13),
      fill:'none',stroke:FADE,'stroke-width':1.1,opacity:0.7},g);
    E('path',{d:'M'+l+' '+b+' L'+l+' '+t+' L'+x+' '+(t-26)+' L'+r+' '+t+' L'+r+' '+b+' Z',
      fill:'#eee8d4',stroke:INK,'stroke-width':2.1,fillOpacity:0.52},g);
    E('path',{d:'M'+l+' '+t+' L'+x+' '+(t-26)+' L'+r+' '+t,
      fill:'none',stroke:INK,'stroke-width':1.8},g);
    E('path',{d:'M'+(l-9)+' '+t+' L'+x+' '+(t-38)+' L'+(r+9)+' '+t+' Z',
      fill:'#e8e0c8',stroke:INK,'stroke-width':1.4},g);
    E('path',{d:'M'+(x-8)+' '+(t-24)+' L'+(x+8)+' '+(t-24),stroke:RED,'stroke-width':1.2},g);
    for(var i=0;i<7;i++){
      var cx=l+22+i*(w-44)/6;
      E('line',{x1:cx,y1:b-10,x2:cx,y2:t+6,stroke:INK,'stroke-width':2.0},g);
      E('line',{x1:cx-3,y1:t+6,x2:cx+3,y2:t+6,stroke:INK,'stroke-width':1},g);
    }
    /* the grating of cold iron over the never-out fire */
    var gx0=x-42, gy0=y-h*0.42, gw=84, gh=66;
    E('rect',{x:gx0,y:gy0,width:gw,height:gh,fill:'#3a3025',stroke:INK,'stroke-width':1.6},g);
    for(var k=1;k<9;k++){
      E('line',{x1:gx0+k*gw/9,y1:gy0,x2:gx0+k*gw/9,y2:gy0+gh,stroke:INK,'stroke-width':1.5,opacity:0.95},g);
    }
    E('line',{x1:gx0,y1:gy0+22,x2:gx0+gw,y2:gy0+22,stroke:INK,'stroke-width':1.2,opacity:0.8},g);
    E('line',{x1:gx0,y1:gy0+44,x2:gx0+gw,y2:gy0+44,stroke:INK,'stroke-width':1.2,opacity:0.8},g);
    E('path',{d:'M'+(x-16)+' '+(gy0+gh-8)+' q6 -18 14 -22 q-3 12 3 16 q8 -10 5 -22 q13 12 10 28 z',
      fill:RED,stroke:INK,'stroke-width':0.8,opacity:0.82},g);
    return g;
  }
  /* the College: ruled halls of Ledgerhand and the second file beside it */
  function college(x,y,w,h,p){
    var g=E('g',{},p),l=x-w/2,r=x+w/2,t=y-h,b=y;
    E('path',{d:'M'+(l-5)+' '+b+' L'+(l+3)+' '+(t+8)+' L'+x+' '+(t-8)+' L'+(r-3)+' '+(t+8)+' L'+(r+5)+' '+b+' Z',
      fill:'#e9e2cc',stroke:INK,'stroke-width':2},g);
    for(var i=0;i<8;i++){
      var vx=l+16+i*(w-32)/7;
      E('line',{x1:vx,y1:t+14,x2:vx,y2:b-12,stroke:FADE,'stroke-width':0.9,opacity:0.65},g);
    }
    E('line',{x1:l+10,y1:t+14,x2:r-10,y2:t+14,stroke:INK,'stroke-width':1.1,opacity:0.8},g);
    E('line',{x1:l+10,y1:b-12,x2:r-10,y2:b-12,stroke:INK,'stroke-width':1.1,opacity:0.8},g);

    return g;
  }
  /* barred strong-room of the sealed files */
  function barred(x,y,w,h,p){
    var g=E('g',{},p),l=x-w/2,r=x+w/2,t=y-h,b=y;
    E('path',{d:'M'+l+' '+b+' L'+l+' '+t+' L'+r+' '+t+' L'+r+' '+b+' Z',
      fill:'#ded8c2',stroke:INK,'stroke-width':1.9},g);
    for(var i=1;i<6;i++){
      var bx=l+i*w/6;
      E('line',{x1:bx,y1:t+7,x2:bx,y2:b-5,stroke:INK,'stroke-width':1.2},g);
    }
    E('rect',{x:x-7,y:t+h*0.4,width:14,height:h*0.34,fill:'none',stroke:RED,'stroke-width':1.2},g);
    E('path',{d:'M'+(x-2)+' '+(t+h*0.56)+' L'+(x+2)+' '+(t+h*0.56),stroke:INK,'stroke-width':1.4},g);
    return g;
  }
  /* one cell of the Kept: a narrow bed, a cold window, nothing to warm */
  function keptCell(x,y,p){
    var g=E('g',{},p);
    E('path',{d:'M'+(x-19)+' '+y+' L'+(x-19)+' '+(y-26)+' L'+(x+19)+' '+(y-26)+' L'+(x+19)+' '+y+' Z',
      fill:'#eae5d3',stroke:INK,'stroke-width':1.2},g);
    E('rect',{x:x-12,y:y-22,width:12,height:5,fill:'none',stroke:FADE,'stroke-width':0.8},g);
    E('line',{x1:x-14,y1:y-7,x2:x+14,y2:y-7,stroke:FADE,'stroke-width':0.9,opacity:0.8},g);

  }

    var g=E('g',{},p);
    E('path',{d:'M'+x+' '+y+' L'+x+' '+(y-32),stroke:INK,'stroke-width':1.4},g);

    E('line',{x1:x+4,y1:y-50,x2:x+32,y2:y-50,stroke:RED,'stroke-width':1,opacity:0.8},g);
    E('line',{x1:x+4,y1:y-43,x2:x+26,y2:y-43,stroke:FADE,'stroke-width':0.8},g);
    return g;
  }

  bankHall(392,1096,178,78,gBuild);                       /* the bank at the Hearthseat */
  weighing(800,1176,360,236,gBuild);                      /* the Weighing Hall over the fire */
  house(1024,1040,104,68,gBuild,true);                    /* the Steward's room */
  barred(624,1336,124,104,gBuild);                        /* the sealed files */
  college(1312,1356,300,200,gBuild);                      /* the College of Assessors */
  barred(1468,1300,64,72,gBuild);                         /* the second file */
  /* Slate Row frontages: officers' houses, no house-marks, no kin */
  [[1104,988],[1104,1088],[1104,1188],[1104,1288],[1104,1388],
   [1250,1000],[1250,1100],[1250,1500],[1250,1600]].forEach(function(c){ house(c[0],c[1],40,28,gBuild,false); });
  /* the rooms of the Kept: two quiet rows */
  for(var kc=0;kc<9;kc++){
    keptCell(316+kc*31,1560,gBuild);
    if(kc<8){keptCell(332+kc*31,1682,gBuild);}
  }
  /* the back rooms, behind the College, where the law is not spoken */
  [[1268,1496],[1332,1496],[1396,1496],[1268,1572],[1332,1572],[1396,1572]].forEach(function(c){
    E('rect',{x:c[0]-26,y:c[1]-40,width:52,height:40,fill:'#e4ddc7',stroke:INK,'stroke-width':1.1,opacity:0.9},gBuild);
  });
  E('path',{d:D(jit([[1230,1462],[1450,1454],[1450,1640],[1230,1646]],2.4,24),true),
    fill:'none',stroke:FADE,'stroke-width':1,'stroke-dasharray':'5 6',opacity:0.55},gBuild);
  /* dwellings of officers, set in plain blocks */
  [[560,1430],[640,1430],[720,1430],[820,1430],[900,1430],[980,1430],
   [560,1560],[640,1560],[720,1560],[820,1560],[900,1560],[980,1560],
   [560,1700],[660,1700],[760,1700],[860,1700],[960,1700],[1060,1700]].forEach(function(c){
    house(c[0],c[1],44,30,gBuild,false);
  });
  /* the printed notice and a slate-post on the Hall's approach */
  notice(690,1280,gBuild);
  E('path',{d:'M1080 1330 L1080 1292 L1102 1292 L1102 1330',fill:'none',stroke:INK,'stroke-width':1.3},gBuild);
  E('line',{x1:1084,y1:1302,x2:1098,y2:1302,stroke:RED,'stroke-width':1,opacity:0.8},gBuild);

  /* ---------- frames: cartouche, compass, legend, scale ---------- */
  E('path',{d:'M250 72 L1350 72 L1372 94 L1372 236 L1350 258 L250 258 L228 236 L228 94 Z',
    fill:'#e9e1cb',stroke:INK,'stroke-width':2.8,opacity:0.96},gFrame);
  E('path',{d:'M258 82 L1342 82 L1362 102 L1362 228 L1342 248 L258 248 L238 228 L238 102 Z',
    fill:'none',stroke:INK,'stroke-width':1.1,opacity:0.75},gFrame);
  for(var st=0;st<23;st++){
    var sx=266+st*48;
    E('path',{d:'M'+sx+' 90 l4 5 l-4 5 l-4 -5 z',fill:GOLD,stroke:INK,'stroke-width':0.4,opacity:0.6},gFrame);
    E('path',{d:'M'+sx+' 240 l4 -5 l-4 -5 l-4 5 z',fill:GOLD,stroke:INK,'stroke-width':0.4,opacity:0.6},gFrame);
  }
