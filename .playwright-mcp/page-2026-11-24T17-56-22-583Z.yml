          - generic [ref=f2e126]:
            - text: Ten days old with the market crust gone cold in the fold, the boy watched Sella Vail touch the widow's mark before she opened the kiln and at no other hour, measured the kindling stack with Tarn as four bundles and four and a space where the fifth should be while Sella arranged her loaves so the days to Kindling stood as a shape no collector could enter, heard Jorra say *you'll do* to a pot in bone-pale slip and move the damper before she had finished, and lay under Alda Reed's hand as she reached for her slate before she reached for him, touched the tin once inside her bodice, crossed two fingers at the red edge of his wrist without knowing it and covered the sign with an unasked-for date before writing a note she turned face-down into her shawl and went on giving dates after the question had stopped.
