          - generic [ref=f2e72]:
            - text: Sella Vail carries the boy in a basket under wool from the banked Vail kiln to Account-day at the Cross, where Berr Clay wipes his thumb on his apron and reads one in twelve, as the notice says, twice to two hundred leaning people while the boy counts a hundred and nine steps, eight pigs and the market bell's four-four-and-a-gap and hears the slate give its flat answer a third and a fourth time; Ostrowski's voice breaks through in the present tense with the two duties and a pocket with no phone in it, a clerk's neat hand with its small stop is seen a third time, Berr confirms Sella's widow's mark at Greybank as a kindness entered while leaving Garl's tile debt uncalled, Alda Reed crosses two fingers at the flower and covers the sign with a date, Mira Silt asks her own eel price without once looking at the basket and shoves a loose board clear, Ash goes out in a barrow toward the north gate and the Bone Orchard, and Sella turns back up the yard with the boy holding numbers he cannot spend and a note he cannot place.
