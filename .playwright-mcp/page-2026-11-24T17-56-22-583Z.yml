          - generic [ref=f2e54]:
            - text: In the kiln-house the fire keeps its four-and-four-and-a-gap breath around Garl's hollow wheel-seat, salt coat and unswept Ash ridge while Tarn pockets and returns the bench knife and Jorra declares the foundling is not Vail to a Sella who answers the pot instead, and three doors down Corin, two days old, hears the flat note of a cup he cannot reach, feels the warmed stone go past temperature, endures Alda's ordered washing and unasked-for dates and Des's laugh from a Chicago car park, while Dessa calls her cough weather, counts nineteen steps and refuses his name as the room arranges an unspoken question about who pays to keep him.
