            - text: Sella carried the eight-day-old boy down before light to buy eels, where Mira Silt worked with pale slime on her sleeves and the top of her left ear gone, flicked eel-bones while deciding whether to lie, gave Berr Clay four eels where six should go against his two marks short for six years, called the basket warm off the slate and not on one, and touched the grey cord at her waist when a figure was spoken, while a collector crossed the bridge with a soft cuff and two present-tense sentences of a cafeteria at four in the morning and a paper wrapper eaten to its last crumb broke through and were taken back by the river, and the boy counted four steps down and four and a landing where a step should have been before Sella bought two pair of eels and carried him home with the bucket swinging at her knee and river silt on the wool.
