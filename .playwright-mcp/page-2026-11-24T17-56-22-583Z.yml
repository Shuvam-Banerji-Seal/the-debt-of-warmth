          - generic [ref=f2e135]:
            - text: Tarn swept before light, set the small bench knife back on its sill and announced it to the empty yard, went still for two breaths when Sella said he had done well, then agreed flatly and swept on, while a pot turned toward on the bench gave nothing and his broom stopped half a stroke at the empty set-down and neither he nor the boy named the second interval, and Sella called the kiln's breath the danger a man slept into in Mud End and the district called that death merciful, Tarn held the pale ring at his left wrist up to the light and put the knife back where it could be checked, and Jorra shifted the damper with no slate dust on his forearms and did not say the back room was cold.
