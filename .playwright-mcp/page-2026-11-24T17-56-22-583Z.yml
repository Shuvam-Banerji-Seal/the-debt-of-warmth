            - text: Corin is born two hours old with Daniel Marchetti's whole memory and a branching red flower on his ribs; the stone Dessa warmed at the Vail fire goes cold at his belly while a name is entered in a neat dark hand on Alda's slate before anyone has looked at his face, Mira gives bread and keeps her back to the writing, and Sella's door-burned hand feels for the warmth, hovers over the bundle and withdraws with the third day still to come.
