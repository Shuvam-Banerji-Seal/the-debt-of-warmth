          - generic [ref=f2e189]:
            - text: After five clean mornings Jorra Vail came in with fine grey slate dust worked into the creases of his forearms past the bend of his little finger, said nothing of where he had been, told the wheel it did not care whose hands only if they were steady and went to the damper before Sella had finished, while low talk in the back room and missing slates under the drying racks stood only as shapes with a door kept shut, Sella got quieter and the yard straightened around it, and the boy filed the dust beside the ridge, the charred slate and the barrow of grey and made nothing of the likeness.
