          - generic [ref=f2e162]:
            - text: Sella carried the fourteen-day-old boy down in the basket and set him in the moot-post's shade a half-pace from every open slate, where the bell went four, four and a gap and nobody crossed himself, Berr Clay wiped his thumb and read one in twelve to two hundred leaning people, called the levy for the feast and said it was not called by him, went around the uncalled tile debt and did not look into the basket, and a soft-cuffed clerk at the Court's table laid his hand on the top slate before he looked at the woman waiting and said it stood as entered, while the boy saw the small pause in the neat dark hand a fourth time --- flare, birth-slate, Cross on Stone 10, now here --- unread and unjoined to the other three, with the Drawing collector's ordinary hand kept apart, and at dusk the coals hissed under ash, the fold was put right, the crust stayed cold in the fold and the Five were eleven days off.
