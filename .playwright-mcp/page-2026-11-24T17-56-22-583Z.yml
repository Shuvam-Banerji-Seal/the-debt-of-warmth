          - generic [ref=f2e144]:
            - text: The figure of the days went around the yards shut in a fist and arrived under the Vail roof only as an absence, and a neighbour at the threshold spoke around Garl's uncalled tile debt while Sella kept her half-pace and said *the house* where another woman would say I, and at the yard well another neighbour reached for her slate before her child and for two sentences the boy was in a ceiling light at four with a chart's note turned face-down and a hand going past it to a signature, then in a pocket that held wool where a lit phone with a name had lain, and the hand came back with nothing as he filed it beside the other record-first hands and found wool, woodsmoke and the cold crust at the end of the reaching.
