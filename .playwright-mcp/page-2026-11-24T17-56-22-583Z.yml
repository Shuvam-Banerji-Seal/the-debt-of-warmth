          - generic [ref=f2e63]:
            - text: Sella carries the covered bundle up the icy yard with the burn-door closing on its weight and the boy counting her steps, while Dessa stands at the end of nineteen steps she does not take with her thumb on the sieve-wire scar and Alda tells her he went in the levy among the children taken for the account and lets unasked-for dates settle over an unspoken figure, leaving the cold stone behind on the abandoned bed, and under the Vail roof the boy is laid on fresh straw with heat returning painfully to his hands and feet, hears Jorra's sentence sealed and Tarn's I'm-a-debt-not-a-foundling and a second flat note from a pot, and sees the charred edge of a slate in the kiln ash that he cannot reach, the market and the Cross still ahead.
