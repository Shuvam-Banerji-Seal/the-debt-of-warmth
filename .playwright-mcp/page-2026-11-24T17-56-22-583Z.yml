            - text: Sella Vail touched the widow's mark before she opened the kiln and at no other time and fed the seven-day-old boy barley gruel from the house's own dish while a pot on the shed bench was turned toward before it was set down and gave nothing, the interval kept as an object and the hearing count still five from four sources, while Tarn, the knife already back on its sill, saw the turning and stopped his broom half a stroke at the empty set-down and said nothing, Jorra worked the wheel with bone-pale slip and no slate dust, the number of days to Kindling went around as a closed fist and entered the house as an absence, Tarn's sixth year was counted and his seventh held back, and at dusk Sella banked the coals with the back of a broken pot and did not touch the mark.
