            - text: Sella set the nine-day-old boy in a patch of shade no slate had reached, where Dessa Silt stood at the end of nineteen steps with slip-grey nails, a sieve-wire scar and the cough from the pits called weather, counted four loaves on the seventh of Stone and bits to the woman with a basket, and did not look in, while a green-mouthed girl watched the pots and Mira's grey cord lay at her waist over a second cord never taken to Nine Pots before she put a brown-edged barley crust into the fold --- a crust, not a sermon --- that he could smell and feel but could not lift to his mouth, and at dusk Sella counted her loaves twice, Tarn put the small knife back on the sill and Jorra moved the damper, leaving the boy on his bed under the roof with the warmth at his side and his hand going up an inch and coming down, four, four and a gap.
