          - generic [ref=f2e81]:
            - text: Under coals that held all night Sella Vail touched the widow's mark before she opened the kiln and at no other time while the five-day-old boy could not keep wool on his chin and she put the fold right without looking, Tarn took the small bench knife, set it back where it could be checked and stopped his broom two strokes at a Vail pot's flat note without turning his head, Jorra spoke to the pots with slip dried to old bone on his forearms, and Alda Reed came under the roof to give a neighbour mother exact dates over a rekindled child going grey and wrote a note she turned writing-down, leaving the boy with cold, hunger and a sound nobody in the house named.
