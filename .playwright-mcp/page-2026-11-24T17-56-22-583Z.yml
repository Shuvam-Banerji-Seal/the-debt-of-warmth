          - generic [ref=f2e198]:
            - text: Alda Reed came under the roof smelling of soap and warm milk, laid the birth-slates writing-down on the bench before she turned to the basket, touched the little tin inside her bodice once without opening it, pressed the fold too long, crossed two fingers at the red edge of the birth-flower without knowing it and covered the sign with a date nobody had asked for, went on giving exact dates after the question had stopped, said warm and breathing which was exact and not true, and wrote on a narrow slate what she did not leave lying about, turning it face-down toward a floorboard in a house the boy could not name.
