          - generic [ref=f2e90]:
            - text: Sella carried the boy in the basket to a neighbour's house and set him at the edge of the light where a collector with a soft cuff took a cold iron tube to a dying man's arm and the man gave with the small flat knock --- fifth hearing of the note and first from a person --- while the figure read at the Cross was entered in a neat ordinary hand as the account stood, and later the rekindled child was worse on the third day of its return, Alda turned a second note down under a milk cup, the death-house Ash ridge measured a finger's width thicker than the ridge at Vail and turned the corner without a break, and the year's first measure had been taken from the dying and the newly born on the same day before Sella banked the coals at dusk, fed the boy from the house's own dish and passed Dessa Silt counting nineteen steps into her thumb at her threshold without a look into the basket.
