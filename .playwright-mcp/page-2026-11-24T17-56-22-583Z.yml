          - generic [ref=f2e153]:
            - text: A man come up from the river with water frozen on his legs held a shard of ice to the tallow light in which a dark hair ran and stopped a thumb's breadth short of the edge, a woman from High Kiln said the thaw would come early and everybody who wanted it late contradicted her because a late thaw puts off what is payable in the thaw, a neighbour back from the Court's room described its bench by the door, pot, draught and gap which the boy set beside the birth room and the death-house without joining them, and Sella measured the Ash by a thumb's width --- near two thumbs here and a finger more two doors down --- leaving both ridges to turn their corners unbroken until the Last Day while the household kept its number badly and he kept it exactly and could spend neither.
