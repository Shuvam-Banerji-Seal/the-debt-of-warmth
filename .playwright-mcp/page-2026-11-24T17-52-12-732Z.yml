    - region "An introduction to the saga" [ref=e36]:
      - heading "An introduction to the saga" [level=2] [ref=e37]
      - paragraph [ref=e38]: "A man dies in the snow with his hands around a child, and wakes in a country where the cold is not an accident but an arrangement. He keeps his memories. He keeps the habit of counting the exits in a room he has not entered, and the older habit of deciding which bodies are past help. What he does not keep is the use of his own hands: he is two hours old, cannot lift a cup, and is discussed by women who write something down in a neat dark hand before anyone has thought to look at his face."
      - paragraph [ref=e39]: This is Sarn, where warmth is a thing that can be measured, carried, banked and owed. The poor know it as the heat in a stone warmed at a neighbour's fire. The learned know it by another name and keep it in accounts. The child at the centre of this book has a surgeon's understanding of a failing body and a terrible eye for the exact moment a thing begins to cool. He has no words yet in which to say any of it.
      - paragraph [ref=e40]: The Debt of Warmth is not the story of a man who conquers a world. It is the story of a man who notices. Of rooms that need nothing decided and bodies that refuse to die quietly. Of kindness entered in a ledger, of bread handed over without a question, of a small red branching mark that nobody will name. It is a long book and it is still being written; every day is lived on the page before it is counted.
      - paragraph [ref=e41]: Read slowly. The days are not skipped. The account stands.
