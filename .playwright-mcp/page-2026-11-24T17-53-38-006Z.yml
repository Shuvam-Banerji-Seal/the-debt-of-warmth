          - paragraph [ref=f1e217]: In Low Kiln the weather was never the subject. It was the thing said in place of one.
          - paragraph [ref=f1e218]: "Corin took the room apart the way he had once taken a ward apart at four in the morning, reading who stood where and who had not sat down. Alda had written in two hands on one slate, one of them not her own, and had touched the tin when the questions came near it. Dessa had named a year and four loaves and nineteen steps and would not name the child lying three feet from her. Mira had crossed the floor to give bread and had stopped on the far side of the writing to do it, and had kept her back to the ink the whole time. Nobody had asked him anything. Nobody had looked at his face and then written; they had written first and the face had arrived afterwards underneath the words, which was a different order of things and one he recognized from the other side of a desk. He had spent twelve years entering people into charts. He had never once been entered. Now he had been entered twice: once in the neat dark hand he could not read, and once in the counting he kept for himself, which was the only entry in this room that belonged to nobody."
          - paragraph [ref=f1e219]: "The room had arranged itself around the not-saying, the way a yard leaves a clear run to the gate for a cart that has not come. The silence had a shape, and the shape had edges: a slate turned so that one woman could keep her back to it, a crust given before a speech could be made, a date put down where a name should have been, two hands on one stone slab with a gap between them the width of a life. The arrangement was not malice. That was the part that would not let him rest. If it had been malice he would have known what to do with it; he had worked in a building full of people who arranged their silences around a chart and called the arrangement policy. This was different. This was three women keeping a thing warm between them the way they keep the fire banked, with care and with frequency and without once asking the thing whether it wanted to be kept."
          - paragraph [ref=f1e220]: Under him the stone finished. It had given what it had and then had lain for a while at the temperature of the room, taking nothing and giving nothing, an ordinary stone in a fold of damp wool. Now it went past even that. The cold came up through the boards and the thin wool and took it, and it became a stone that was cold in its own right, with no warmth left in it to spend or to withhold, and he lay against it and was the only person in the room who had been keeping the account. There was no moment to mark and no sound to mark it with. A stone does not announce the hour at which it stops being a kindness. It is one, and then it is not, and the child it was warming is the only one who notices, and the child cannot speak.
          - paragraph [ref=f1e221]: Along the skirting board the grey ridge lay where it had lain for years, the width of a thumb, sifted out of the walls and the pots and the kept lives of the house. The Five were three days off. Nobody would sweep the ridge before the Last Day; it would be left where it was and put into the fire the next morning, which is a way of dealing with a thing by moving it somewhere it can no longer be read. He had known a building that kept its worst charts where anybody could see them and then burnt them, and called the burning an accident.
          - paragraph [ref=f1e222]: "And there was a third day in the room. It had not happened yet, and the room was full of its shape: a coming, a hand, a decision made already in the order of the reaching and the not-sitting and the not-saying. Somebody would come on the third day. He did not know who. The room did not say, and the slate with the neat dark line on it did not say, and the woman at the edge of the flare light had not looked up from her writing long enough to say it either."
          - paragraph [ref=f1e223]: The dip burned lower and the circle of light drew in around the pallet, leaving the corners to the Ash. He went back to the count because it was the only entry in the room that nobody could take from him, and the third day had not come. Then he stopped counting, because there was something to look at instead.
          - paragraph [ref=f1e224]: Alda’s hand lay on the edge of the slate where she had set it by the child’s head, and the other hand — the neat one, the one in dark ink — had dried into the grain of the slate beside it. In the fold of the grey wool the small stone lay cold. Warmth spent. Ink dry.
          - paragraph [ref=f1e225]: ❦
          - paragraph [ref=f1e226]: "The dip went out while he was looking at it. There was no struggle in it, no last brightening: the flame drew down into the wick, the circle of light on the boards closed like a hand, and the dark came back for a moment as though it had only been waiting for the room to turn its head. Then the dark thinned. It did not lift; it lessened, the way a pot lessens on a slow fire, leaving the strength of it at the bottom. The corners came back grey. Clay dust showed on the boards where no light had been an hour ago, and the ridge along the skirting board took on a colour at last, the colour of ash that has sat in a corner since before the child was thought of."
          - paragraph [ref=f1e227]: He had been awake the whole of the night and nobody had asked him once whether he wanted to be.
          - paragraph [ref=f1e228]: "Daniel Marchetti had worked nights in a building where the lights never went out, and had learned to read the hour by the faces of the people coming on shift. Here the hour was told by the light on the floor. He lay on his back under a wool blanket that would not stay on his shoulder and took the morning in the only way open to him: as a change in temperature, a weakening of the dark, a small cold weight against his belly where the stone had been and still was, only now with nothing in it. The stone had given what it had. It lay in its fold of wool with the indifference of a thing that has been spent and is no longer answerable."
          - paragraph [ref=f1e229]: Corin shifted one hand. The hand went where it was told, which was nowhere. He could not turn his head far enough to see the door, and he had already learned that turning it produced a small animal sound from him that made Dessa look up, so he stopped trying. A trauma surgeon who cannot turn his own head. The joke had worn out in the first hour and the fact had not.
          - paragraph [ref=f1e230]: "Something came into the doorway before the woman did. It came as a smell: woodsmoke first, and wet wool under it, and beneath both that faint sour mineral edge he had learned to place along the skirting board. Then the cold off the yard came in with it, and then the hand."
          - paragraph [ref=f1e231]: "The hand came across the room ahead of the body the way a hand goes ahead of a person in a dark passage, feeling for the edge of a thing. It was a broad hand with forearms the colour of dried slip, and on the back of it, across the knuckles and down toward the wrist, was a burn shaped like a little door: two straight sides, a lintel, a threshold, the skin inside it puckered and pale. He had seen fire write on skin before, in a country with different lights, but most burns are careless of shape. This one had a lintel. The fingers were half closed, not on anything, but closed the way a hand closes when it is used to carrying a cup and has decided to carry something else instead."
          - paragraph [ref=f1e232]: "The hand stopped at the fold of wool at his belly. It rested there. He felt the pressure through the blanket and the wool and the stone, a careful pressure, the pressure of someone feeling for heat and not finding it. The fingers changed at the knuckles, a small tightening, and went still. He understood the gesture without being able to place it in the room’s order of things: this person had come to see whether the warmth had held. It had not."
          - paragraph [ref=f1e233]: Then the hand moved up to the covered bundle and stopped above it.
          - paragraph [ref=f1e234]: Above, not on it.
          - paragraph [ref=f1e235]: The fingers opened and shut once, small, measuring a weight not yet lifted. He knew that movement. He had made it himself a thousand times, standing over a stretcher in a white room, estimating mass and grip and what the thing under the cloth would do when it was moved. He knew the difference between a hand that has come to take and a hand that has come to check. This hand had not decided which it was.
          - paragraph [ref=f1e236]: It did not take him.
          - paragraph [ref=f1e237]: The room held still around that. Mira was standing in her patch of floor with her back to where the slate had been and her face half toward the door, and she did not move. The small smile sat on her face as it had sat all night, on the latch, and her thumb went into her pocket and came out without the eel-bone, because this was not a moment for a sound. Dessa’s thumb went to the pale scar on her forearm and stayed there. Alda’s hand lay on the bench where she had set the slate, and none of the three looked at the woman in the door, and the woman in the door said nothing.
          - paragraph [ref=f1e238]: "That was the whole of the pause: four people in a room not looking at one another, and a hand waiting above a bundle."
          - paragraph [ref=f1e239]: "Dan read it the way he had read a trauma bay at four in the morning, when the senior stops giving orders, the nurse stops putting instruments down, and everybody in the room knows that a decision has been made somewhere above them and will now come down. He could see the shape of the decision. A foundling with no house-name is a coat left on a peg in a poor house: anybody can wear it, anybody can take it, and nobody is obliged to say who left it there. Three women had arranged the room around that fact for two hours without a word spoken about it, and now a fourth stood in the door with her hand out, and the arrangement was being put to the test. What would it cost to keep a boy who had no name anyone would speak? Who would pay for the warmth? These were the questions in the room. Nobody asked them. Nobody had to."
          - paragraph [ref=f1e240]: "He could read the hesitation as a physical thing, the fingers open and shut, the hand not closing on the wool, and he could not read the reason behind it, and the not-reading was like a chart turned face down on a desk he was not supposed to be standing at. He had spent twelve years being the person who decided which patients went to which bed. Now he was the bed. He was the thing being sorted, and he could not so much as lift his own hand to take part in it. He had no words in the language of this house for what the house was doing, but he knew the thing: a household that keeps its own roll and will not show it to a man come down from Slate Row with a slate in his hand."
          - paragraph [ref=f1e241]: Under the blanket he wanted the breast. It was a clean, small, stupid want, and it was louder than the hand and louder than the slate and louder than the smell of woodsmoke coming in off the yard. He had once read a man bleeding out and wanted a cup of water. The body keeps its own ledger and does not care what the mind enters in another. He drooled. A line of it went down into the wool at his neck and was not wiped, because no one in the room was looking at his face. He had reduced a thousand shoulders. He could not wipe his own chin.
          - paragraph [ref=f1e242]: “Cold in here,” Mira said. It was not an answer to anything anyone had said, because nobody had said anything. “Cold enough to keep.” She did not say what. She never said what. The eel-bone went tick once against her thumb and then she put it away, and the small smile stayed where it was, shut and harmless.
          - paragraph [ref=f1e243]: Dessa’s pulse had come up at her wrist. He could see it from where he lay, the quick light tapping in a vessel that had been quiet an hour ago. She had counted nineteen steps out and nineteen back for six years and had counted them tonight for a reason that was not the pits, and now the counting had stopped and the pulse had taken it up. She smiled. It was the smile her sister called the door shut, and it meant that nothing further would be said, and the hand in the doorway went on hovering above her child.
          - paragraph [ref=f1e244]: Alda’s fingers moved on the bench. She did not look up. In all the births she had attended, in a district where a woman with a question was a woman who wanted an answer written down, she had learned that the correct number of words in a room like this was none, and she kept to it. Her hand was steady. He knew from the first hour that steady hands were not the same thing as a woman who was not afraid.
          - paragraph [ref=f1e245]: The kiln had not breathed yet. The room smelled of its smoke without giving its sound, the way a house smells of a fire in the next street before anyone has seen the flame.
          - paragraph [ref=f1e246]: Sella Vail said nothing. She had not come into the room. The hand had come into the room and the smell had come into the room and the shadow of her stood in the door, and the woman herself had held back, as though she understood that a body in a room is a thing that must be answered for, and a hand is not.
          - paragraph [ref=f1e247]: The hand closed again. The little door of the burn shut on nothing, and the fingers went back to being a hand at her side, and the woman who owned it stepped back into the doorway and then out of it. She did not look at the child. She did not look at any of the women. Out in the Clay Yard her feet moved on clay dust, and the woodsmoke moved with her, and then both were gone from the room.
          - paragraph [ref=f1e248]: Alda’s hand went to the slate. She laid it flat on the bench with the neat dark line underneath and the chalk underneath and her own thumb-mark underneath, so that the room was a room again with no writing in it, and he could no longer see the shape of the hand he could not read. The slab made a small flat sound on the wood. It was the only sound anyone in the room had made in a long time.
          - paragraph [ref=f1e249]: Then, somewhere off the yard, a kiln drew breath.
          - paragraph [ref=f1e250]: "It came through the wall more than through the air: a low intake, a pause, and a long letting-out that went on longer than a breath has any right to, as though the thing had been holding it since the middle of the night and was only now permitted to spend it. Woodsmoke went with it. He knew the smoke. It was the smoke that had come off the crust of brown-edged barley an hour ago, and the smoke that had been in the rag round the warmed stone, and it had crossed this room twice already without once saying whose fire had paid for it. He could name the house that kept the fire. He could not name the hand that had stood in the door, and in this district those were two different things and the distance between them was where the whole arrangement lived."
          - paragraph [ref=f1e251]: The kiln breathed again. He counted it.
          - paragraph [ref=f1e252]: "He counted it the way he counted the boards, because it was there and because there was nothing else to count: four on the near board, four on the next, and a fifth that was not a nail but a knot the width of a thumb. Four breaths, four breaths, and then a fifth that was not a breath at all but the small space where the next one should have been, a gap the width of a thumb in the order of things. The fifth never came. The room went on breathing around it. He had counted pulses in a hundred bodies and exits in a hundred rooms and nails in these boards since he woke, and this was the only count he had ever kept that belonged to nobody but him. The slate had a name in it that someone else had written. The stone had been warmed at a fire someone else kept. The count was his. He kept it the way a man keeps the one thing in a building that is not entered against him."
          - paragraph [ref=f1e253]: The light came on further. Morning got into the yard and the yard got into the room, and the ridge of the Ash along the skirting board showed its whole length at last, from the bench to the door and under the door into the next room, where it would be left where it was until the Last Day and then swept into a fire and called dealt with. The Five were three days off. The ice on the Ilm was holding; they said at the Weir it would hold three days, and in Low Kiln a man says three days when he has counted what he has and does not want to say it. Somebody would come on the third day. The room had said it without a word, the way it had said everything else.
          - paragraph [ref=f1e254]: He went back to the stone. It was cold in its own right now, with nothing left to give or withhold, an ordinary river stone in a fold of damp wool against the belly of a child who could not have told anyone it had once been warm. He had been the only person in the room keeping that account, and the account was finished, and he had not been asked and had not been paid and had never once been given the number he wanted.
          - paragraph [ref=f1e255]: The hand had hovered. The name had been written in a hand he could not read. He did not know that either of them would come back for him; he knew only that the third day had not come, and that it was coming, and that until it did there was the cold stone at his belly and the four-and-four-and-a-knot of the floorboards under him, which nobody in the room could see and nobody in the room would have known to look for.
          - complementary [ref=f1e257]:
            - paragraph [ref=f1e258]: ❦ The Chronicle of Chapter 1 ❦
            - paragraph [ref=f1e259]: In the birth room off the Clay Yard in Low Kiln, a stone warmed at a neighbour’s fire lay against a newborn’s belly, already giving up its heat; nobody felt it go. Alda Reed worked with steady hands, clay under her nails, reaching for her slate before she reached for the child. “Warm the stone first,” she said. “A cold stone is a stone, not a kindness.” Dessa Silt lay in the aftermath, face to the wall, counting the nineteen steps she had walked from slip pit to rack for six years, rubbing the pale seam of a sieve-wire scar.
            - paragraph [ref=f1e260]:
              - text: Corin was two hours old and carried the whole memory of Daniel Marchetti, a trauma surgeon who died at 2:17 on a Chicago expressway, going back into a burning minivan for a child under the dashboard. His warmth left him in the giving and did not cool. The wipers had stopped, the fuel hissed, a phone lay lit in his pocket with a name he would not look at; at the edge of the flare a woman in a grey coat wrote on a slate, paused, wrote again, and did not stop when the fire took the van.
              - emphasis [ref=f1e261]: I have left the job unfinished.
            - paragraph [ref=f1e262]: "Alda lifted him and saw the branching red mark across his ribs and down the left forearm. She crossed two fingers over it, caught herself, and covered the act with a word and an unasked-for date from Nine Pots: birth-flower. Dessa would say no name. She called him the little hot one and pressed the wool flat at his shoulder with fingers that stayed longer than the cloth required."
            - paragraph [ref=f1e263]: On the slate a name stood in a neat dark hand, written before anyone looked at his face, in characters he had no key to --- though the pause between strokes was one he knew from the flare. Alda’s chalk sat beneath it; twice she touched the tin at her bodice. Mira Silt came in with eel slime on her sleeves, an eel-bone ticking. She would not stand where the slate lay open, answered a question with a question, and gave Dessa a crust of barley bread briskly. She knew more than she said and had arranged her face to keep it.
            - paragraph [ref=f1e264]: "The surgeon took the room apart and could do nothing. He knew the afterdrop and wanted the breast, and the wanting was louder. He drooled; he could not hold up his head or reach a cup. He counted four nails, four, and a knot where the fifth should be: the way out, though he did not know it. Toward morning a hand with a burn shaped like a little door felt for heat at his belly, hovered over the bundle, and did not take him. The slate shut; a kiln breathed off the yard. The Ilm lay under ice, the Five three days off, a coming on the third day. He lay under the spent stone with a count nobody could keep."
