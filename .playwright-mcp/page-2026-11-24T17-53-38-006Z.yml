          - paragraph [ref=f1e194]: The slate lay where it had lain since he woke in the room, a flat grey slab propped against the wall within reach of her right hand, cold to the look of it, with a dusting of chalk along its lower edge. He had known there was writing on it without looking, the way a man knows a chart is lying open on a desk before he has read the name at the top of it. Now he looked.
          - paragraph [ref=f1e195]: "There were two hands on the slate. The lower one was Alda’s: thick, round letters pressed hard into the chalk, a thumb-mark dragging through the tail of one of them, a short column of figures that ended in a date. The upper one was not hers. It ran along the top of the slab in a dark ink that had gone into the grain and dried there, upright and small and neat, with no stroke wasted and nothing crossed out. He could not have told you a letter of it. Grathic was a set of sounds that went past him while he lay under a wool blanket and did not come back; the written shape of it was a row of marks he had no key to. But he could read the shape of a hand the way he could read the shape of a stop, and this hand was strange to the room in a way he could not place, and he set it beside the other one and knew they had not been written by the same person or in the same hour."
          - paragraph [ref=f1e196]: "Daniel Marchetti had once walked into a room in the hospital where he worked and seen the top line of a chart lying open on a desk that was not his desk, with a name on it he had no business knowing. He had taken the line in at a glance and looked away, and the looking away had not changed the fact that he had read it. It was the same now. He was not supposed to be able to read this, and he read the shape of it anyway: short strokes at the first, a pause, more short strokes, and the pause always in the same place when he let his eye go back to it."
          - paragraph [ref=f1e197]: The pause did something to him. It was not the writing. It was the rhythm underneath it, the small decided gap between one motion and the next, the way a hand stops to think and then goes on without hurrying, and he had seen that rhythm at the edge of a flare light in the snow. A woman in a coat the colour of wet ash had held a slate where this slate was and put short strokes on it, then a pause, then more strokes, and the hand had not stopped when the fire took the van. He had filed that hand away without a name and without a thought, because there had been a child under the dashboard and a lit rectangle in his coat pocket with a name on it he would not look at. Now the same pause sat on a slab of grey stone within reach of a midwife’s hand in a clay room in Low Kiln, and the ink of it was dry.
