            - paragraph [ref=f1e83]: Day 1 · Stone 7, Y.H. 812, a Seventhday · the Ilm under ice, three days before the Five Cold Days · The birth room off the Clay Yard in Low Kiln, Sill, Grath; a brief breaking-through of the expressway near Chicago
          - blockquote [ref=f1e84]:
            - paragraph [ref=f1e85]: A stone at the belly is a stone borrowed from the fire. It goes cold. Somebody has had the warmth back, and nobody says whose.
            - paragraph [ref=f1e86]: — A hearth-maid’s saying, Low Kiln
          - generic [ref=f1e87]:
            - paragraph [ref=f1e88]: — Day 1 —
            - paragraph [ref=f1e89]: Stone 7, Y.H. 812 (Seventhday)
          - paragraph [ref=f1e90]:
            - generic [ref=f1e91]: T
            - text: he stone had been warm when the midwife put it against him and was warm no longer.
          - paragraph [ref=f1e92]: It lay under his belly in the fold of the cloth, a small river stone the colour of skimmed milk, giving up its heat with the slow reluctance of a thing that has been asked and has agreed. It had been warmed at a neighbour’s fire — at the kiln-house down the yard, where somebody kept banked coals through the cold — and carried here in a rag, still hot from a hearth that was not this hearth. That was a favour. It was not entered anywhere. Daniel Marchetti had known households where a kindness goes in warm and comes out written in a hand you cannot read, and men who warm a stone for a cot and never ask who paid for the fire. He could not have said which kind this was. He could only feel the stone going cold against him, a little at a time, the way he had once felt a patient’s core temperature fall under his palm.
          - paragraph [ref=f1e93]: "The child was Corin, two hours old, and called nothing yet that he could answer to. He lay on a fold of grey wool in the front room of House Silt, one of two clay-daubed rooms that opened off the Clay Yard in Low Kiln, the poor quarter of Sill, in Grath. The floor was trodden ash, packed by generations of feet until it had the dull spring of old bread, and along the skirting board ran a grey ridge the width of a thumb: the Ash, sifted out of the walls and the pots and the lives that had been kept here, left because nobody sweeps it before the Five. The Five were three days off. Outside, the Ilm lay under its skin of ice, and the cold came through the door that would not shut and went around the room looking for a place to sit."
          - paragraph [ref=f1e94]: It smelled of wet wool and tallow and clay dust, and under those the sour mineral edge of the Ash, which is the smell of a room that has been warm a long time and has kept things it should have let go. A woman sang somewhere in the house, a low song with the words flattened out by work, and the tune went under the skin and stayed. He understood the words. He could not make one.
          - paragraph [ref=f1e95]: Alda Reed worked with steady hands. She had the stoop of a woman who had spent her life leaning over other people’s births, and the forearms of one who had lifted other people’s children; her nails were scrubbed to the quick and still had clay under them, a thin brown line that no soap had ever got out. She addressed the stone first, turning it in the rag with two fingers the way a cook tests a pot, then the slip pot on the hearth, then the child, then the mother. She did not address the father, who was not in the room and would not be addressed. This was not cruelty. It was the correct number of words for a room where somebody was still in pain.
          - paragraph [ref=f1e96]: "The slate lay within reach of her right hand: a flat grey slab, a dusting of chalk, a line of writing in a strange neat hand that Dan did not look at twice because he had other things to look at and no way yet to look at anything. Her hand went to the slate before it went to the child. He registered the movement and filed it where he filed everything he could not use yet, under the heading of things that would matter later."
          - paragraph [ref=f1e97]: “Warm the stone first,” she said, and her voice was low and even, the voice of a woman who has said the same sentence four hundred times and never once said it carelessly. “A cold stone is a stone, not a kindness.” She said it to the stone, or to the room, or to Dessa Silt, who was in no condition to argue. Then something about the slip, about not setting it near the fire, about paying for it in the thaw — practical instruction addressed to the pot before it was addressed to a person, because the pot would answer and the person would not.
          - paragraph [ref=f1e98]: "Dessa lay with her face turned toward the wall and her breath coming in a rasp that Dan knew before he knew that he knew it: expiration long, inspiration short, a small catch at the end that was not relief but the body trying again. Her right hand went to her left forearm, to a pale scar the width of a sieve-wire, and rubbed it in a slow circular press while she counted under her breath."
          - paragraph [ref=f1e99]: “Nineteen,” she said. “Eighteen. Nineteen.”
          - paragraph [ref=f1e100]: She had walked those nineteen steps every day for six years, from the slip pit to the drying rack, and counted them then for the length of the working day, for the bits at the end of it, for the number of times her feet would go before she could stop. Now she was counting them for a different reason and Dan could not know what it was. He could only hear the count and know, with the part of him that had once stood under the lights of a trauma bay and sorted twenty people in ninety seconds, that she was not counting steps at all. She was holding something out of the room by counting it in.
          - paragraph [ref=f1e101]: "His eyes — his new eyes, wet and unfocused, not yet good at holding a face — went to the angle of her wrist instead of to her face. The scar sat where sieve-wire had cut it, and the way she pressed it told him she was deciding something she did not want to decide. He read the pulse at the wrist before he understood that he was reading it: quick, thready, a little irregular at the end of expiration. He read the colour under the nails, grey-blue at the beds, and the fine tremor in the hand, which was not from cold. He counted the exits without deciding to — the door to the yard, the window with its oiled paper, the gap under the lintel where light came in thin — and then counted them again to check the count. This was what his mind did now. It had nothing to do, so it took the room apart."
          - paragraph [ref=f1e102]: He watched Alda’s hands because they were the steadiest thing in the room. They did not hurry and they did not hesitate; they went from the stone to the slip to the cloth to the mother in an order that had been decided years before Dan was born and would not be changed now. He had worked with surgeons whose hands could not be hurried and with surgeons whose hands could not be trusted, and he could have told you which was which within a minute of watching them tie a knot. Alda tied nothing, but the order of her reaching was the same kind of signature. When she touched the little tin at her bodice — once, briefly, before she went back to the child — his eye caught the gesture and held it. He did not know what it was. He knew that it was a thing done every time and never for the first time.
          - paragraph [ref=f1e103]: "The stone was giving up its heat at a rate he could almost measure. Not fast — a stone gives heat the way a bank gives change, reluctantly, a little at a time — but steadily, and the rag between them was damp now where his body had sweated against it, and damp cloth draws heat faster than dry. He had watched patients cool in a white room far away and had known, without a thermometer, the exact point at which the surface warms and the core falls: the Afterdrop, the worsening that arrives wearing the face of improvement. He knew it the way a priest knows sin. There was no rewarming here, no blanket but the scrap of wool, no patient but himself, and still he knew the shape of it — knew that the warmth going out of the stone was going into a body that could not hold it, and that in a few minutes the body would be colder than it had been before the stone was put there."
          - paragraph [ref=f1e104]: He knew the Afterdrop when he saw it. He wanted the breast. Both were true and the second was louder.
          - paragraph [ref=f1e105]: The body that wanted was not the body that knew. The knowing body was a large soft man with forearms like a butcher’s and a left knee that clicked in the cold, a man who had reduced a thousand shoulders in the dark and could find the thin place under skin with two fingers and a name for it. The wanting body was two hours old, had never held anything up, and was cold and hungry and furious about it. It drooled. It could not hold up its head. When it tried to turn over it stayed where it was, and the grey wool that Alda had tucked around him had come loose at one corner and would not go back. He had set a femur in a ditch in the rain and he could not keep a scrap of wool on his own shoulder.
          - paragraph [ref=f1e106]: The joke was there, dry and small, and it cost him something. He did not laugh, because laughing is a thing the body does with air and the body had other plans for its air. It wanted. That was all it had ever wanted, and it wanted now with a whole man’s urgency in a vessel the size of a loaf.
          - paragraph [ref=f1e107]: He could not speak. He could not reach a cup. A trauma surgeon who could intubate in blood and in the dark, who could cut a way into a destroyed throat with a knife and a tube, lay in a fold of cloth and could not lift his own hand to his own mouth. There was a cup somewhere on the hearth — he had seen Alda set it down — and the distance to it was two paces, which is a long way when you have no hands for the journey. He could not have said the word for cup in Grathic. He could not have said it in English either, because the body had not yet learned to push air into words. He had a whole ledger in his head and no way to open it.
          - paragraph [ref=f1e108]: It was the first small grief of the new life, and it was not for the dead, or for the daughter in a country that had no name here, or for the call he had not made. It was for a pair of hands that could do nothing. He had spent twelve years being useful in the only way he knew how, which was to decide quickly and carry the decision, and here was a room that needed nothing decided and a body that would not do what it was told. The competence was intact. There was simply nothing behind it. It sat in him like an instrument in a dead man’s hand.
          - paragraph [ref=f1e109]: "Outside, something moved on the frozen river: not the river, but the ice under it, or the wind over it, a small sound like a hand rubbing dry paper. Dan listened to it because listening was what he had left. He counted the song against Dessa’s breathing and got a ratio that meant nothing and kept it anyway. He had been counting things for as long as he could remember, pulses and ribs and steps from the bed to the door in rooms he would never sleep in again, and he had never once been told that it was a gift. It was a habit. It was the way he had learned to stand in a room where he could not help."
          - paragraph [ref=f1e110]: A woman came in from the yard and stood just inside the door with the cold still on her sleeves. Mira Silt. Eel slime had dried on the wool in grey patches, and she smelled of river silt and salted perch and the cold off the water. There was something in her pocket that ticked when she moved her thumb, small and hard; she flicked it once against a nail and put it away. She did not sit. There was a stool by the wall and a clear place on the table where a slate might be laid, and she went near neither.
          - paragraph [ref=f1e111]: “Hold him?” she said, and it was not clear whether the question was for anyone. “You want me to. You don’t. I can see which one’s winning.” She looked at the child, or at the place where the child was, and did not reach for him. Then she said nothing further, and stayed standing.
          - paragraph [ref=f1e112]: Alda finished with the slip and wiped her hands on a rag that had been a shirt once. She lifted the child — not roughly, but as a woman lifts a sack of meal, with the whole weight taken in one movement — and set him back against the folded cloth, and in doing so turned him so that the stone slid a little and lay closer to the hollow of his belly. The grey wool went over him again. This time it stayed for a moment. Then an arm came out of it, small and brown and determined, and the wool was off at the corner again.
          - paragraph [ref=f1e113]: "“Keep him covered,” Dessa said, and her voice went flat and finished: nothing more to be said on it. She reached over and pressed the wool down at the corner with two fingers, pressing as if to seal something, and let her hand lie there a moment longer than the cloth required. The pale scar crossed the back of her forearm in the tallow light. Then she took her hand away and went back to counting, and what she was holding out of the room went back in."
          - paragraph [ref=f1e114]: Mira took her hand off the door frame and went out the way she had come, leaving the smell of silt and salt behind her and the small ticking stopped. She had not held him. She had not sat down. Dan watched her go with the part of him that watched people leave rooms and noted, without knowing why, that she had kept her back to the slate the whole time.
          - paragraph [ref=f1e115]: Alda went back to the slate and stood over it with the chalk in her fingers, and the room settled around the standing of her body the way water settles around a stone dropped in it. The banked fire on the hearth shifted and settled, and a small flame came up under the ash and went down again. She did not look at it. She wrote something on the slate, blew the dust off it, and set the slate down within reach of her hand again.
          - paragraph [ref=f1e116]: "Dan listened to the room the way he had once listened to a corridor at four in the morning: for the note under the noise. The fire had a small irregular tick as the clay of the flue cooled. Dessa’s breath had its rasp and its catch. Alda’s skirt dragged on the ash floor when she moved. Under all of it, under the song that had stopped and the count that went on, there was the stone, and it had a sound too if you put your ear to it — not a sound in the air but a sound in the body, the small settling of warmth leaving a thing that will not be warmed again. He had heard that sound in patients. He had never heard it in himself."
          - paragraph [ref=f1e117]: Under the child the stone had reached the point where it no longer gave heat but only failed to take it. The warmth that had been in it was in him now, or had gone into the room, and the room was warm around him with its fire and its wet wool and its breathing bodies, and nobody in it was cold. Nobody in it felt the stone go. Alda’s hand was on the slate. Dessa was counting under her breath. Mira was out in the yard with the cold still on her sleeves. And under the grey wool, in the hollow of a belly that did not yet know it was hollow, the stone went on giving up the last of what it had — quietly, without a sound, and with nobody the wiser.
          - paragraph [ref=f1e118]: ❦
          - paragraph [ref=f1e119]: Alda Reed lifted him then, in the room off the Clay Yard in Low Kiln, and the stone did not come with him.
          - paragraph [ref=f1e120]: "It stayed in the fold of grey wool where his belly had been, a small pale disc with the damp cloth cooling around it, and she did not look at it. She had come to lift a child and clean him, and the lifting was done with the whole weight taken at once, the way a woman lifts a sack of meal, and the cleaning was done with a rag she had warmed by holding it a moment inside her bodice before she touched him. Daniel Marchetti noted the rag. He noted the temperature of it, which was body-warm and not water-warm, and the order in which she wiped: face, neck, the crease at the groin, the back of the knees, the place where the cord had been cut. It was a good order. In a white room far away he had watched nurses clean a man who could not clean himself and had judged them by just such an order, and he judged her now, and the judgment was useless, because he could not have told her any of it and would not have been believed if he had."
          - paragraph [ref=f1e121]: The room went on with its work. Dessa Silt’s count ran under it, nineteen and eighteen and nineteen, and the fire gave its small irregular tick, and the door that would not shut let the cold in around the edge and went on letting it in. A woman sang somewhere below, and the song had its words worn flat by work, and he had already stopped listening for the tune. Corin lay where she put him, small and brown and slippery with slip, and did what he was told by the only part of him that had ever learned to obey.
          - paragraph [ref=f1e122]: Then the light changed.
          - paragraph [ref=f1e123]: Alda turned him to get the back of him, or turned him to wrap him, and the banked fire came up under the ash and put a low red light across the room, and the light went along his ribs and down his left forearm, and there was something on him that had not been there when he was a man.
          - paragraph [ref=f1e124]: It was red. Not the red of a bruise coming up under the skin, not the blue-black of a cord or a pressure mark, not the dusted pattern of petechiae he had seen on a dozen faces in the resuscitation bay. The lines ran finer than any of those and they branched. They started somewhere at the third rib on the left side, where the firelight caught them, and went down and outward like a thing growing, and one arm of them crossed the forearm and stopped just short of the wrist, as if it had been told where to stop. The colour was the colour of a coal that has given up its flame and kept its red, a deep ordinary red, not bright. It sat in the skin. There was no swelling at it, no heat he could feel through his own skin, no edge of injury; it was as if somebody had taken a fine brush and a red that came from inside the body and written a small branching sentence across him, and then closed the skin over it.
          - paragraph [ref=f1e125]: "He made a differential because that was what he did when a thing frightened him. A capillary mark. A bruise older than the bruises of birth. A stain from the cord, or from the hands that had pulled him. A birthmark, which was a word that meant nobody had looked closely enough. He ran through them the way he had run through a hundred rashes and patterns in a white room, and every one of them was wrong in the same way: they were things that happened to the skin, and this was a thing that had been written in it. The lines branched the way a burn branches when it follows warmth along a limb, and there was no burn. He had seen a man who had come out of a fire with just such a map on his arm, the skin whole and the red underneath it, and he had called it a burn map and entered it in a chart. He could enter nothing here. He could not lift his hand to touch the place. He could only lie in the red light and let the mark be the one thing in the room he could not put a name to."
          - paragraph [ref=f1e126]: Alda’s hands stopped.
          - paragraph [ref=f1e127]: It was half a beat, no more — the pause of a woman who has laid her hands on four hundred children and has never once had reason to take them back — but Daniel Marchetti had spent his life watching hands stop. He had seen a senior resident’s hand stop over a film, and a nurse’s hand stop half an inch from a chart, and he had learned to know before anyone spoke that the stop meant the thing on the table had changed and nobody had yet decided what to call it. His own hands, which were soft brown wrists with milky nails, lay where they lay. He could not have pointed at the mark. He could not have said what it was. He knew the shape of the stop, and he filed it, and the filing was the only thing in the room that belonged to him.
          - paragraph [ref=f1e128]: Her two fingers left the rag.
          - paragraph [ref=f1e129]: They went to the corner of the mark, to the place where the branching ended under his arm, and hovered there over the skin without touching it; then they came back across her own body in a small cutting of the air, forehead and breast and shoulder, finished before the motion had properly begun. It was an old thing done quickly, the way a woman crosses a threshold she has crossed ten thousand times and still touches the wood. It took less than a breath. Then her hands were on the rag again, and the rag was on him, and the moment was gone as completely as if it had never been in the room.
          - paragraph [ref=f1e130]: "Except that she had seen it. Alda Reed looked up from the child, and her face went through a small change that had nothing in it of surprise and everything of a door being shut quietly. She had made the sign over a child who had come from nowhere anybody could name, and she had made it where the mother might have seen it, and where the aunt standing in the door might have seen it, and there was no account in Grath for a thing like that. She covered it the way a woman covers a spilt cup: with a word."
          - paragraph [ref=f1e131]: “Birth-flower,” she said.
          - paragraph [ref=f1e132]: “What’s that?” Dessa said, from the pallet, without opening her eyes.
          - paragraph [ref=f1e133]: “That’s what they call them.” Alda wiped along his forearm and would not look at the place she had wiped. “They come like that. I saw one in Nine Pots in Y.H. 806, on the fourth day of Stone, on a potter’s third child, and there was nothing to it; he’s a carter in Stonemouth now.” She blew the dust off the slate without looking at it. “Not a thing to write home about.”
          - paragraph [ref=f1e134]: The count stopped. Dessa’s eyes opened a little in the tallow light. “Is he hot?” she said.
          - paragraph [ref=f1e135]: It was not a question about the mark. It was the question a woman asks about a child who has been given a stone to hold, and Dan knew the shape of it before he knew the words, because he had heard it in a hundred rooms from people standing at the foot of a bed.
          - paragraph [ref=f1e136]: “He’s warm,” Alda said. “That’s the whole of it. Warm and marked and breathing, which is more than some.”
          - paragraph [ref=f1e137]: “He’s the little hot one,” Dessa said, and the words went flat and finished, and the count went back to nineteen.
          - paragraph [ref=f1e138]: "Daniel Marchetti heard the date the way he had once heard a man clear his throat before giving a history that was not quite true. She had given a year and a day and a third child and a trade, none of which had been asked for, and all of which had the flat solid sound of a thing placed carefully over a hole. It was the small exactness of a woman choosing what to set down and what to leave out. He had signed a chart once without reading the nurse’s note underneath it, and the chart had been exact, and the note had been the thing that mattered, and the institution had called it a systems failure. He recognized the sound of it now in a clay room with a tallow dip, and it made nothing in him louder than curiosity, which was how he knew the infant’s body had won again: he wanted the breast, and he wanted to know what the woman had hidden, and the wanting was bigger than the knowing by the whole width of a man’s life."
          - paragraph [ref=f1e139]: Mira Silt had not come nearer. She stood just inside the door with the cold still on her sleeves, and her thumb went once into her pocket and came out, and the small hard thing ticked, and she put her hand back on the frame. She had not sat down. She said nothing about the flower. The grey ridge of the Ash ran along the skirting board behind her, and nobody in the room would sweep it before the Five.
          - paragraph [ref=f1e140]: Then the smell came.
          - paragraph [ref=f1e141]: "It came sideways, as smells do when a memory has no door to come through: bitter coffee that had sat too long on a hot plate, and under it the clean metal edge of a room scrubbed four times a day with the same mop. The tallow went thin. The clay went thin. The wet wool went away."
          - paragraph [ref=f1e142]: The white room is there.
          - paragraph [ref=f1e143]: The light in it is overhead and flat, and it comes down on a body on a table and on a nurse holding pressure in a cavity with both hands. Snow comes at the windows in a brown rush. Outside the glass the sodium lamps make orange tunnels in the snow, one tunnel behind another, and the tunnels go up the expressway toward the split, somewhere in Chicago, in February, at 2:17 in the morning. A flare stands in the snow and puts a red rim on everything it touches. The flare smokes cheaply; the smoke is acrid in the throat and lies under the sweetness of the fuel.
          - paragraph [ref=f1e144]: The wipers have stopped. They have been stopped for some time. Snow builds along the bottom of the windscreen in a fan and the fan grows. The engine is still running. Fuel goes out of the broken van with a hiss that changes over several minutes into something sweeter and worse, and the smell of antifreeze lies under it, and the cold comes in through the door he has left open.
          - paragraph [ref=f1e145]: He is working. Airway, bleeding, the end of the problem. There is a woman in the back seat of the minivan who is still moving, and snow has gone up his sleeves, and his fingers have stopped being reliable and he is angry at them. The order of the work does not matter now, because the fuel has caught.
          - paragraph [ref=f1e146]: The phone is in his coat pocket against his thigh. It vibrates. The screen is lit where his coat has ridden up, and a name is on it, and he does not look at the name. There is a boat on a lake in summer that he has promised for nine years, and a girl who grew up while he worked nights, and a sentence he has composed so often that nothing is left of it but weight. The weight is in the pocket with the phone. It is heavier than the phone. He does not look.
          - paragraph [ref=f1e147]: The cold is leaving his hands.
          - paragraph [ref=f1e148]:
            - text: "It goes out of them like water out of a wrung cloth, and the heat comes up through his sleeves from every direction at once, a quick enormous heat against a cold that has been there all night, so much of it that it is like being held. There is metal in his mouth. The hiss of the fuel goes on. The orange light goes on. And underneath all of it, finished and complete and with no words in it that anyone could have written down:"
            - emphasis [ref=f1e149]: I have left the job unfinished.
          - paragraph [ref=f1e150]: "At the edge of the flare light a woman stands in a coat the colour of wet ash. She has not come into the light. The flare puts a red rim on the snow at her feet and leaves the rest of her grey, so that she is a shape and nothing more: a coat, a head, a hand. She holds a slate in her hand, and the hand moves. It moves without hurry, short strokes at the top of the slate, then a pause, then more strokes. She has not touched the child. She has not once looked up. The hand moves. It does not stop when the fire takes the van."
