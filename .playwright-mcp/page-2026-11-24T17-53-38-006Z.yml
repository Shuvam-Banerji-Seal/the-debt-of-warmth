          - paragraph [ref=f1e215]: “Stone seven,” she said. “The seventh of the twelfth, in eight hundred and twelve. The ice is holding; they say at the Weir it’ll hold three days, though they said the same in Bone and were wrong by a week. Snow before the Five, likely. It’s a cold coming, and a child with a stone at his belly wants a warm room more than he wants a name.” She set the chalk down on the slab. “Warm and breathing. That’s all I’ve set down.”
