          - paragraph [ref=f1e212]: "The smoke came off the crust when her sleeve moved, and Dan smelled it from where he lay: woodsmoke, not tallow, the smoke of a kiln banked through a cold night. It was the same smoke he had smelled an hour ago on the rag that had come round the warmed stone. Warmth had come into this room twice in one night in the same wrapping — once as a stone for a child’s belly and once as bread for a child’s mother — and both times from the kiln-house down the yard, and neither time had anybody said whose fire paid for it. He could name the house because he had been told where the stone was warmed. He could not have named the hand that broke the bread, or the reason the same house should pay twice for the same cold family. He filed the loaf beside the stone and the stone beside the writing and went on lying there with a head he could not hold up."
