          - paragraph [ref=f1e159]: "The light from the dip reached in a small circle and left the corners to the Ash. He lay inside the circle and read what he could reach with his eyes, because his eyes were the only instruments he still had and they worked. Dessa’s hand hung over the edge of the pallet near his face. He could see the pulse at the wrist move the skin a little, a quick light tapping under the pale surface, and he could have told you the rate of it the way another man might tell you the time. He looked at the nails of that hand: the beds were the colour of tallow with a thin blue seam at the edge of them, and one nail had a white fleck in it that had not come off with washing. He looked at the inside of the left forearm where the pale scar lay, a long old seam where a sieve-wire had opened the skin six years ago and been left to close itself any way it could. She rubbed the scar with the thumb of the other hand when she was making up her mind about something. He had seen that gesture on the woman herself and on a hundred women before her. It was the gesture of a person standing at the edge of a thing and deciding how much of it to say."
